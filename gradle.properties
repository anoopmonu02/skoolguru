# Build performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Configuration cache is intentionally OFF. It wraps ordinary dependency
# resolution failures in a "state could not be cached / serialization error"
# message that hides the real cause. Turn it on later, once the build is stable.
org.gradle.configuration-cache=false
