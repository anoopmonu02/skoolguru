# =============================================================================
#  application-prod.properties
#
#  Active only when SPRING_PROFILES_ACTIVE=prod. Everything here OVERRIDES
#  application.properties; the dev experience is completely unaffected.
#
#  Why this file exists: application.properties is a development configuration
#  that was being shipped as-is. Templates were recompiled on every request,
#  static assets were served with no-cache, every SQL statement was logged, and
#  internal exception messages were returned to end users.
# =============================================================================

# ── Template caching ─────────────────────────────────────────────────────────
# Dev has this false so template edits show on refresh. In production it means
# Thymeleaf re-parses all 151 templates on every single request.
spring.thymeleaf.cache=true


# ── Static assets: content hashing + long cache ──────────────────────────────
# This is cache-busting WITHOUT a JS build tool. Spring rewrites
#     @{/css/tokens.css}  ->  /css/tokens-a1b2c3d4….css
# where the suffix is a hash of the file contents. Because the URL changes
# whenever the file changes, the response can be cached effectively forever —
# and a deploy invalidates it automatically. No more "tell the school to press
# Ctrl+F5 after we deploy".
spring.web.resources.chain.enabled=true
spring.web.resources.chain.cache=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# One year, immutable. Safe precisely because the filename carries the hash.
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true


# ── Error responses ──────────────────────────────────────────────────────────
# Dev returns the exception message and binding errors to the browser. That
# leaks internals (SQL fragments, class names, constraint names) to end users.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# ── SQL / logging ────────────────────────────────────────────────────────────
# Logging every statement costs real throughput and fills the disk. The binder
# logger is especially important to keep off: it writes bind parameter VALUES,
# which for this app means Aadhaar numbers, dates of birth and parent phone
# numbers in plaintext on disk.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.root=WARN
logging.level.com.smsweb.sms=INFO


# ── Schema ───────────────────────────────────────────────────────────────────
# Flyway owns the schema. Hibernate only verifies that the entities match and
# fails fast if they do not — it must never alter a production database.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true


# ── DevTools ─────────────────────────────────────────────────────────────────
# Disabled automatically when running from a jar, but be explicit.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false


# ── Session cookie hardening ─────────────────────────────────────────────────
# Requires HTTPS in front of the app (which production has, via the proxy).
# Env-overridable ONLY so the prod profile can be smoke-tested on http://localhost:
# with secure=true the browser will not send the session cookie over plain HTTP and
# you get an endless login redirect. Never set this to false on a real server.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
