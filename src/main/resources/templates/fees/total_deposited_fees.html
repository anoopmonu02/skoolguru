<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <!-- Page-specific styling only — same .aa-card filter convention + shared
         "list page" datatable chrome (list-table.css + list-table-init.js)
         as the other redesigned fee reports, so this one matches them. -->
    <style>
        .aa-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
        }
        .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .aa-icon {
            width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
            justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .aa-icon-accent { background: var(--accent-light); color: var(--accent); }
        .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

        .aa-btn-primary {
            background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
            border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
            transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
        }
        .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
        .aa-btn-primary:active { transform: translateY(1px); }
        .aa-btn-primary:disabled { opacity: .65; cursor: default; }

        #studentTable, #studentTable th, #studentTable td { font-size: .8rem; }
    </style>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Total Deposited Fee')}"></div>

                <div class="aa-card">
                    <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-funnel-fill"></i></span><h2>Filter</h2></div>
                    <div class="aa-sub">Pick an academic year, medium, grade and section, then click Get List to load deposited fees.</div>
                    <div class="row">
                        <div class="col-md-2">
                            <label for="academic_year" class="form-label">Academic Year</label>
                            <select name="academic_year" id="academic_year" class="form-select">
                                <option th:each="med : ${academicYears}" th:value="${med.id}" th:text="${med.sessionFormat}">Academic Year</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="medium" class="form-label">Medium</label>
                            <select name="medium" id="medium" class="form-select">
                                <option value="">Select Medium</option>
                                <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="grade" class="form-label">Grade</label>
                            <select name="grade" id="grade" class="form-select">
                                <option value="">Select Grade</option>
                                <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="section" class="form-label">Section</label>
                            <select name="section" id="section" class="form-select">
                                <option value="">Select Section</option>
                                <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">Section</option>
                            </select>
                        </div>

                        <div class="col-md-3 d-flex flex-column align-items-start">
                            <label class="form-label invisible">Action</label>
                            <button name="getfee" id="getfee" class="aa-btn-primary flex-fill"><i class="bi bi-search"></i> Get List</button>
                        </div>
                    </div>
                </div>

                <div id="printable-div" style="display: none">
                    <div th:replace="~{components/ui :: page-header('Deposited Fee(s) Detail')}"></div>

                    <div class="list-table-card">
                        <div class="config-list-toolbar list-page-toolbar">
                            <div class="config-search-wrap">
                                <i class="bi bi-search"></i>
                                <input type="text" class="form-control form-control-sm" id="tdfSearchInput"
                                       placeholder="Search by name, receipt#, grade…">
                            </div>
                            <div id="tdfExportSlot" class="list-export-slot"></div>
                        </div>

                        <div class="student-details" id="student-collection-data">

                        </div>

                        <div class="list-table-footer">
                            <div class="list-footer-left">
                                <label class="list-length-label">Rows per page
                                    <select id="tdfPageLength" class="list-length-select">
                                        <option value="5">5</option>
                                        <option value="10">10</option>
                                        <option value="25" selected>25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                    </select>
                                </label>
                                <span id="tdfPageInfo" class="list-page-info">Showing 0 of 0 students</span>
                            </div>
                            <div class="list-pagination" id="tdfPagination"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
    <script th:src="@{/js/flatpickr.js}"></script>
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>-->

    <script type="text/javascript" th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';
        flatpickr("#lastdate", {
            dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
        });

        function showWarningMsg(msgType, msg, headerValue){
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": false,
                "progressBar": false,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "600",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            }
            toastr[msgType](msg,headerValue);
        }

        // Escape HTML special chars so student/father/mother names, SR
        // numbers, receipt numbers and dates never break the table or run
        // as markup — this page previously rendered these fields completely
        // unescaped with no escHtml() helper defined at all (a genuine XSS
        // gap; the sibling fee reports already had this helper).
        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        $('#getfee').click(async function() {
            $("#student-collection-data").empty();
            $("#printable-div").hide();
            const medium = $('#medium').val();
            const grade = $('#grade').val();
            const section = $('#section').val();
            let academicYearVal = $("#academic_year").val();

            if(academicYearVal === '' || medium === '' || grade === '' || section === '' ){
                showWarningMsg('error','Academic Year/Medium/Grade/Section all are mandatory',"Warning");
                return;
            }
            let checkBoxes = "";

            let url = `${contextPath}getTotalDepositedFeeSubmittedDetailsForGrades`;
            try{
                const requestBody = {
                    checkBoxes: checkBoxes,
                    grade: grade,
                    medium: medium,
                    section: section,
                    academicYearId:academicYearVal
                };
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                console.log("response "+response);
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                //console.log("-----------------------------")
                const data = await response.json();
                /*console.log("res: "+data.FEE_DATA);
                console.log("res: "+data.NO_STUDENT_FOUND);
                console.log("res:3: "+data);
                console.log("res:4: "+data.error);*/
                if(data.NO_STUDENT_FOUND!=null){
                    $("#student-collection-data").empty();
                    $("#printable-div").hide();
                    showWarningMsg("error", data.NO_STUDENT_FOUND, "No Data");
                    return;
                } else if(data.NO_PARAMS_FOUND!=null) {
                    $("#student-collection-data").empty();
                    $("#printable-div").hide();
                    showWarningMsg("error", data.NO_PARAMS_FOUND, "No Data");
                    return;
                } else{
                    if (!data.FEE_DATA || data.FEE_DATA.length === 0) {
                        if(data.error.length >0){
                            showWarningMsg("error", data.error, "No Data");
                            return;
                        }
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg("error", "No matching data found", "No Data");
                        return;
                    }
                    // If userWiseFeeCollection is a string, show a message
                    if (typeof data.FEE_DATA === 'string') {
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg("error",`${data.FEE_DATA}`,"No Data");
                        return; // Stop further execution
                    }
                    if(data.FEE_DATA!=null){
                        let stulist = data.FEE_DATA;
                        /*console.log(stulist);
                        console.log(stulist.length);*/
                        let monthslist = data.MONTHS;
                        $("#printable-div").show();
                        let tblData = `<table class="table table-sm list-table" id="studentTable">
                            <thead>
                            <tr>
                                <th>SNo</th>
                                <th>Student Details</th>
                                <th>SR No</th>`;
                        for(let l=0;l<monthslist.length;l++){
                            tblData+=`<th>${escHtml(monthslist[l].toUpperCase())}</th>`;
                        }
                        tblData+=`</tr></thead><tbody>`;
                        let counter = 1;
                        for (let key in stulist) {
                            if (stulist.hasOwnProperty(key)) {
                                let studentData = stulist[key];
                                /*console.log("key====== "+key);
                                console.log("Student::: "+studentData[0]);
                                console.log("Student::: "+studentData[0].academicStudent);*/
                                let srno = studentData[0].academicStudent.classSrNo ? studentData[0].academicStudent.classSrNo.trim() : '';
                                let grd = studentData[0].academicStudent.grade.gradeName + ' - ' + studentData[0].academicStudent.section.sectionName;
                                //let stuDetail = studentData[0].academicStudent.student.studentName + '</br>' + studentData[0].academicStudent.student.fatherName + '</br>' + studentData[0].academicStudent.student.motherName + '</br';
                                let s = studentData[0].academicStudent.student;
                                let stuDetail = `${escHtml(s.studentName)}<br>${escHtml(s.fatherName)}<br>${escHtml(s.motherName)}<br>`;
                                let isActiveStudent = (studentData[0].academicStudent.status || '').toUpperCase() === 'ACTIVE';
                                let stuId = studentData[0].academicStudent.id;
                                console.log(" studentData[0].:"+studentData[0]);
                                tblData += `<tr class="${isActiveStudent?'':'table-danger'}">
                                    <td><small>${counter}</small></td>
                                    <td><small>${stuDetail}</small></td>
                                    <td><small>${escHtml(srno)}</small></td>`;
                                let myMap = new Map();
                                //for(let monName in monthslist){
                                console.log("stu length: "+studentData.length);
                                    let lastBalanceAmount = 0;
                                    let receiptNo = '';
                                    for (let i = 0; i < studentData.length; i++){
                                        let studentObj = studentData[i];
                                        let balanceAmount = studentObj.balanceAmount;
                                        if(balanceAmount!==undefined){
                                            lastBalanceAmount = balanceAmount;//>0?balanceAmount:lastBalanceAmount;
                                            receiptNo = studentObj.receipt;
                                        }
                                    }
                                    if(lastBalanceAmount>0){
                                        myMap.set(stuId + '####' + receiptNo, lastBalanceAmount);
                                    }

                                    console.log("myMap::: "+myMap.get((stuId + '####' + receiptNo)));
                                    for (let i = 0; i < studentData.length; i++){
                                        let studentObj = studentData[i];
                                        let feeLbl = '';
                                        let balanceAmount = undefined;
                                        let flag = false;
                                        let checkVal = stuId + '####' + studentObj.receipt;
                                        console.log("Balance:studentObj.balanceAmount:::: "+studentObj.balanceAmount+"  checkVal: "+checkVal);
                                        if(studentObj.balanceAmount!= undefined){
                                            balanceAmount = studentObj.balanceAmount;//studentObj.balanceAmount ?? 0; // nullish coalescing
                                        }
                                        if(myMap.has(checkVal)){
                                            balanceAmount = myMap.get(checkVal);
                                            flag = true;
                                        }
                                        console.log("Balance: "+balanceAmount)
                                        if(studentObj.blankData===1){
                                            feeLbl = ``;
                                        } else{
                                            feeLbl = `Receipt No: ${escHtml(studentObj.receipt)}<br>Date: ${escHtml(studentObj.submitDate)}<br>Amount: ₹ ${formatINR(studentObj.feeSubmitted)}<br>Late Fee: ₹ ${formatINR(studentObj.fineAmount)}`;
                                            if(studentObj.adminSpecialDiscountAmount){
                                                feeLbl+=`<br><strong style="color:red;">Admin Discount: ₹ ${formatINR(studentObj.adminSpecialDiscountAmount)}</strong>`;
                                            }
                                        }
                                        console.log("studentObj.balanceAmount----------------------"+balanceAmount + " i: "+(i+1) + " studentData.length: "+studentData.length);
                                        console.log("checkVal.split('####')[1] "+checkVal.split('####')[1] + "------flag: "+flag)
                                        if(flag){
                                            feeLbl+=`<br><small class="text-bg-danger">Balance Amount: ₹ ${formatINR(balanceAmount)}</small>`;
                                        }
                                        //console.log("studentData====== "+studentObj);
                                        //console.log("studentData.academicStudent====== "+studentObj.academicStudent);
                                        //console.log("Counter - "+i+"   --"+studentObj.totalPaidAmount+" - "+studentObj.submitDate);
                                        //let isStudentDataPresent = studentData==='NO_DATA_FOUND'?false:true;
                                        tblData+=`<td><small>${feeLbl}</small></td>`;
                                    }
                                //}
                                tblData+=`</tr>`;
                                counter++;
                            }
                        }
                        tblData+=`</tbody></table>`;
                        //console.log("table last-"+tblData)
                        $("#student-collection-data").html(tblData);

                        // Column count is dynamic — 3 fixed columns (SNo, Student
                        // Details, SR No) plus one per academic-year month — so the
                        // export column list is computed from the actual header
                        // count instead of a hardcoded index range (a hardcoded
                        // [0..14] silently mismatched whenever an academic year
                        // did not have exactly 12 months mapped).
                        const exportColumns = Array.from({length: 3 + monthslist.length}, (_, i) => i);

                        // Reset the search box / export slot / paging-length listeners
                        // before re-wiring — this handler can fire multiple times (once
                        // per "Get List" click), while only the table itself is torn
                        // down and rebuilt.
                        $('#tdfExportSlot').empty();
                        $('#tdfSearchInput').off('input');
                        $('#tdfPageLength').off('change');

                        initListDataTable({
                            tableSelector: '#studentTable',
                            searchInputSelector: '#tdfSearchInput',
                            exportSlotSelector: '#tdfExportSlot',
                            lengthSelectSelector: '#tdfPageLength',
                            pageInfoSelector: '#tdfPageInfo',
                            paginationSelector: '#tdfPagination',
                            itemLabel: 'students',
                            exportTitle: 'Total Students Deposited Fees Data export',
                            exportColumns: exportColumns,
                            printHeaderText: 'Total Students Deposited Fees Data',
                            dtOptions: {
                                scrollX: true,
                                autoWidth: false,
                                scrollCollapse: true,
                                paging: true,
                                sort: false,
                                fixedColumns: false,
                                columnDefs: [{ orderable: false, targets: [0] }],
                                // This report can have many month columns, so the PDF
                                // export needs landscape/A3/scaled-down text to stay
                                // readable — kept as a page-specific override of the
                                // shared Excel/CSV/PDF buttons (same export columns,
                                // same list-export-btn styling) rather than the shared
                                // helper's plain PDF default.
                                buttons: [
                                    {
                                        extend: 'excelHtml5',
                                        text: '<i class="bi bi-file-excel-fill"></i>',
                                        titleAttr: 'Excel',
                                        title: 'Total Students Deposited Fees Data export',
                                        className: 'list-export-btn',
                                        exportOptions: { columns: exportColumns }
                                    },
                                    {
                                        extend: 'csvHtml5',
                                        text: '<i class="bi bi-filetype-csv"></i>',
                                        titleAttr: 'CSV',
                                        title: 'Total Students Deposited Fees Data export',
                                        className: 'list-export-btn',
                                        exportOptions: { columns: exportColumns }
                                    },
                                    {
                                        extend: 'pdfHtml5',
                                        text: '<i class="bi bi-file-pdf-fill"></i>',
                                        titleAttr: 'PDF',
                                        title: 'Total Students Deposited Fees Data export',
                                        className: 'list-export-btn',
                                        orientation: 'landscape',
                                        scale: '40%',
                                        pageSize: 'A3',
                                        customize: function (doc) {
                                            doc.defaultStyle.fontSize = 8; // smaller font helps fit more columns
                                        },
                                        exportOptions: { columns: exportColumns }
                                    }
                                ]
                            }
                        });

                    }
                    if(data.error!=null){
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg('error', "11111 "+data.error, "Error");
                    }
                }


            } catch(error) {
                $("#student-collection-data").empty();
                $("#printable-div").hide();
                showWarningMsg('error', "There was a problem with the fetch operation: " + error, "Error");
            }
        });



    </script>
  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>

</body>
</html>
