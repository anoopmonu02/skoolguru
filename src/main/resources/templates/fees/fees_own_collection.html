<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>
</head>
<body>
<section>

  <style>
    /* ============================================================
       My Collection Report — filter card + toolbar + two report
       tables (Collection Summary, Collection Data). Styled off the
       same .aa-card / .aa-btn-* / Neo table conventions used on
       fees-user-wise-collection so this one (its logged-in-user-only
       twin) matches it.
       ============================================================ */
    .aa-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
    }
    .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
    .aa-icon {
      width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; flex-shrink: 0;
    }
    .aa-icon-accent { background: var(--accent-light); color: var(--accent); }
    .aa-icon-success { background: rgba(22,163,74,.10); color: #16a34a; }
    .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

    .aa-btn-primary {
      background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
      border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
      align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
    .aa-btn-primary:active { transform: translateY(1px); }
    .aa-btn-primary:disabled { opacity: .65; cursor: default; }

    /* Icon-only toolbar buttons (Print / Export PDF) — same "icon only,
       no label" convention as the camera-capture button on Update
       Student Images. */
    .fuc-toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
    .fuc-tool-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: var(--radius-md); flex-shrink: 0;
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);
      font-size: 16px; cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .fuc-tool-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .fuc-tool-btn-print { background: #16a34a; border-color: #16a34a; color: #fff; }
    .fuc-tool-btn-print:hover { background: #15803d; border-color: #15803d; color: #fff; }
    .fuc-tool-btn-pdf { background: #dc2626; border-color: #dc2626; color: #fff; }
    .fuc-tool-btn-pdf:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }

    /* Neo table look — no vertical grid lines, uppercase muted header,
       hairline row dividers, hover highlight. Copied 1:1 from the other
       report pages' #hr-table/#usi-table/#fuc-table conventions. */
    .fuc-table.table { border: none; width: 100%; margin-bottom: 0; }
    .fuc-table, .fuc-table th, .fuc-table td { font-size: .82rem; }
    .fuc-table thead th {
      text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 700;
      font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; background: var(--card-bg) !important;
      white-space: nowrap; border-top: none !important; border-bottom: 1px solid var(--border-color) !important;
    }
    .fuc-table tbody td {
      padding: 8px 12px; vertical-align: middle; border-top: none !important; border-left: none !important;
      border-right: none !important; border-bottom: 1px solid var(--border-color) !important; background-color: transparent !important;
    }
    .fuc-table tbody tr:hover td { background-color: var(--body-bg) !important; }
    .fuc-table tbody tr:last-child td { border-bottom: none !important; }
    .fuc-table tfoot td {
      padding: 10px 12px; font-size: .78rem; background: var(--body-bg) !important;
      border-top: 1px solid var(--border-color) !important; border-bottom: none !important;
    }
    .fuc-table-scroll { overflow-x: auto; }

    .fuc-meta-bar {
      display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-bottom: 12px;
      font-size: 12.5px; color: var(--text-muted);
    }
    .fuc-meta-bar strong { color: var(--text-primary); }

    .fuc-alert { border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px; }
    .fuc-alert-danger { background: rgba(220,38,38,.08); color: #dc2626; border: 1px solid rgba(220,38,38,.18); }
  </style>

  <div class="container-fluid px-3">
    <div class="col-md-12 ">
      <div th:replace="~{components/ui :: page-header('My Collection')}"></div>

    </div>
    <div class="row justify-content-center">
        <div class="col-md-12">
            <div class="aa-card">
              <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-funnel-fill"></i></span><h2>Filter</h2></div>

  <!-- Loading overlay — shown while fetch is in progress -->
  <div id="loading-overlay" style="display:none; position:fixed; inset:0; background:var(--overlay-bg);
       backdrop-filter:blur(3px); z-index:9999; flex-direction:column;
       align-items:center; justify-content:center;">

    </div>
  </div>

      <div class="fuc-toolbar" id="print-div" style="display: none">
          <button type="button" class="fuc-tool-btn fuc-tool-btn-print" id="printreceipt" onclick="printDiv('printable-div','Collection Summary')" data-div-id="printable-div" title="Print"><i class="bi bi-printer-fill"></i></button>
          <button type="button" class="fuc-tool-btn fuc-tool-btn-pdf" id="exportpdfbtn" onclick="printDiv('printable-div','Collection Summary')" data-div-id="printable-div" title="Export as PDF — opens the print dialog, choose &quot;Save as PDF&quot; as the destination"><i class="bi bi-file-earmark-pdf-fill"></i></button>
      </div>
    <div class="col-md-12 " id="printable-div" style="display: none">

        <div class="aa-card">
          <div class="aa-card-head"><span class="aa-icon aa-icon-success"><i class="bi bi-cash-coin"></i></span><h2>Collection Summary</h2></div>
          <div class="userwise-collection-info fuc-table-scroll" id="userwise-collection-info">

          </div>
        </div>

        <div class="aa-card">
          <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-table"></i></span><h2>Collection Data</h2></div>
          <div id="collection-data-dates" class="fuc-meta-bar">
                <div><strong>Start Date:</strong> <span id="collectionStartDateLabel"></span></div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
    <script th:src="@{/js/chart.js}"></script>
  <script type="text/javascript" th:inline="javascript">
      let isAdmin = [[${isAdmin}]];
      const contextPath = /*[[@{/}]]*/ '/';
      const monthOrder = /*[[${monthOrder}]]*/ {};

      if (isAdmin) {
          flatpickr("#startDate", {
              dateFormat: "d/M/Y"
          });
      } else {
          flatpickr("#startDate", {
              dateFormat: "d/M/Y",
              minDate: new Date().fp_incr(-9)
          });
      }
      if(isAdmin){
          flatpickr("#endDate", {
              dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
          });
      } else{
          flatpickr("#endDate", {
              dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
              maxDate: "today",
          minDate: new Date().fp_incr(-9)
          });
      }

    flatpickr("#currentDate", {
      dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
        minDate: "today",
        maxDate: "today"
    });








    document.addEventListener('DOMContentLoaded', function() {
      // Set initial current date
      const date = new Date();
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      const formattedDate =
              `${String(date.getDate()).padStart(2, '0')}/` +  // Day with leading zero
              `${months[date.getMonth()]}/` +                  // Month abbreviation
              `${date.getFullYear()}`;                         // Full year

      document.getElementById('currentDate').value = formattedDate;

      // Get radio buttons
      const todayRadio = document.getElementById('today');
      const rangeRadio = document.getElementById('range');

      // Get sections
      const todaySection = document.getElementById('todaySection');
      const rangeSection = document.getElementById('rangeSection');

      // Add event listeners
      todayRadio.addEventListener('change', toggleSections);
      rangeRadio.addEventListener('change', toggleSections);

      function toggleSections() {
        if (todayRadio.checked) {
          todaySection.classList.remove('d-none');
          rangeSection.classList.add('d-none');
          document.getElementById('currentDate').value = formattedDate;
        } else {
          todaySection.classList.add('d-none');
          rangeSection.classList.remove('d-none');
        }
      }
    });

    function escHtml(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    const validateAndSubmit=()=>{
      const selectedOption = $('input[name="dateOption"]:checked').val();
      let url = "";
      let proceed = true;
      if(selectedOption.trim() === ''){
        showMsg("error","No option selected","Error")
        proceed = false;
        return;
      }
      let requestBody = {};
      let dateValToday = '';
      let startDate = '';
      let endDate = '';
      url = `${contextPath}getFeeCollectionDetailsOwn`;
      if(selectedOption==='today'){
        proceed  = true;
        dateValToday = $("#currentDate").val();
        if(dateValToday===''){
          showMsg("error","Today's date is missing","Error")
          proceed=false;
          return;
        }
        requestBody = {
          todayDate: dateValToday,
          selectedOption: selectedOption
        };
      } else if(selectedOption === 'range'){
          proceed = true;
          startDate = $("#startDate").val();
          endDate = $("#endDate").val();
          if(startDate==='' || endDate===''){
            proceed = false;
            showMsg("error","Start Date/End Date both are mandatory","Error");
            return;
          }
          requestBody = {
            startDate: startDate,
            endDate: endDate,
            selectedOption: selectedOption
          };
      }
      if(proceed){
        // Show spinner, disable button
        const overlay = document.getElementById('loading-overlay');
        const proceedBtn = document.querySelector('button[onclick="validateAndSubmit();"]');
        overlay.style.display = 'flex';
        if (proceedBtn) { proceedBtn.disabled = true; }

        fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        })
            .then(response => {
                if (!response.ok) {
                  throw new Error('Network response was not ok');
                }
                return response.json();  // Parse response as JSON
            })
            .then(data => {
                // Hide spinner, re-enable button
                overlay.style.display = 'none';
                if (proceedBtn) { proceedBtn.disabled = false; }
                let rowData = data.finalData.userWiseFeeCollection;
                // If userWiseFeeCollection is a string, show a message
                if (typeof rowData === 'string') {
                    showMsg("error",`${rowData}`,"No Data");
                    overlay.style.display = 'none';
                    if (proceedBtn) { proceedBtn.disabled = false; }
                    return; // Stop further execution
                }
                $("#printable-div").show();
                $("#print-div").show();

                if(selectedOption === 'range'){
                    $('#collectionStartDateLabel').text(startDate);
                    $('#collectionEndDateLabel').text(endDate);
                } else {
                    $('#collectionStartDateLabel').text(dateValToday);
                    $('#collectionEndDateLabel').text(dateValToday);
                }

                let tableData = '<table class="table table-sm fuc-table"><thead><tr><th>SNo</th><th>User Name</th><th>Collection</th><th>Total Receipt(s)</th></tr></thead><tbody>';
                for(let i=0;i<rowData.length;i++){
                    let rowVal = rowData[i];
                    tableData+=`<tr><td>${(i+1)}</td><td>${escHtml(rowVal[3])}</td><td class="text-center"><span class="badge rounded-pill text-bg-success"> ₹ ${formatINR(rowVal[0])} </span></td><td>${rowVal[1]}</td></tr>`;
                }
                tableData+=`</tbody></table>`;
                $("#userwise-collection-info").html(tableData);

                //Setting fee data - userwise-collection-data
                let feeData;
                if(selectedOption === 'range'){
                    feeData = data.finalData.dateRangeFeeCollectionDetails;
                } else{
                    feeData = data.finalData.todayFeeCollectionDetails;
                }
                if (typeof feeData === 'string') {
                    $("#userwise-collection-data").html(`<div class="fuc-alert fuc-alert-danger"><strong>${feeData}</strong></div>`);
                } else {
                    let counter = 1;
                    let tblData = `<table class="table table-sm fuc-table">
                    <thead>
                        <tr>
                            <th>SNo</th>
                            <th>Grade</th>
                            <th>SR No</th>
                            <th>Student Name</th>
                            <th>Father Name</th>
                            <th>Months</th>
                            ${selectedOption === 'range' ? '<th>Submission Date</th>' : ''}
                            <th>Receipt No</th>
                            <th>Total Amount</th>
                            <th>Balance Amount</th>
                            <th>Paid Amount</th>
                            <th>Payment</th>
                            <th>User</th>

                        </tr>
                    </thead>
                    <tbody>`;
                    let totalAmountSubmitted = 0;
                    let totalAmount = 0;
                    let cashAmount = 0;
                    let onlineAmount = 0;
                    feeData.forEach(feeSubmission =>{
                        let srno = feeSubmission.academicStudent.classSrNo ? feeSubmission.academicStudent.classSrNo.trim() : '';
                        let dt = feeSubmission.feeSubmissionDate
                            ? new Date(feeSubmission.feeSubmissionDate).toISOString().split('T')[0] // Extracts "2025-01-22"
                            : '';

                        if (dt) {
                            let dateObj = new Date(dt);
                            dt = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                            dt = dt.replaceAll(" ","/");
                        }
                        let feeSubmissionMonths = feeSubmission.feeSubmissionMonths;
                        let month_names = '';
                        if (feeSubmissionMonths && feeSubmissionMonths.length > 0) {
                            let monthArr = [];
                            feeSubmissionMonths.forEach(m => {
                                monthArr.push(m.monthMaster.monthName);
                            });
                            // Sort months in academic-year sequence (falls back to original order if a month is missing from the map)
                            monthArr.sort((a, b) => {
                                let pa = monthOrder[a];
                                let pb = monthOrder[b];
                                if (pa === undefined && pb === undefined) return 0;
                                if (pa === undefined) return 1;
                                if (pb === undefined) return -1;
                                return pa - pb;
                            });
                            month_names = monthArr.join(', ');
                        }
                        tblData += `<tr>
                                <td>${counter}</td>
                                <td>${escHtml(feeSubmission.academicStudent.grade.gradeName)} - ${escHtml(feeSubmission.academicStudent.section.sectionName)}</td>
                                <td>${escHtml(srno)}</td>
                                <td>${escHtml(feeSubmission.academicStudent.student.studentName)}</td>
                                <td>${escHtml(feeSubmission.academicStudent.student.fatherName)}</td>
                                <td style="white-space: normal; word-break: break-word; min-width: 90px; max-width: 160px;">${escHtml(month_names)}</td>
                                ${selectedOption === 'range' ? `<td>${escHtml(dt)}</td>` : ''}
                                <td>${escHtml(feeSubmission.receiptNo)}</td>
                                <td class="text-end">₹ ${formatINR(feeSubmission.totalAmount)}</td>
                                <td class="text-end">₹ ${formatINR(feeSubmission.balanceAmount)}</td>
                                <td class="text-end">₹ ${formatINR(feeSubmission.paidAmount)}</td>
                                <td>${escHtml(feeSubmission.paymentType) || '-'}</td>
                                <td>${escHtml(feeSubmission.createdByName)}</td>

                            </tr>`;
                        totalAmountSubmitted+=feeSubmission.paidAmount;
                        totalAmount+=feeSubmission.totalAmount;
                        // Cash/Online split for the footer totals - uses the per-mode breakup
                        // when present (correct for "Both" submissions), falls back to the old
                        // paymentType-based split for historical rows saved before the breakup
                        // table existed. Per-row "Payment" column display elsewhere in this
                        // table intentionally still shows the plain paymentType - untouched.
                        cashAmount+=feeSubmission.cashAmount || 0;
                        onlineAmount+=feeSubmission.onlineAmount || 0;
                        counter++;
                    });
                    const totalCols = selectedOption === 'range' ? 13 : 12;
                    const col1 = Math.floor(totalCols / 4);
                    const col2 = Math.floor(totalCols / 4);
                    const col3 = Math.floor(totalCols / 4);
                    // Remaining goes to last column
                    const col4 = totalCols - (col1 + col2 + col3);
                    tblData+=`</tbody>
                    <tfoot>
                        <tr>
                            <td colspan="${col1}" class="text-center">Total Amount: <strong>₹ ${formatINR(totalAmount)}</strong></td>
                            <td colspan="${col2}" class="text-center">Total Cash Amount: <strong>₹ ${formatINR(cashAmount)}</strong></td>
                            <td colspan="${col3}" class="text-center">Total Online Amount: <strong>₹ ${formatINR(onlineAmount)}</strong></td>
                            <td colspan="${col4}" class="text-center">Total Paid Amount: <strong>₹ ${formatINR(totalAmountSubmitted)}</strong></td>
                        </tr>
                    </tfoot>
                    </table>`;
                    $("#userwise-collection-data").html(`
                        <div style="overflow-x:auto; width:100%;">
                            ${tblData}
                        </div>
                    `);
                }
            })
            .catch(error => {
                // Hide spinner, re-enable button
                overlay.style.display = 'none';
                if (proceedBtn) { proceedBtn.disabled = false; }
                console.error('Error:', error);  // Handle error response
                const errorMsg = '';
                showMsg("error", errorMsg, "Error");
            });
      }
    }

    function printDiv(divId, title) {
        // Get the original container element
        const originalContent = document.getElementById(divId);

        // Clone the container so we don't modify the live DOM
        const contentClone = originalContent.cloneNode(true);

        // Get all canvas elements from the original container
        const originalCanvases = originalContent.querySelectorAll('canvas');

        // For each canvas in the original, get its data URL and update the cloned copy.
        originalCanvases.forEach(originalCanvas => {
            const canvasId = originalCanvas.id;
            // Convert the original canvas to a data URL
            const imgData = originalCanvas.toDataURL("image/png");

            // In the clone, find the canvas with the same id.
            const clonedCanvas = contentClone.querySelector(`#${canvasId}`);
            if (clonedCanvas) {
                // Create an image element and set its src to the canvas data URL
                const img = document.createElement('img');
                img.src = imgData;
                // Copy width and height from the original canvas (or cloned one if attributes are preserved)
                img.width = originalCanvas.width/2;
                img.height = originalCanvas.height/2;
                // Replace the cloned canvas with the image element
                clonedCanvas.parentNode.replaceChild(img, clonedCanvas);
            }
        });

        // Open a new window for printing
        const printWindow = window.open('', 'PRINT', 'height=850,width=900,top=100,left=150');
        if (!printWindow) {
            alert('Popup blocked! Please allow popups for this site.');
            return;
        }

        // Build the HTML for the print window. Deliberately self-contained —
        // no CDN <link> (breaks with no internet/CDN blocked) and no local
        // Bootstrap <link> either (a root-relative /css/... href 404s once
        // this app is deployed under a context path like /sms/, which is
        // exactly why "pass a local file path" used to lose the report's
        // styling). Inlining the handful of rules the printed markup
        // actually needs sidesteps both failure modes for good.
        printWindow.document.write('<html><head><title>' + title + '</title>');
        printWindow.document.write(
            '<style>' +
            '@page { size: A4 landscape; margin: 8mm; }' +
            '* { box-sizing: border-box; }' +
            'body { margin: 0; padding: 10px; font-family: "Segoe UI", Arial, sans-serif; color: #0f172a; font-size: 10px; }' +
            '.page-header-title, h1 { font-size: 16px; margin: 0 0 10px; }' +
            '.aa-card { border: 1px solid #d0d5dd; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; page-break-inside: avoid; }' +
            '.aa-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }' +
            '.aa-card-head h2 { font-size: 12px; font-weight: 700; margin: 0; }' +
            '.aa-icon { display: none; }' +
            '.fuc-meta-bar { display: flex; gap: 16px; font-size: 10px; color: #555; margin-bottom: 6px; }' +
            'table { table-layout: fixed; width: 100%; border-collapse: collapse; margin-bottom: 0; }' +
            'table td, table th { white-space: normal; word-break: break-word; overflow-wrap: break-word; font-size: 8px; padding: 3px 4px; line-height: 1.25; border: 1px solid #d0d5dd; }' +
            'thead th { background: #f1f5f9; text-transform: uppercase; letter-spacing: .02em; }' +
            'tfoot td { background: #f8fafc; font-weight: 600; }' +
            '.text-center { text-align: center; }' +
            '.text-end { text-align: right; }' +
            '.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 8px; font-weight: 700; color: #fff; }' +
            '.text-bg-success { background: #16a34a; }' +
            '.fuc-alert { border-radius: 6px; padding: 6px 8px; font-size: 9px; }' +
            '.fuc-alert-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }' +
            '#userwise-collection-data table td:nth-child(6), #userwise-collection-data table th:nth-child(6) { width: 15%; }' +
            '</style>'
        );
        printWindow.document.write('</head><body>');

        // Write the cloned content (with images replacing canvases) into the new window
        printWindow.document.write(contentClone.innerHTML);
        printWindow.document.write('</body></html>');

        printWindow.document.close(); // necessary for IE >= 10
        printWindow.focus();          // necessary for IE >= 10

        // Wait for the content to load before printing
        setTimeout(function() {
            printWindow.print();
            printWindow.close();
        }, 1000);
    }
  </script>
  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
