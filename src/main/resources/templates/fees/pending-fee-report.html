<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <!-- Page-specific styling only — same .aa-card filter convention + shared
         "list page" datatable chrome (list-table.css + list-table-init.js)
         as the two Total Submitted Fee List reports, so all three fee
         reports match. -->
    <style>
        .aa-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
        }
        .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .aa-icon {
            width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
            justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .aa-icon-accent { background: var(--accent-light); color: var(--accent); }
        .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

        .aa-btn-primary {
            background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
            border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
            transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
        }
        .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
        .aa-btn-primary:active { transform: translateY(1px); }
        .aa-btn-primary:disabled { opacity: .65; cursor: default; }

        #studentTable, #studentTable th, #studentTable td { font-size: .8rem; }
        #studentTable .stu-avatar { width: 24px; height: 24px; font-size: .62rem; }
    </style>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Pending Fee')}"></div>

                <div class="aa-card">
                    <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-funnel-fill"></i></span><h2>Filter</h2></div>
                    <div class="aa-sub">Pick a medium, grade, section and month, then click Get List to load pending fees.</div>
                    <div class="row">
                        <div class="col-md-2">
                            <label for="medium" class="form-label">Medium</label>
                            <select name="medium" id="medium" class="form-select">
                                <option value="">Select Medium</option>
                                <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="grade" class="form-label">Grade</label>
                            <select name="grade" id="grade" class="form-select">
                                <option value="">Select Grade</option>
                                <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="section" class="form-label">Section</label>
                            <select name="section" id="section" class="form-select">
                                <option value="">Select Section</option>
                                <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">Section</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="month" class="form-label">Month</label>
                            <select name="month" id="month" class="form-select">
                                <option value="">Select Month</option>
                                <option th:each="med : ${monthmapping}" th:value="${med.monthMaster.id}" th:text="${med.monthMaster.monthName}">Month</option>
                            </select>
                        </div>
                        <!--<div class="col-md-2">
                            <label for="section" class="form-label">Last Date</label>
                            <input type="text" class="form-control" name="lastdate" id="lastdate"/>
                        </div>-->
                        <div class="col-md-4 d-flex flex-column align-items-start">
                            <label class="form-label invisible">Action</label>
                            <button type="button" name="getfee" id="getfee" class="aa-btn-primary flex-fill"><i class="bi bi-search"></i> Get List</button>
                        </div>
                    </div>
                </div>

                <div id="printable-div" style="display: none">
                    <div th:replace="~{components/ui :: page-header('Pending Fee(s) Detail')}"></div>

                    <div class="list-table-card">
                        <div class="config-list-toolbar list-page-toolbar">
                            <div class="config-search-wrap">
                                <i class="bi bi-search"></i>
                                <input type="text" class="form-control form-control-sm" id="pfrSearchInput"
                                       placeholder="Search by name, grade…">
                            </div>
                            <div id="pfrExportSlot" class="list-export-slot"></div>
                        </div>

                        <div class="student-details" id="student-collection-data">

                        </div>

                        <div class="list-table-footer">
                            <div class="list-footer-left">
                                <label class="list-length-label">Rows per page
                                    <select id="pfrPageLength" class="list-length-select">
                                        <option value="5">5</option>
                                        <option value="10">10</option>
                                        <option value="25" selected>25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                    </select>
                                </label>
                                <span id="pfrPageInfo" class="list-page-info">Showing 0 of 0 students</span>
                            </div>
                            <div class="list-pagination" id="pfrPagination"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
    <script th:src="@{/js/flatpickr.js}"></script>

    <script type="text/javascript" th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';
        flatpickr("#lastdate", {
            dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
        });

        function showWarningMsg(msgType, msg, headerValue){
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": false,
                "progressBar": false,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "600",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            }
            toastr[msgType](msg,headerValue);
        }

        // Escape HTML special chars so student/father names and fee-head/month
        // text never break the table or run as markup — this page previously
        // rendered these fields completely unescaped (a genuine XSS gap; the
        // sibling Total Submitted Fee List reports already had this helper).
        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Avatar-initials chip shown next to the student's name (same
        // palette/convention as Student List's .stu-avatar).
        const avatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
        const initialsOf = function (name) {
            return (name || '').trim().split(/\s+/).filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
        };

        $('#getfee').click(async function() {
            $("#student-collection-data").empty();
            $("#printable-div").hide();
            const medium = $('#medium').val();
            const grade = $('#grade').val();
            const section = $('#section').val();
            const month = $('#month').val();

            if(medium === '' || grade === '' || section === '' || month === ''){
                showWarningMsg('error','Medium/Grade/Section/Month all are mandatory',"Warning");
                return;
            }
            let checkBoxes = "";

            // Destroy existing DataTable instance before re-fetching
            if ($.fn.DataTable.isDataTable('#studentTable')) {
                $('#studentTable').DataTable().destroy();
            }

            let url = `${contextPath}getFeeReminderDetails`;
            try{
                const requestBody = {
                    checkBoxes: checkBoxes,
                    grade: grade,
                    medium: medium,
                    section: section,
                    lastdate: "",
                    month: month
                };
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                const data = await response.json();
                if(data.STUDENT_NOT_FOUND!=null){
                    $('.fetch-class-value').html('<p class="text-center">No data found.</p>');
                    $("#student-collection-data").empty();
                    $("#printable-div").hide();
                    showWarningMsg("error", "No matching student data found", "No Data");
                    return;
                } else{
                    if (!data.finalData || data.finalData.length === 0) {
                        if(data.error.length >0){
                            showWarningMsg("error", data.error, "No Data");
                            return;
                        }
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg("error", "No matching data found", "No Data");
                        return;
                    }
                    // If userWiseFeeCollection is a string, show a message
                    if (typeof data.finalData === 'string') {
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg("error",`${data.finalData}`,"No Data");
                        return; // Stop further execution
                    }
                    if(data.finalData!=null){
                        let stulist = data.finalData;

                        $("#printable-div").show();
                        let tblData = `<table class="table table-sm list-table" id="studentTable">
                                <thead>
                                <tr>
                                    <th>SNo</th>
                                    <th>Grade</th>
                                    <th>SR No</th>
                                    <th>Student Name</th>
                                    <th>Father Name</th>
                                    <th>Pending Amount</th>
                                    <th>Upto Month</th>
                                    <th>Fee Head(s)</th>
                                </tr>
                                </thead>
                                <tbody>`;
                        let counter = 1;
                        let totalAmount = 0;
                        for (let key in stulist) {
                            if (stulist.hasOwnProperty(key)) {
                                let studentData = stulist[key];
                                let srno = studentData.academicStudent.classSrNo ? studentData.academicStudent.classSrNo.trim() : '';
                                let grd = studentData.academicStudent.grade.gradeName + ' - ' + studentData.academicStudent.section.sectionName;
                                if(Number(studentData.amount) > 0){
                                    tblData += `<tr>
                                        <td>${counter}</td>
                                        <td>${escHtml(grd)}</td>
                                        <td>${escHtml(srno)}</td>
                                        <td>
                                            <div class="stu-cell">
                                                <div class="stu-avatar" style="background:${avatarColors[counter % avatarColors.length]}22;color:${avatarColors[counter % avatarColors.length]}">${initialsOf(studentData.academicStudent.student.studentName)}</div>
                                                <div class="stu-name-stack">
                                                    <span class="stu-name-text">${escHtml(studentData.academicStudent.student.studentName)}</span>
                                                    <span class="stu-sub-text">Grade: ${escHtml(grd)} &nbsp;|&nbsp; SR No.: ${escHtml(srno) || '\u2014'}</span>
                                                </div>
                                            </div>
                                        </td>
                                        <td>${escHtml(studentData.academicStudent.student.fatherName)}</td>
                                        <td>₹ ${formatINR(studentData.amount)}</td>
                                        <td>${escHtml(studentData.monthsList)}</td>
                                        <td>${escHtml(studentData.headList)}</td>
                                    </tr>`;
                                    totalAmount+=studentData.amount;
                                    counter++;
                                }
                            }
                        }
                        tblData+=`</tbody><tfoot>
                        <tr>
                            <td colspan="8" class="text-end">Total Pending Amount: <strong>₹ ${formatINR(totalAmount)}</strong></td>
                        </tr>
                        </tfoot></table>`;
                        $("#student-collection-data").html(tblData);

                        // Reset the search box / export slot / paging-length listeners
                        // before re-wiring — this handler can fire on the same static
                        // toolbar/footer markup multiple times (once per "Get List"
                        // click), while only the table itself is torn down and rebuilt.
                        $('#pfrExportSlot').empty();
                        $('#pfrSearchInput').off('input');
                        $('#pfrPageLength').off('change');

                        initListDataTable({
                            tableSelector: '#studentTable',
                            searchInputSelector: '#pfrSearchInput',
                            exportSlotSelector: '#pfrExportSlot',
                            lengthSelectSelector: '#pfrPageLength',
                            pageInfoSelector: '#pfrPageInfo',
                            paginationSelector: '#pfrPagination',
                            itemLabel: 'students',
                            exportTitle: 'Total Students Pending Fees Data export',
                            exportColumns: [0,1,2,3,4,5,6,7],
                            printHeaderText: 'Total Students Pending Fees Data',
                            // Student Name cell packs an avatar-initials badge + stacked
                            // Grade/SR sub-line for display; export should get just the
                            // plain student name (Grade/SR already export as their own
                            // hidden-on-screen columns).
                            exportBodyFormat: function (data, row, column, node) {
                                var $name = $(node).find('.stu-name-text');
                                return $name.length ? $name.text() : data;
                            },
                            dtOptions: {
                                scrollX: true,
                                columnDefs: [{ orderable: false, targets: [0] }, { visible: false, targets: [1, 2] }]
                            }
                        });

                    }
                    if(data.error!=null){
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg('error', data.error, "Error");
                    }
                }


            } catch(error) {
                $("#student-collection-data").empty();
                $("#printable-div").hide();
                showWarningMsg('error', "There was a problem with the fetch operation: " + error, "Error");
            }
        });



    </script>
  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. DataTables
       / Buttons / printThis / list-table-init are loaded globally too, via
       the page=='datatable' block in base.html (this controller already sets
       model.addAttribute("page", "datatable")). -->
</section>

</body>
</html>
