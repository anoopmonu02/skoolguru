<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <!-- Page-specific styling only — same .aa-card filter + fuc-toolbar /
         fuc-table conventions already used on the User(s) Collection /
         Own Collection report pages, so this one matches them. -->
    <style>
        .aa-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
        }
        .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .aa-icon {
            width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
            justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .aa-icon-accent { background: var(--accent-light); color: var(--accent); }
        .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

        .aa-btn-primary {
            background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
            border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
            transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
        }
        .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
        .aa-btn-primary:active { transform: translateY(1px); }
        .aa-btn-primary:disabled { opacity: .65; cursor: default; }

        /* Icon-only toolbar buttons (Print / Export PDF) — same "icon only,
           no label" convention used on the other collection report pages. */
        .fuc-toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
        .fuc-tool-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; border-radius: var(--radius-md); flex-shrink: 0;
            border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);
            font-size: 16px; cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }
        .fuc-tool-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
        .fuc-tool-btn-print { background: #16a34a; border-color: #16a34a; color: #fff; }
        .fuc-tool-btn-print:hover { background: #15803d; border-color: #15803d; color: #fff; }
        .fuc-tool-btn-pdf { background: #dc2626; border-color: #dc2626; color: #fff; }
        .fuc-tool-btn-pdf:hover { background: #b91c1c; border-color: #b91c1c; color: #fff; }

        /* Neo table look — no vertical grid lines, uppercase muted header,
           hairline row dividers. Copied 1:1 from the other report pages'
           fuc-table conventions. */
        .fuc-table.table { border: none; width: 100%; margin-bottom: 0; }
        .fuc-table, .fuc-table th, .fuc-table td { font-size: .82rem; }
        .fuc-table thead th {
            text-align: left; padding: 10px 12px; color: var(--text-muted); font-weight: 700;
            font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; background: var(--card-bg) !important;
            white-space: nowrap; border-top: none !important; border-bottom: 1px solid var(--border-color) !important;
        }
        .fuc-table tbody td {
            padding: 8px 12px; vertical-align: middle; border-top: none !important; border-left: none !important;
            border-right: none !important; border-bottom: 1px solid var(--border-color) !important; background-color: transparent !important;
        }
        .fuc-table tbody tr:hover td { background-color: var(--body-bg) !important; }
        .fuc-table tbody tr:last-child td { border-bottom: none !important; }
        .fuc-table tfoot td {
            padding: 10px 12px; font-size: .78rem; background: var(--body-bg) !important;
            border-top: 1px solid var(--border-color) !important; border-bottom: none !important;
        }
    </style>

    <div class="container-fluid px-3">
        <div class="col-md-12 ">
            <div th:replace="~{components/ui :: page-header('Head-wise Collection Summary')}"></div>

        </div>
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="aa-card">
                    <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-funnel-fill"></i></span><h2>Filter</h2></div>
                    <div class="aa-sub">Pick today, a date range, or a grade/section/month, then click Proceed to load the collection summary.</div>
                    <div class="row">
                        <div class="mb-3 col-md-4">
                            <label class="form-label">Select Option</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="dateOption" id="today" autocomplete="off" checked value="today">
                                <label class="btn btn-outline-success" for="today"><i class="bi bi-calendar2-event"></i> Today</label>

                                <input type="radio" class="btn-check" name="dateOption" id="range" autocomplete="off" value="range">
                                <label class="btn btn-outline-success" for="range"><i class="bi bi-calendar2-range"></i> Date Range</label>

                                <input type="radio" class="btn-check" name="dateOption" id="gradewise" autocomplete="off" value="gradewise">
                                <label class="btn btn-outline-success" for="gradewise"><i class="bi bi-mortarboard-fill"></i> Grade Wise</label>
                            </div>
                        </div>

                        <!-- Today Section -->
                        <div id="todaySection" class="date-section col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Selected Date</label>
                                <input type="text" class="form-control" id="currentDate" name="currentDate" readonly>
                            </div>
                        </div>

                        <!-- Range Section -->
                        <div id="rangeSection" class="date-section d-none col-md-6">
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label">Start Date</label>
                                    <input type="text" class="form-control" id="startDate" name="startDate">
                                </div>
                                <div class="col">
                                    <label class="form-label">End Date</label>
                                    <input type="text" class="form-control" id="endDate" name="endDate">
                                </div>
                            </div>
                        </div>

                        <!-- Grade Wise Section -->
                        <div id="gradewiseSection" class="date-section d-none col-md-6">
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">Medium</label>
                                    <select class="form-select" id="gradeWiseMedium" name="gradeWiseMedium">
                                        <option value="">Select</option>
                                        <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Grade</label>
                                    <select class="form-select" id="gradeWiseGrade" name="gradeWiseGrade">
                                        <option value="">Select</option>
                                        <option th:each="gr : ${grades}" th:value="${gr.id}" th:text="${gr.gradeName}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Section</label>
                                    <select class="form-select" id="gradeWisegradeSection" name="gradeWisegradeSection">
                                        <option value="">Select</option>
                                        <option th:each="sec : ${sections}" th:value="${sec.id}" th:text="${sec.sectionName}"></option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Month</label>
                                    <select class="form-select" id="monthmapping" name="monthmapping">
                                        <option value="all">All</option>
                                        <option th:each="sec : ${monthmapping}" th:value="${sec.monthMaster.monthName}" th:text="${sec.monthMaster.monthName}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-2 align-self-end">
                            <div class="col-sm-12 mb-3">
                                <button type="button" class="aa-btn-primary" onclick="validateAndSubmit();"><i class="bi bi-search"></i> Proceed</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="fuc-toolbar" id="print-div" style="display: none">
            <button type="button" class="fuc-tool-btn fuc-tool-btn-print" id="printreceipt" onclick="printDiv('printable-div','Collection Summary')" data-div-id="printable-div" title="Print"><i class="bi bi-printer-fill"></i></button>
            <button type="button" class="fuc-tool-btn fuc-tool-btn-pdf" id="exportpdfbtn" onclick="printDiv('printable-div','Collection Summary')" data-div-id="printable-div" title="Export as PDF — opens the print dialog, choose &quot;Save as PDF&quot; as the destination"><i class="bi bi-file-earmark-pdf-fill"></i></button>
        </div>
        <div class="col-md-12 " id="printable-div" style="display: none">

            <div th:replace="~{components/ui :: page-header('Collection Summary')}"></div>

            <div class="row">
                <div class="col-md-12">
                    <div class="aa-card">
                        <div class="userwise-collection-info fuc-table-scroll" id="userwise-collection-info">

                        </div>
                    </div>
                </div>
                <!--<div class="col-md-6">
                    <div id="chart-area" style="width: 400px; height: 400px;">
                        <canvas id="collectionChart"></canvas>
                    </div>
                </div>-->
            </div>

               <div class="row">
                    <div class="fee-details" id="userwise-collection-data">

                    </div>
               </div>
        </div>-->

        </div>
    </div>

    <script th:src="@{/js/chart.js}"></script>
    <script type="text/javascript" th:inline="javascript">
        let isAdmin = [[${isAdmin}]];
        const contextPath = /*[[@{/}]]*/ '/';
        /*flatpickr("#endDate", {
          dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
        });*///,"#startDate","#currentDate"

        if (isAdmin) {
            flatpickr("#startDate", {
                dateFormat: "d/M/Y"
            });
        } else {
            flatpickr("#startDate", {
                dateFormat: "d/M/Y",
                minDate: new Date().fp_incr(-9)
            });
        }
        if(isAdmin){
            flatpickr("#endDate", {
                dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
            });
        } else{
            flatpickr("#endDate", {
                dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
                maxDate: "today",
                minDate: new Date().fp_incr(-9)
            });
        }
        /*flatpickr("#endDate", {
            dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
            maxDate: "today",
            minDate: new Date().fp_incr(-9)
        });*/

        flatpickr("#currentDate", {
            dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
            minDate: "today",
            //maxDate: new Date().fp_incr(14) // 14 days from now
            maxDate: "today"
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Set initial current date
            const date = new Date();
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const formattedDate =
                `${String(date.getDate()).padStart(2, '0')}/` +  // Day with leading zero
                `${months[date.getMonth()]}/` +                  // Month abbreviation
                `${date.getFullYear()}`;                         // Full year

            document.getElementById('currentDate').value = formattedDate;

            const todayRadio    = document.getElementById('today');
            const rangeRadio    = document.getElementById('range');
            const gradewiseRadio = document.getElementById('gradewise');

            // Get sections
            const todaySection     = document.getElementById('todaySection');
            const rangeSection     = document.getElementById('rangeSection');
            const gradewiseSection = document.getElementById('gradewiseSection');

            // Add event listeners
            todayRadio.addEventListener('change', toggleSections);
            rangeRadio.addEventListener('change', toggleSections);
            gradewiseRadio.addEventListener('change', toggleSections);

            function toggleSections() {
                // hide all first
                todaySection.classList.add('d-none');
                rangeSection.classList.add('d-none');
                gradewiseSection.classList.add('d-none');

                if (todayRadio.checked) {
                    todaySection.classList.remove('d-none');
                    document.getElementById('currentDate').value = formattedDate;
                } else if (rangeRadio.checked) {
                    rangeSection.classList.remove('d-none');
                } else if (gradewiseRadio.checked) {
                    gradewiseSection.classList.remove('d-none');
                }
            }
        });


        function getRandomColor() {
            let r = Math.floor(Math.random() * 255);
            let g = Math.floor(Math.random() * 255);
            let b = Math.floor(Math.random() * 255);
            return `rgba(${r}, ${g}, ${b}, 0.6)`; // Background with opacity
        }
        //let collectionChart;
        const validateAndSubmit=()=>{
            $("#userwise-collection-info").empty();
            $("#printable-div").hide();
            $("#print-div").hide();
            const selectedOption = $('input[name="dateOption"]:checked').val();
            let url = "";
            console.log("Date option: "+selectedOption);
            console.log("-----------------------------------")
            let proceed = true;
            if(selectedOption.trim() === ''){
                showMsg("error","No option selected","Error")
                proceed = false;
                return;
            }
            let requestBody = {};
            url = `${contextPath}getFeeCollectionDetailsHeadwise`;
            if(selectedOption==='today'){
                proceed  = true;
                let dateValToday = $("#currentDate").val();
                if(dateValToday===''){
                    showMsg("error","Today's date is missing","Error")
                    proceed=false;
                    return;
                }
                requestBody = {
                    todayDate: dateValToday,
                    selectedOption: selectedOption
                };
            } else if(selectedOption === 'range'){
                proceed = true;
                let startDate = $("#startDate").val();
                let endDate = $("#endDate").val();
                if(startDate==='' || endDate===''){
                    proceed = false;
                    showMsg("error","Start Date/End Date both are mandatory","Error");
                    return;
                }
                requestBody = {
                    startDate: startDate,
                    endDate: endDate,
                    selectedOption: selectedOption
                };
            } else if(selectedOption === 'gradewise'){
                proceed = true;
                let mediumId  = $("#gradeWiseMedium").val();
                let gradeId   = $("#gradeWiseGrade").val();
                let sectionId = $("#gradeWisegradeSection").val();
                let monthName = $("#monthmapping").val();
                if(mediumId==='' || gradeId==='' || sectionId==='' || monthName===''){
                    proceed = false;
                    showMsg("error","All values are mandatory","Error");
                    return;
                }
                requestBody = {
                    mediumId:   mediumId   !== '' ? mediumId   : null,
                    gradeId:    gradeId    !== '' ? gradeId    : null,
                    sectionId:  sectionId  !== '' ? sectionId  : null,
                    monthName: monthName   !== '' ? monthName : null,
                    selectedOption: selectedOption
                };
            }
            if(proceed){
                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        console.log("======"+response);
                        return response.json();  // Parse response as JSON
                    })
                    .then(data => {
                        //console.log(">>>>>>--------"+data.finalData.userWiseFeeCollection);
                        let rowData = data.finalData.userWiseFeeCollection;
                        // If userWiseFeeCollection is a string, show a message
                        if (typeof rowData === 'string') {
                            showMsg("error",`${rowData}`,"No Data");
                            //$("#userwise-collection-info").html(`<div class="alert alert-warning">${rowData}</div>`);
                            return; // Stop further execution
                        }
                        $("#printable-div").show();
                        $("#print-div").show();

                        /*let labels = [];
                        let amounts = [];
                        let backgroundColors = [];
                        let borderColors = [];*/
                        let tableData = '<table class="table fuc-table"><thead><tr><th>SNo</th><th>Head Name</th><th>Total Amount</th></tr></thead><tbody>';
                        let totalAmt = 0;
                        for(let i=0;i<rowData.length;i++){
                            //console.log(rowData[i]);
                            let rowVal = rowData[i];
                            tableData+=`<tr><td>${(i+1)}</td><td>${escHtml(rowVal[0])}</td><td class="text-center"><span class="badge rounded-pill text-bg-success"> ₹ ${formatINR(rowVal[1])} </span></td></tr>`;
                            totalAmt+=rowVal[1];
                            /*labels.push(rowVal[0]); // User Name
                            amounts.push(rowVal[1]);
                            let color = getRandomColor();
                            backgroundColors.push(color);
                            borderColors.push(color.replace('0.6', '1'));*/
                        }
                        tableData+=`</tbody><tfoot><tr><td></td><td></td><td class="text-center"><strong>Total: </strong> ₹ ${formatINR(totalAmt)}</td></tr></tfoot></table>`;
                        $("#userwise-collection-info").html(tableData);
                        //generateChart(labels,amounts, backgroundColors, borderColors);
                    })
                    .catch(error => {
                        console.error('Error:', error);  // Handle error response
                        const errorMsg = '';//(error.includes('error#####'))?error.split("#####")[1]:error;
                        showMsg("error", errorMsg, "Error");
                    });
            }
        }

        // Escape HTML special chars so fee-head names never break the table
        // or run as markup — head names are admin-configured data, but this
        // table previously had no escaping infrastructure at all, unlike the
        // sibling collection report pages.
        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function printDiv(divId, title) {
            // Get the original container element
            const originalContent = document.getElementById(divId);

            // Clone the container so we don't modify the live DOM
            const contentClone = originalContent.cloneNode(true);

            // Get all canvas elements from the original container
            const originalCanvases = originalContent.querySelectorAll('canvas');

            // For each canvas in the original, get its data URL and update the cloned copy.
            originalCanvases.forEach(originalCanvas => {
                const canvasId = originalCanvas.id;
                // Convert the original canvas to a data URL
                const imgData = originalCanvas.toDataURL("image/png");

                // In the clone, find the canvas with the same id.
                const clonedCanvas = contentClone.querySelector(`#${canvasId}`);
                if (clonedCanvas) {
                    // Create an image element and set its src to the canvas data URL
                    const img = document.createElement('img');
                    img.src = imgData;
                    // Copy width and height from the original canvas (or cloned one if attributes are preserved)
                    img.width = originalCanvas.width/2;
                    img.height = originalCanvas.height/2;
                    // Replace the cloned canvas with the image element
                    clonedCanvas.parentNode.replaceChild(img, clonedCanvas);
                }
            });

            // Open a new window for printing
            const printWindow = window.open('', 'PRINT', 'height=850,width=900,top=100,left=150');
            if (!printWindow) {
                alert('Popup blocked! Please allow popups for this site.');
                return;
            }

            // Build the HTML for the print window. Deliberately self-contained —
            // no CDN <link> (breaks with no internet/CDN blocked) and no local
            // Bootstrap <link> either (a root-relative /css/... href 404s once
            // this app is deployed under a context path like /sms/). Inlining
            // the handful of rules the printed markup actually needs sidesteps
            // both failure modes for good.
            printWindow.document.write('<html><head><title>' + title + '</title>');
            printWindow.document.write(
                '<style>' +
                '@page { size: A4 portrait; margin: 10mm; }' +
                '* { box-sizing: border-box; }' +
                'body { margin: 0; padding: 10px; font-family: "Segoe UI", Arial, sans-serif; color: #0f172a; font-size: 11px; }' +
                '.page-header-title, h1 { font-size: 16px; margin: 0 0 10px; }' +
                'table { width: 100%; border-collapse: collapse; margin-bottom: 0; }' +
                'table td, table th { padding: 6px 8px; font-size: 10px; border: 1px solid #d0d5dd; }' +
                'thead th { background: #f1f5f9; text-transform: uppercase; letter-spacing: .02em; text-align: left; }' +
                'tfoot td { background: #f8fafc; font-weight: 600; }' +
                '.text-center { text-align: center; }' +
                '.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; color: #fff; }' +
                '.text-bg-success { background: #16a34a; }' +
                '</style>'
            );
            printWindow.document.write('</head><body>');

            // Write the cloned content (with images replacing canvases) into the new window
            printWindow.document.write(contentClone.innerHTML);
            printWindow.document.write('</body></html>');

            printWindow.document.close(); // necessary for IE >= 10
            printWindow.focus();          // necessary for IE >= 10

            // Wait for the content to load before printing
            setTimeout(function() {
                printWindow.print();
                printWindow.close();
            }, 1000);
        }
    </script>
