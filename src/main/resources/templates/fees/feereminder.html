<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>
    <!--
        Fee Reminder — filter panel and results chrome rebuilt on the same
        "Neo" design system as fees/feesubmitform-neo.html, fees/fee-receipt.html
        and fees/pendingbalanceform.html (icon+label card headers, chip/pill
        controls, shared design tokens). The actual reminder-notice markup
        built by buildReminderCard() below (what actually gets printed / sent
        as a notification) is unchanged - only the surrounding page chrome
        changed. Every id the inline script depends on (medium, grade,
        section, lastdate, reminder_language, getfee, monthcheckbox,
        contentToExport, printreceipt, sendReminderNotification) is unchanged.

        Print: the old printDiv() (window.open() + a hardcoded-version CDN
        Bootstrap <link>) is replaced with the same CDN-free SmsPrintUtils
        helper (see /js/print-utils.js) already used on fees/fee-receipt.html
        and fees/receipt.html. PDF export was deliberately NOT added here
        (unlike the receipt pages) - SmsPrintUtils.downloadElementAsPdf()
        rasterizes the element onto a single PDF page, which is fine for a
        one-receipt page but would badly squash a reminder run of more than
        a handful of students; Print (which paginates properly via the
        @media print rule below, same 4-per-page layout printDiv used to
        inject) is the correct fit for this page's multi-page content.
    -->
    <style>
        .fmr-card{ background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); }

        .fmr-filtercard{ margin-bottom:22px; }
        .fmr-icard-hd{ display:flex; align-items:center; gap:9px; padding:14px 18px; border-bottom:1px solid var(--border-color); }
        .fmr-icard-hd i{ color:var(--accent); font-size:1rem; }
        .fmr-icard-hd b{ font-size:.88rem; font-family:"Outfit", sans-serif; color:var(--text-primary); }
        .fmr-filterbody{ padding:18px 20px; }

        .fmr-nomapping{ display:flex; align-items:flex-start; gap:9px; background:#fff7ed; color:#9a5b13; border:1px solid #fed7aa; border-radius:var(--radius-md); padding:11px 14px; font-size:.82rem; line-height:1.45; margin-bottom:16px; }
        .fmr-nomapping i{ margin-top:2px; flex-shrink:0; }

        .fmr-fieldgroup{ margin-bottom:18px; }
        .fmr-fieldgroup-label{ display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:9px; }

        /* Month chips - the old markup put th:text on a bare <input>, which
           has no renderable body; browsers were silently dropping that text
           as a stray node right after the (void) checkbox. Real <label>s now
           wrap the checkbox + name, and .checked (toggled by a plain JS
           'change' listener below, not CSS :has()) drives the pill look so
           this keeps working on older WebView-based office PCs too. */
        .fmr-months{ display:flex; flex-wrap:wrap; gap:8px; }
        .fmr-month-chip{ position:relative; display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border:1px solid var(--border-color); border-radius:999px; font-size:.82rem; color:var(--text-primary); cursor:pointer; -webkit-user-select:none; user-select:none; transition:background .12s,border-color .12s,color .12s; }
        .fmr-month-chip:hover{ border-color:var(--accent); }
        .fmr-month-chip input{ position:absolute; opacity:0; width:0; height:0; }
        .fmr-month-chip.checked{ background:var(--accent); border-color:var(--accent); color:#fff; }

        .fmr-fields{ display:grid; grid-template-columns:repeat(5, 1fr) auto; gap:14px; align-items:end; }
        @media (max-width:1200px){ .fmr-fields{ grid-template-columns:repeat(3, 1fr); } }
        @media (max-width:700px){ .fmr-fields{ grid-template-columns:1fr; } }
        .fmr-label{ display:block; font-size:.76rem; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
        .fmr-field-btn{ display:flex; }
        .fmr-getbtn{ width:100%; white-space:nowrap; }

        .fmr-resultscard{ padding:18px 20px 20px; }
        .fmr-resultshd{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
        .fmr-resultshd .fmr-icard-hd{ padding:0; border-bottom:none; }
        .fmr-actions{ display:flex; align-items:center; gap:8px; }

        .fmr-empty{ padding:36px 18px; text-align:center; color:var(--text-muted); font-size:.88rem; }
        .fmr-empty i{ display:block; font-size:1.6rem; margin-bottom:8px; color:var(--border-color); }

        /* Same 4-reminder-cards-per-printed-page pagination printDiv() used
           to inject into its popup window's <head> - now just part of this
           page's own CSS, which printThis (see /js/print-utils.js) carries
           into the print iframe along with everything else already on the
           page, instead of a hand-rolled window.open() copy. */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            #contentToExport > div:nth-child(4n) { break-after: page; page-break-after: always; }
        }
    </style>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Fee Reminder')}"></div>

                <div class="fmr-card fmr-filtercard">
                    <div class="fmr-icard-hd"><i class="bi bi-funnel"></i><b>Select Criteria</b></div>

                    <div class="fmr-filterbody">
                        <div th:if="${!hasMonthMapping}" class="fmr-nomapping">
                            <i class="bi bi-exclamation-triangle"></i>
                            <span>Month mapping isn't set up for this academic year yet, so no months are available below. Please configure it first, then come back here.</span>
                        </div>

                        <div class="fmr-fieldgroup">
                            <span class="fmr-fieldgroup-label">Months</span>
                            <div class="fmr-months">
                                <label class="fmr-month-chip" th:each="mon : ${monthmapping}" th:for="${mon.monthMaster.id}">
                                    <input type="checkbox" class="monthcheckbox" th:id="${mon.monthMaster.id}" th:value="${mon.monthMaster.id}" th:name="months">
                                    <span th:text="${mon.monthMaster.monthName}">Month</span>
                                </label>
                            </div>
                        </div>

                        <div class="fmr-fields">
                            <div class="fmr-field">
                                <label for="medium" class="fmr-label">Medium</label>
                                <select name="medium" id="medium" class="form-select">
                                    <option value="">Select Medium</option>
                                    <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
                                </select>
                            </div>
                            <div class="fmr-field">
                                <label for="grade" class="fmr-label">Grade</label>
                                <select name="grade" id="grade" class="form-select">
                                    <option value="">Select Grade</option>
                                    <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
                                </select>
                            </div>
                            <div class="fmr-field">
                                <label for="section" class="fmr-label">Section</label>
                                <select name="section" id="section" class="form-select">
                                    <option value="">Select Section</option>
                                    <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">Section</option>
                                </select>
                            </div>
                            <div class="fmr-field">
                                <label for="lastdate" class="fmr-label">Last Date</label>
                                <input type="text" class="form-control" name="lastdate" id="lastdate"/>
                            </div>
                            <div class="fmr-field">
                                <label for="reminder_language" class="fmr-label">Reminder Language</label>
                                <select name="reminder_language" id="reminder_language" class="form-select">
                                    <option value="">Select Language</option>
                                    <option value="hi">हिंदी</option>
                                    <option value="en">English</option>
                                </select>
                            </div>
                            <div class="fmr-field fmr-field-btn">
                                <button name="getfee" id="getfee" class="btn btn-primary fmr-getbtn"><i class="bi bi-search"></i> Get List</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading overlay — shown while fetch is in progress -->
                <div id="loading-overlay" style="display:none; position:fixed; inset:0; background:var(--overlay-bg);
                     backdrop-filter:blur(3px); z-index:9999; flex-direction:column;
                     align-items:center; justify-content:center;">
                    <div class="text-center">
                        <div class="spinner-border text-primary" style="width:3.5rem;height:3.5rem;" role="status">
                            <span class="visually-hidden">Loading…</span>
                        </div>
                        <div class="mt-3 fw-semibold text-primary fs-5">Fetching reminder list…</div>
                        <div class="text-muted small mt-1">This may take a moment for large classes</div>
                    </div>
                </div>

                <div class="fmr-card fmr-resultscard" id="fmrResultsCard" style="display:none;">
                    <div class="fmr-resultshd">
                        <div class="fmr-icard-hd"><i class="bi bi-bell"></i><b>Reminder Notices</b></div>
                        <div class="fmr-actions show-data" style="display: none;">
                            <button class="btn btn-outline-secondary" id="printreceipt" title="Print" aria-label="Print"><i class="bi bi-printer-fill"></i></button>
                            <button class="btn btn-primary" id="sendReminderNotification" sms:access="MESSAGE_SEND:CREATE"><i class="bi bi-bell-fill"></i> Send Reminder Notification</button>
                        </div>
                    </div>

                    <div class="fetch-class-value" id="contentToExport" style="display:grid; grid-template-columns: 1fr; grid-auto-rows: min-content; row-gap: 24px;">

                    </div>
                </div>



            </div>
        </div>
    </div>

    <!-- Confirm modal for "Send Reminder Notification" — static backdrop + no ESC dismiss,
         must be explicitly closed or cancelled/confirmed. -->
    <div class="modal fade" id="sendReminderConfirmModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false" aria-labelledby="sendReminderConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="sendReminderConfirmModalLabel"><i class="bi bi-bell-fill text-primary"></i> Send Reminder Notification</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="sendReminderConfirmText" class="mb-0"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="sendReminderConfirmBtn"><i class="bi bi-send-fill"></i> Send</button>
                </div>
            </div>
        </div>
    </div>

    <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
    <script th:src="@{/js/flatpickr.js}"></script>
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>-->

    <script th:src="@{/js/printThis.js}"></script>
    <script th:src="@{/js/print-utils.js}"></script>

    <script type="text/javascript" th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';
        const schoolName = /*[[${school.schoolName}]]*/ '';
        const schoolAddress = /*[[${school.address}]]*/ '';

        // Cache of the last "Get List" result — reused as-is by "Send Reminder Notification"
        // (no recalculation on send, so the notification always matches exactly what was reviewed on screen).
        let lastReminderMap = null;
        let lastReminderLang = '';
        let lastReminderLastdate = '';

        const reminderLabels = {
            hi: {
                title: "मासिक शुल्क सूचना",
                student: "छात्र का नाम", father: "पिता का नाम", mother: "माता का नाम", cls: "कक्षा", section: "वर्ग",
                para: function(lastdate){
                    return "अभिभावक महोदय, आपके पाल्य/पाल्या का निम्नलिखित शुल्क जमा होना शेष है| अतः दिनांकः " + lastdate + " तक विद्यालय समय में निर्धारित शुल्क जमा कराने का कष्ट करें| उपरोक्त तिथि के बाद जमा होने वाला शुल्क बिना विलम्ब शुल्क के जमा नहीं किया जायेगा|";
                },
                total: "इस माह तक जमा होने वाला कुल मासिक शुल्क", months: "सम्मिलित माह", heads: "सम्मिलित मद",
                date: "दिनांक", principal: "प्रधानाचार्य",
                amount: function(amt){ return "₹ " + amt; }
            },
            en: {
                title: "Monthly Fees Reminder",
                student: "Student's Name", father: "Father's Name", mother: "Mother's Name", cls: "Class", section: "Section",
                para: function(lastdate){
                    return "Dear Parent/Guardian, the following fee for your ward is currently outstanding. Therefore, you are requested to kindly deposit the due amount during school hours by " + lastdate + ". Any payment made after this deadline will not be accepted without a late fee.";
                },
                total: "Total Outstanding Monthly Fees", months: "Applicable Months", heads: "Fee Components Included",
                date: "Date", principal: "Principal",
                amount: function(amt){ return "₹ " + amt; }
            }
        };

        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildReminderCard(lang, studentData, lastdate, formattedDate){
            const student = studentData.academicStudent.student;
            const grade = studentData.academicStudent.grade.gradeName;
            const section = studentData.academicStudent.section.sectionName;
            const L = reminderLabels[lang] || reminderLabels.hi;
            return '<div style="padding-bottom:18px;border-bottom:0.5px solid #ccc;display:flex;flex-direction:column;gap:6px;break-inside:avoid;page-break-inside:avoid;">'
                + '<div style="text-align:center;">'
                + '<div style="font-weight:bold;font-size:15px;">' + escHtml(schoolName) + '</div>'
                + '<div style="font-size:12px;font-weight:bold;color:#555;">' + escHtml(schoolAddress) + '</div>'
                + '<div style="font-size:13px;font-weight:bold;margin-top:4px;">' + L.title + '</div>'
                + '</div>'
                + '<div style="display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;">'
                + '<span><b>' + L.student + ':</b> ' + escHtml(student.studentName) + '</span>'
                + '<span><b>' + L.father + ':</b> ' + escHtml(student.fatherName) + '</span>'
                + '<span><b>' + L.mother + ':</b> ' + escHtml(student.motherName) + '</span>'
                + '<span><b>' + L.cls + ':</b> ' + escHtml(grade) + '</span>'
                + '<span><b>' + L.section + ':</b> ' + escHtml(section) + '</span>'
                + '</div>'
                + '<div style="font-size:12px;line-height:1.4;">' + L.para(lastdate) + '</div>'
                + '<div style="font-size:12px;">'
                + '<div><b>' + L.total + ':</b> ' + L.amount(studentData.amount) + '</div>'
                + '<div style="overflow-wrap:break-word;"><b>' + L.months + ':</b> ' + escHtml(studentData.monthsList) + '</div>'
                + '<div style="overflow-wrap:break-word;"><b>' + L.heads + ':</b> ' + escHtml(studentData.headList) + '</div>'
                + '</div>'
                + '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:bold;">'
                + '<span>' + L.date + ': ' + formattedDate + '</span>'
                + '<span>' + L.principal + '</span>'
                + '</div>'
                + '</div>';
        }

        flatpickr("#lastdate", {
            dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
        });

        // Chip-style month toggles - .checked mirrors the checkbox's real
        // :checked state via a plain JS-toggled class (not CSS :has()), so
        // this keeps working on older WebView-based office PCs too.
        $('.monthcheckbox').on('change', function () {
            $(this).closest('.fmr-month-chip').toggleClass('checked', this.checked);
        });

        function showWarningMsg(msgType, msg, headerValue){
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": false,
                "progressBar": false,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "600",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            }
            toastr[msgType](msg,headerValue);
        }

        $('#getfee').click(async function() {
            $('.fetch-class-value').html('');
            $('.show-data').hide();
            $('#fmrResultsCard').hide();
            const medium = $('#medium').val();
            const grade = $('#grade').val();
            const section = $('#section').val();
            const lastdate = $('#lastdate').val();
            const rem_lang = $('#reminder_language').val();

            if(medium === '' || grade === '' || section === '' || lastdate === '' || rem_lang===''){
                showWarningMsg('error','Please select Medium, Grade, Section, Last Date, and Reminder Language.',"Warning");
                return;
            }
            let counter = 0;
            let checkBoxes = "";
            let month_checkboxes = $('.monthcheckbox');
            month_checkboxes.each(function() {
                if($(this).is(':enabled') && $(this).is(':checked')){
                    counter++;
                    if(checkBoxes===""){
                        checkBoxes = $(this).attr("id");
                    } else{
                        checkBoxes = checkBoxes + "-" + $(this).attr("id");
                    }
                }
            });

            if (counter === 0) {
                showWarningMsg('error','Month(s) not selected',"Warning");
                return;
            }

            // Show spinner, disable button
            const overlay = document.getElementById('loading-overlay');
            const getFeeBtn = document.getElementById('getfee');
            overlay.style.display = 'flex';
            getFeeBtn.disabled = true;

            let url = `${contextPath}getFeeReminderDetails`;
            try{
                const requestBody = {
                    checkBoxes: checkBoxes,
                    grade: grade,
                    medium: medium,
                    section: section,
                    lastdate: lastdate
                };
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                console.log("response "+response);
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                console.log("-----------------------------")
                const data = await response.json();
                console.log("res: "+data.finalData);
                console.log("res: "+data.STUDENT_NOT_FOUND);
                if(data.STUDENT_NOT_FOUND!=null){
                    $('.fetch-class-value').html('<div class="fmr-empty"><i class="bi bi-search"></i>No matching students found for the selected filters.</div>');
                    $('#fmrResultsCard').show();
                    lastReminderMap = null;
                } else{
                    if(data.finalData!=null){
                        let stulist = data.finalData;
                        lastReminderMap = stulist;
                        lastReminderLang = rem_lang;
                        lastReminderLastdate = lastdate;
                        console.log(stulist);
                        console.log(stulist.length);
                        let divStr = '';
                        const today = new Date();

                        const day = String(today.getDate()).padStart(2, '0'); // Pad single digits with leading zero
                        //const month = String(today.getMonth() + 1).padStart(2, '0'); // Months are zero-based, so add 1
                        const month = today.toLocaleString('en-IN', { month: 'short' });
                        const year = today.getFullYear();

                        const formattedDate = `${day}/${month}/${year}`;
                        for (let key in stulist) {
                            if (stulist.hasOwnProperty(key)) {
                                let studentData = stulist[key];
                                divStr += buildReminderCard(rem_lang, studentData, lastdate, formattedDate);
                            }
                        }
                        /*console.log("div----"+divStr);
                        console.log("div----"+divStr.length);*/
                        if(divStr.length>0){
                            $('.fetch-class-value').html(divStr);
                            $('.show-data').show();
                            $('#fmrResultsCard').show();
                        } else{
                            $('.fetch-class-value').html('<div class="fmr-empty"><i class="bi bi-search"></i>No matching students found for the selected filters.</div>');
                            $('#fmrResultsCard').show();
                            lastReminderMap = null;
                        }

                    }
                    if(data.error!=null){
                        showWarningMsg('error', data.error, "Error");
                    }
                }


            } catch(error) {
                /*console.error('There was a problem with the fetch operation:', error);
                toastr["error"]("There was a problem with the fetch operation: " + error, "Error");*/
                showWarningMsg('error', "There was a problem with the fetch operation: " + error, "Error");
            } finally {
                overlay.style.display = 'none';
                getFeeBtn.disabled = false;
            }
        });

        // Students collected for the pending send — populated when the button is clicked,
        // consumed when the modal's "Send" button is confirmed.
        let pendingReminderStudents = [];
        let sendReminderModalInstance = null;

        $('#sendReminderNotification').click(function() {
            if (!lastReminderMap || Object.keys(lastReminderMap).length === 0) {
                showWarningMsg('error', 'Please click "Get List" first — no reminder data to send.', 'Warning');
                return;
            }

            pendingReminderStudents = [];
            for (let key in lastReminderMap) {
                if (lastReminderMap.hasOwnProperty(key)) {
                    let studentData = lastReminderMap[key];
                    pendingReminderStudents.push({
                        academicStudentId: studentData.academicStudent.id,
                        amount: studentData.amount,
                        monthsList: studentData.monthsList,
                        headList: studentData.headList
                    });
                }
            }

            $('#sendReminderConfirmText').text(`Send this fee reminder as a notification to ${pendingReminderStudents.length} student(s)?`);
            sendReminderModalInstance = bootstrap.Modal.getOrCreateInstance(document.getElementById('sendReminderConfirmModal'));
            sendReminderModalInstance.show();
        });

        $('#sendReminderConfirmBtn').click(async function() {
            const students = pendingReminderStudents;
            if (sendReminderModalInstance) sendReminderModalInstance.hide();

            const overlay = document.getElementById('loading-overlay');
            const overlayText = overlay.querySelector('.fw-semibold');
            const originalOverlayText = overlayText.textContent;
            overlayText.textContent = 'Sending reminder notifications…';
            const sendBtn = document.getElementById('sendReminderNotification');
            overlay.style.display = 'flex';
            sendBtn.disabled = true;

            try {
                const url = `${contextPath}message/sendFeeReminderNotifications`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: lastReminderLang,
                        lastdate: lastReminderLastdate,
                        students: students
                    })
                });
                const data = await response.json();
                if (!response.ok || data.error) {
                    showWarningMsg('error', data.error || 'Failed to send reminder notifications.', 'Error');
                    return;
                }
                if (data.skipped > 0) {
                    showWarningMsg('warning', `Sent to ${data.saved} student(s). ${data.skipped} skipped — check console for reasons.`, 'Partially Sent');
                    console.warn('Skipped reminder notifications:', data.skippedReasons);
                } else {
                    showWarningMsg('success', `Reminder notification sent to ${data.saved} student(s).`, 'Success');
                }
            } catch (error) {
                showWarningMsg('error', 'There was a problem sending the reminder notifications: ' + error, 'Error');
            } finally {
                overlay.style.display = 'none';
                overlayText.textContent = originalOverlayText;
                sendBtn.disabled = false;
            }
        });

        // Print goes through SmsPrintUtils (see /js/print-utils.js) instead of
        // the old printDiv() window.open() + hardcoded-CDN-Bootstrap approach -
        // it reuses this app's own local CSS as already rendered, so the
        // printed output always matches what's on screen and never depends on
        // an external CDN being reachable. The 4-cards-per-page pagination
        // printDiv used to inject into the popup's <head> now lives in the
        // @media print rule in this page's own <style> block, which printThis
        // carries into the print iframe along with the rest of this page's CSS.
        document.getElementById('printreceipt').addEventListener('click', function () {
            if (!lastReminderMap || Object.keys(lastReminderMap).length === 0) {
                showWarningMsg('error', 'Please click "Get List" first — no reminder notices to print.', 'Warning');
                return;
            }
            SmsPrintUtils.printElement('contentToExport', 'Fee Reminder');
        });

    </script>


  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
