<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>
</head>
<body>
<section>
  <!--
      Fee Receipt(s) List — card/table/search UI rebuilt on the same design
      system as fees/feesubmitform-neo.html and fees/pendingbalanceform.html
      (combined Student+Academic info card with avatar initials, a restyled
      table, icon+label section headers, and the shared da-search-wrap/
      da-result-row search box). Every id/class/name the inline script below
      depends on (search-input, StudentId, gradeId, feetable, disp-receipt,
      studname/fname/mname/contactno/cmedium/cgrade/csection/csr/studname1,
      etc.) is unchanged, so /searchStudentForFeePage, /getStudentFeeDetails
      and /student-receipt-print keep working exactly as before.

      Print/PDF: the old printDiv() (window.open() + a hardcoded CDN
      bootstrap <link>) is replaced with the same SmsPrintUtils helper
      (see /js/print-utils.js) already wired into fees/receipt.html this
      pass — printThis.js for Print, html2canvas+jsPDF for a real PDF
      download — so this page no longer depends on any CDN either, and the
      two actions are icon-only buttons side by side instead of one
      text+icon button.

      Receipt markup: createReceiptHTML()/createFeeMonthDetailHTML()/
      createFeeHeadDetailHTML() now build the "Neo" receipt layout (same
      #contentToExport structure/CSS as fees/receipt-neo.html, incl. its
      QR code, scoped under #contentToExport so it survives printThis's
      clone-drops-ancestors behavior - see the CSS comment below) instead
      of the old fees/receipt.html-style layout, from the exact same
      /student-receipt-print/{id} JSON this page already fetched. The old
      fees/receipt.html/receipt-print/{id} route is untouched.
  -->
  <style>
    /* ── Search box — same da- pattern used on Fee Submission Neo / Collect Balance ── */
    .da-search-wrap { position: relative; margin-bottom: 18px; max-width: 460px; }
    .da-search-wrap input { padding-left: 38px; }
    .da-search-wrap .bi-search { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .da-search-results { position: absolute; z-index: 20; width: 100%; max-height: 320px; overflow-y: auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); margin-top: 4px; display: none; }
    .da-result-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
    .da-result-row:last-child { border-bottom: none; }
    .da-result-row:hover { background: var(--accent-light); }
    .da-result-name { font-weight: 600; color: var(--text-primary); font-size: .85rem; }
    .da-result-sub { font-size: .72rem; color: var(--text-muted); }
    .da-result-empty { padding: 14px; color: var(--text-muted); font-size: .85rem; text-align: center; }

    /* ── Cards ── */
    .fr-card{ background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); }

    /* Student+Academic card / side "quick view" table — two-column row, same
       shape as the Fee Submission Neo / Collect Balance info grids. Below
       900px it stacks, same as those pages. */
    .fr-infogrid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; align-items:stretch; }
    @media (max-width:900px){ .fr-infogrid{ grid-template-columns:1fr; } }

    .fr-combocard{ display:flex; gap:16px; height:100%; padding:18px 20px; box-sizing:border-box; }
    .fr-combo-left{ flex:1; min-width:0; }
    .fr-combo-namerow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .fr-combo-namerow .studname{ font-size:1rem; font-family:"Outfit", sans-serif; color:var(--text-primary); }
    .fr-combo-namerow .stu-avatar{ width:36px; height:36px; font-size:.78rem; background:var(--accent-light); color:var(--accent); }
    .fr-combo-metaline{ font-size:.8rem; color:var(--text-muted); margin-bottom:10px; }
    .fr-combo-metaline b{ color:var(--text-primary); font-weight:600; }
    .fr-msep{ color:var(--border-color); margin:0 8px; }
    .fr-combo-contact{ font-size:.84rem; color:var(--text-muted); display:flex; align-items:center; gap:7px; margin-bottom:10px; }
    .fr-combo-contact i{ color:var(--accent); }
    .fr-combo-contact b{ color:var(--text-primary); font-weight:600; }
    .fr-combo-parents{ margin-bottom:0; }

    /* Student photo — same fallback-on-missing/403/404 pattern as Fee
       Submission Neo's own student-photo box (that route is gated on
       STUDENT_LIST:VIEW, which a Fee-Receipt-only user may not have, so a
       failed image load here is expected sometimes, not an error). */
    .fr-combo-photocol{ flex:none; display:flex; align-items:flex-start; }
    .fr-combo-photo-img, .fr-combo-photo-fallback{ width:84px; height:96px; border-radius:10px; border:1px solid var(--border-color); }
    .fr-combo-photo-img{ object-fit:cover; }
    .fr-combo-photo-fallback{ background:var(--body-bg); color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:1.9rem; }

    /* Side "quick view" table — same data as the full table below, in a
       scrollable card so it fills the empty space beside the info card on
       wide screens instead of duplicating a full-width table there. */
    /* height:100% + the flex:1 scroll region below is what actually makes
       this card match the left card's height: CSS Grid's align-items:stretch
       on .fr-infogrid stretches this card's OUTER box to the row height
       already, but without these two rules the table content inside just
       sat at its own natural (shorter) height, leaving dead space at the
       bottom instead of the scroll area filling the card. */
    .fr-sidetable-card{ display:flex; flex-direction:column; height:100%; overflow:hidden; }
    .fr-sidetable-scroll{ flex:1; min-height:0; max-height:280px; overflow:auto; }
    .fr-sidetable-scroll table{ width:100%; min-width:640px; margin:0; font-size:.78rem; }
    .fr-sidetable-scroll th{ position:sticky; top:0; background:var(--body-bg); color:var(--text-muted); font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:8px 12px; border:none; white-space:nowrap; z-index:1; }
    .fr-sidetable-scroll td{ padding:8px 12px; border-top:1px solid var(--border-color); vertical-align:middle; }
    .fr-sidetable-scroll tbody tr:hover{ background:var(--accent-light); }
    .fr-sidetable-scroll td code{ background:var(--accent-light); color:var(--accent); padding:2px 7px; border-radius:5px; font-size:.72rem; }
    .fr-sidetable-empty{ padding:24px 18px; font-size:.78rem; color:var(--text-muted); text-align:center; }

    /* ── Section labels (icon + text) ── */
    .fr-section-label{ display:flex; align-items:center; gap:9px; font-size:.86rem; font-weight:700; font-family:"Outfit", sans-serif; color:var(--text-primary); margin-bottom:12px; }
    .fr-section-label i{ font-size:1.05rem; }
    .fr-label-info i{ color:#0ea5e9; }
    .fr-label-success i{ color:#16a34a; }
    .fr-section-label .studname1{ font-weight:500; color:var(--text-muted); }

    /* ── Fee table ── */
    .fr-table-card{ overflow:hidden; margin-bottom:24px; }
    .fr-table-card .table-responsive{ margin:0; }
    .fr-table-card table{ width:100%; margin:0; font-size:.82rem; }
    .fr-table-card th{ background:var(--body-bg); color:var(--text-muted); font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:11px 16px; border:none; white-space:nowrap; }
    .fr-table-card td{ padding:11px 16px; border-top:1px solid var(--border-color); vertical-align:middle; }
    .fr-table-card tbody tr:hover{ background:var(--accent-light); }
    .fr-table-card td code{ background:var(--accent-light); color:var(--accent); padding:3px 9px; border-radius:6px; font-size:.78rem; }

    /* ── Receipt Print card ── */
    .fr-printcard{ padding:20px; margin-bottom:24px; }
    .fr-printcard .fr-actions{ margin-bottom:14px; }
    .fr-printcard-empty{ text-align:center; color:var(--text-muted); padding:32px 16px; font-size:.84rem; }
    .fr-printcard-empty i{ font-size:1.7rem; display:block; margin-bottom:8px; color:var(--border-color); }

    /* ── Receipt content itself — ported as-is from fees/receipt-neo.html so the
       preview/print/PDF here matches that page exactly. Scoped to #contentToExport,
       not a wrapper class - deliberate, same reason as receipt-neo.html: printThis's
       clone of #contentToExport into the print iframe drops its ANCESTORS, so a rule
       rooted on some outer wrapper class would never match there even though it works
       on-screen. Rooting every selector at #contentToExport keeps it working in all
       three contexts this markup is used in: on-screen preview, Print (cloned iframe),
       and Download PDF (html2canvas, reads the live on-screen DOM directly). Every
       selector is prefixed .rn- so it can't collide with this page's own .fr- rules
       above; this block only affects the dynamically-injected #disp-receipt content. */
    #contentToExport{ font-family: Georgia, 'Times New Roman', serif; color:#000; }
    #contentToExport .rn-header{ text-align:center; padding-bottom:6px; border-bottom:2px double #000; position:relative; }
    #contentToExport .rn-qr{ position:absolute; top:0; right:0; width:52px; height:52px; }
    #contentToExport .rn-qr img{ width:100%; height:100%; display:block; }
    #contentToExport .rn-header h1{ margin:0; font-size:18px; letter-spacing:.6px; }
    #contentToExport .rn-addr{ margin:3px 0 0; font-size:10px; color:#444; font-family:Arial,sans-serif; }
    #contentToExport .rn-contact{ margin:2px 0 0; font-size:10px; color:#444; font-family:Arial,sans-serif; }
    #contentToExport .rn-title-strip{ text-align:center; margin:8px 0 6px; font-family:Arial,sans-serif; font-size:10.5px; font-weight:bold; letter-spacing:1.6px; text-transform:uppercase; color:#444; }

    #contentToExport .rn-info-block{ margin:8px 0 12px; }
    #contentToExport .rn-info-line{ display:flex; gap:16px; margin-bottom:4px; font-family:Arial,sans-serif; font-size:10.5px; flex-wrap:wrap; }
    #contentToExport .rn-field{ flex:1; display:flex; gap:5px; min-width:0; }
    #contentToExport .rn-k{ color:#444; white-space:nowrap; }
    #contentToExport .rn-v{ font-weight:bold; border-bottom:1px dotted #bbb; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    #contentToExport .rn-months-title{ font-family:Arial,sans-serif; font-size:9.5px; font-weight:bold; text-transform:uppercase; letter-spacing:.7px; color:#444; margin-bottom:4px; }
    #contentToExport .rn-month-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    #contentToExport .rn-m3{ flex:0 0 calc(33.333% - 4px); box-sizing:border-box; border:1px solid #bbb; padding:3.5px 7px; font-family:Arial,sans-serif; font-size:9.5px; white-space:nowrap; }
    #contentToExport .rn-m3 b{ font-weight:bold; }
    #contentToExport .rn-m3.rn-empty{ color:#888; }

    #contentToExport .rn-sec-title{ font-family:Arial,sans-serif; font-size:9.5px; font-weight:bold; text-transform:uppercase; letter-spacing:.7px; color:#444; margin:4px 0 5px; }
    #contentToExport table.rn-fees{ width:100%; border-collapse:collapse; font-family:Arial,sans-serif; font-size:10.5px; margin-bottom:2px; }
    #contentToExport table.rn-fees th{ background:#f0f0f0; border:1px solid #000; padding:4px 8px; text-align:left; font-size:9px; text-transform:uppercase; letter-spacing:.4px; }
    #contentToExport table.rn-fees td{ border:1px solid #bbb; padding:4.5px 8px; }
    #contentToExport table.rn-fees td.rn-amt, #contentToExport table.rn-fees th.rn-amt{ text-align:right; font-variant-numeric:tabular-nums; }

    #contentToExport .rn-totals{ font-family:Arial,sans-serif; font-size:10.5px; margin-top:9px; width:100%; }
    #contentToExport .rn-totals table{ width:100%; border-collapse:collapse; }
    #contentToExport .rn-totals td{ padding:3px 0; }
    #contentToExport .rn-totals td.rn-v{ text-align:right; font-variant-numeric:tabular-nums; }
    #contentToExport .rn-totals tr.rn-remark td{ font-size:9.5px; color:#444; font-style:italic; }
    #contentToExport .rn-totals tr.rn-final td{ border-top:1.2px solid #000; padding-top:6px; font-weight:bold; }

    #contentToExport .rn-sign-row{ display:flex; justify-content:flex-end; margin-top:24px; font-family:Arial,sans-serif; font-size:10px; }
    #contentToExport .rn-sign-box{ width:170px; text-align:center; padding-top:4px; color:#444; }
    #contentToExport .rn-footnote{ text-align:center; margin-top:12px; font-family:Arial,sans-serif; font-size:9px; color:#666; }
  </style>

  <div class="container-fluid px-3">
      <div class="row mt-2">
          <div class="col-md-12">
              <div th:replace="~{components/ui :: page-header('Fee Receipt(s) List - Student')}"></div>

              <!--Search box - same da-search-wrap pattern as Fee Submission Neo / Collect Balance-->
              <div class="da-search-wrap">
                  <i class="bi bi-search"></i>
                  <input class="form-control" id="search-input" onkeyup="searchStuName()" placeholder="Search student name" type="text">
                  <div class="da-search-results search-result"></div>
              </div>

              <!--Student+Academic (with photo) / side "quick view" table — two-card row, same "neo" pattern as fees/feesubmitform-neo.html-->
              <div class="fr-infogrid">
                  <div class="fr-card fr-combocard">
                      <div class="fr-combo-left">
                          <div class="fr-combo-namerow">
                              <span class="stu-avatar" id="studentAvatar"></span>
                              <span class="studname"></span>
                          </div>
                          <div class="fr-combo-metaline">
                              <span>Medium: <b class="cmedium"></b></span><span class="fr-msep">|</span><span>Class: <b class="cgrade"></b>-<b class="csection"></b></span><span class="fr-msep">|</span><span>SR No: <b class="csr"></b></span>
                          </div>
                          <div class="fr-combo-contact">
                              <i class="bi bi-telephone-fill"></i><span>Contact No:</span> <b class="contactno"></b>
                          </div>
                          <div class="fr-combo-metaline fr-combo-parents">
                              <span>Father Name: <b class="fname"></b></span><span class="fr-msep">|</span><span>Mother Name: <b class="mname"></b></span>
                          </div>

                          <input type="hidden" name="school_id" id="school_id" th:field="*{school.id}"/>
                          <input type="hidden" name="academic_id" id="academic_id" th:field="*{academicYear.id}"/>
                          <input type="hidden" id="StudentId" value="" name="StudentId">
                          <input type="hidden" id="gradeId" value="" name="gradeId">
                      </div>
                      <div class="fr-combo-photocol">
                          <img id="studentPhoto" class="fr-combo-photo-img" style="display:none;" alt="Student photo">
                          <div id="studentPhotoFallback" class="fr-combo-photo-fallback"><i class="bi bi-person"></i></div>
                      </div>
                  </div>

                  <!--Side quick-view table — same rows as the full "Fee Detail(s)" table below,
                      just scrollable so the empty space beside the info card is put to use. The
                      full table below stays as-is for now.-->
                  <div class="fr-card fr-sidetable-card">
                      <div class="fr-sidetable-scroll">
                          <table class="table table-sm mb-0" id="feetableSide">
                              <thead>
                                  <tr>
                                      <th>#</th>
                                      <th>Date</th>
                                      <th>Receipt#</th>
                                      <th class="text-end">Total</th>
                                      <th class="text-end">Paid</th>
                                      <th class="text-end">Balance</th>
                                      <th>Action</th>
                                  </tr>
                              </thead>
                              <tbody class="table-group-divider">
                              </tbody>
                          </table>
                      </div>
                  </div>
              </div>

              <!--Receipt Print-->
              <div class="fr-section-label fr-label-success">
                  <i class="bi bi-printer"></i> Receipt Print
              </div>
              <div class="fr-card fr-printcard">
                  <div class="fr-actions d-flex gap-2" role="group" aria-label="Receipt actions">
                      <button class="btn btn-success" id="printreceipt" title="Print" aria-label="Print"><i class="bi bi-printer-fill"></i></button>
                      <button class="btn btn-outline-primary" id="downloadreceiptpdf" title="Download PDF" aria-label="Download PDF"><i class="bi bi-file-earmark-pdf"></i></button>
                  </div>
                  <div id="dispReceiptPlaceholder" class="fr-printcard-empty">
                      <i class="bi bi-file-earmark-text"></i>
                      Click the <i class="bi bi-printer-fill"></i> icon on a row above to preview a receipt here.
                  </div>
                  <div id="disp-receipt"></div>
              </div>

          </div>
      </div>
  </div>


    <script th:src="@{/js/printThis.js}"></script>
    <script th:src="@{/js/html2canvas.min.js}"></script>
    <script th:src="@{/js/jspdf.umd.min.js}"></script>
    <script th:src="@{/js/print-utils.js}"></script>
    <script th:src="@{/js/qrcode.js}"></script>

  <script type="text/javascript" th:inline="javascript">
      const contextPath = /*[[@{/}]]*/ '/';

      // Escapes a value before it is interpolated into an .html()-built string.
      // School/student/fee-head names, addresses, phone numbers, remarks, etc.
      // below come straight from JSON responses with no server-side escaping,
      // and were previously interpolated into .html()/template-literal-built
      // markup unescaped - a stored-XSS gap (this receipt HTML is rendered for
      // every staff member who looks up a fee submission, and re-rendered again
      // when printed/exported). Same fix pattern already applied elsewhere in
      // the Fees module this pass.
      const escapeHtml = function (value) {
          const div = document.createElement('div');
          div.textContent = value !== undefined && value !== null ? value : '';
          return div.innerHTML;
      };

      function showWarningMsg(msgType, msg, headerValue){
              toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": false,
                "progressBar": false,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "600",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
              }
            toastr[msgType](msg,headerValue);
        }

    // ── Avatar initials/color — same visual pattern as fee-submission "neo" ──
    const _frAvatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
    const _frInitialsOf = (name) => (name || '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const _frAvatarColorFor = (id) => _frAvatarColors[Math.abs(id || 0) % _frAvatarColors.length];

    // Student photo — same fallback-on-missing/403/404 pattern as Fee
    // Submission Neo's own student-photo box.
    function _frShowStudentPhoto(pic){
        const $img = $('#studentPhoto');
        const $fallback = $('#studentPhotoFallback');
        if(pic){
            $img.attr('src', `${contextPath}student/images/${encodeURIComponent(pic)}`)
                .off('error.frphoto').on('error.frphoto', function(){
                    $(this).hide();
                    $fallback.show();
                })
                .show();
            $fallback.hide();
        } else{
            $img.hide().removeAttr('src');
            $fallback.show();
        }
    }

    // Set once a receipt is loaded into #disp-receipt, used as the Print/PDF title/filename.
    let _frCurrentReceiptNo = 'receipt';

    let _frQuery = '', _frPage = 0, _frMore = false, _frLoading = false;
    const _frRow = (s) => {
        const sr = s.classSrNo ? ' / SR ' + escapeHtml(s.classSrNo) : '';
        const color = _frAvatarColorFor(s.id);
        return `<div class="da-result-row" onclick="loadStudentData(${s.id})">
                    <div class="stu-avatar" style="background:${color}22;color:${color}">${escapeHtml(_frInitialsOf(s.student.studentName))}</div>
                    <div><div class="da-result-name">${escapeHtml(s.student.studentName)}</div>
                    <div class="da-result-sub">${escapeHtml(s.student.fatherName)} &middot; ${escapeHtml(s.grade.gradeName)}-${escapeHtml(s.section.sectionName)}${sr}</div></div>
                </div>`;
    };
    const _frFetch = (query, page, append) => {
        if (_frLoading) return;
        _frLoading = true;
        fetch(`${contextPath}searchStudentForFeePage/${encodeURIComponent(query)}?page=${page}`)
            .then(r => r.json()).then(data => {
                _frLoading = false;
                _frMore = data.length === 10;
                if (!append) {
                    if (data.length === 0) {
                        $(".search-result").html(`<div class="da-result-empty">No students found for "${escapeHtml(query)}"</div>`).show();
                    } else {
                        let html = `<div id='fr-list-group'>`;
                        data.forEach(s => { html += _frRow(s); });
                        $(".search-result").html(html + `</div>`).show();
                    }
                } else {
                    data.forEach(s => { $('#fr-list-group').append(_frRow(s)); });
                }
            }).catch(() => { _frLoading = false; });
    };
    const searchStuName = () => {
        let query = $("#search-input").val();
        if (query.trim().length > 2) {
            if (query !== _frQuery) { _frQuery = query; _frPage = 0; _frFetch(query, 0, false); }
        } else { _frQuery = ''; $(".search-result").hide(); }
    };
    document.querySelector('.search-result').addEventListener('scroll', function() {
        if (!_frMore || _frLoading) return;
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 40) { _frPage++; _frFetch(_frQuery, _frPage, true); }
    });

    const loadStudentData=(id)=>{
        $(".search-result").hide();
        $("#search-input").val('');
        if(id>0){
            console.log("id::::"+id);
            $('#feetable > tbody').empty();
            $('#feetableSide > tbody').empty();
            // Clear the printable receipt block too — it's only populated when the printer
            // icon on a specific row is clicked, so without this it kept showing whichever
            // previous student's receipt was last printed, even after switching students.
            $('#disp-receipt').empty();
            $('#dispReceiptPlaceholder').show();
            _frCurrentReceiptNo = 'receipt';
            let url = `${contextPath}getStudentFeeDetails/${id}`;
            fetch(url).then(response => {
                return response.json();
            }).then((data) => {
                console.log(data);
                if('studentError' in data){
                    showWarningMsg("warning", data.studentError,"Message");
                    setFeeRelatedData(data, 0)
                } else{
                    if('feeSubmissionError' in data){
                        showWarningMsg("warning", data.feeSubmissionError,"Message");
                    } else{
                        if('feeSubmissions' in data){
                            if(data.student.status==='Active'){
                                setFeeRelatedData(data, 1);
                                setFeeDetails(data.feeSubmissions);
                            }
                        }
                    }
                }
            });
        }
    }

      // Builds one <tr> and appends it to both the full table below and the
      // scrollable "quick view" table beside the info card — same data, same
      // Action handler either way, just two places to click it from.
      function setFeeDetails(data){
          for(let i=0;i<data.length;i++){
              let value = data[i];
              console.log("value-----"+value);
              let formatDateVal = formatDate(value.feeSubmissionDate);
              let rowHtml =
                  '<tr><td>'+ (i+1) +'</td>' +
                  '<td>'+ formatDateVal +'</td>' +
                  '<td><code>'+ escapeHtml(value.receiptNo) +'</code></td>' +
                  '<td class="text-end">&#8377; '+value.totalAmount+'</td>' +
                  '<td class="text-end">&#8377; '+ value.paidAmount +'</td>' +
                  '<td class="text-end">&#8377; '+ value.balanceAmount +'</td>' +
                  '<td class="text-center"><a onclick="loadStudentReceiptData(\''+value.encodedId+'\')" href="#" class="btn btn-sm btn-success" title="View receipt" aria-label="View receipt"><i class="bi bi-printer-fill"></i></a></td></tr>';
              $('#feetable > tbody').append(rowHtml);
              $('#feetableSide > tbody').append(rowHtml);
          }
          if(data.length === 0){
              $('#feetableSide > tbody').append('<tr><td colspan="7" class="fr-sidetable-empty">No fee submissions yet.</td></tr>');
          }
      }

      function formatDate(inputDate) {
          const date = new Date(inputDate);
          const day = String(date.getDate()).padStart(2, '0');
          const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const month = monthNames[date.getMonth()];
          const year = date.getFullYear();
          return `${day}/${month}/${year}`;
      }
      const loadStudentReceiptData=(id)=>{
          if(id){
              let url = `${contextPath}student-receipt-print/${id}`;
              fetch(url).then(response => {
                  return response.json();
              }).then((data) => {
                  if('studentError' in data){
                      showWarningMsg("warning", data.noAcademicStudent,"Message");
                      setFeeRelatedData(data, 0)
                  } else{
                      if('feeSubmissionError' in data){
                          showWarningMsg("warning", data.noFeeDate,"Message");
                      } else{
                          _frCurrentReceiptNo = (data.feeSubmission && data.feeSubmission.receiptNo) ? data.feeSubmission.receiptNo : 'receipt';
                          const container = $('#disp-receipt');
                          container.empty();
                          container.append(createReceiptHTML(data));
                          renderReceiptQr(id);
                          $('#dispReceiptPlaceholder').hide();
                      }
                  }
              });
          }
      }

      function setFeeRelatedData(data, flag){
          if(flag===1){
              const avColor = _frAvatarColorFor(data.student.student.id);
              $('#studentAvatar').text(_frInitialsOf(data.student.student.studentName)).css({background: avColor + '22', color: avColor});
              $(".studname").html(`<b>${escapeHtml(data.student.student.studentName)}</b>`);
              $(".studname1").html(`&middot; ${escapeHtml(data.student.student.studentName)}`);
              $(".fname").html(`${escapeHtml(data.student.student.fatherName)}`);
              $(".mname").html(`${escapeHtml(data.student.student.motherName)}`);
              $(".contactno").html(`${escapeHtml(data.student.student.mobile1)}`);

              $(".cmedium").html(`${escapeHtml(data.student.medium.mediumName)}`);
              $(".cgrade").html(`${escapeHtml(data.student.grade.gradeName)}`);
              $(".csection").html(`${escapeHtml(data.student.section.sectionName)}`);
              $(".csr").html(`${data.student.classSrNo==null?"-":escapeHtml(data.student.classSrNo)}`);

              $('#StudentId').val(`${data.student.student.id}`);
              $('#gradeId').val(`${data.student.grade.id}`);
              _frShowStudentPhoto(data.student.student.pic);
          } else{
              $('#studentAvatar').text('').css({background:'', color:''});
              _frShowStudentPhoto(null);
              $(".studname").html(``);
              $(".studname1").html(``);
              $(".fname").html(``);
              $(".mname").html(``);
              $(".contactno").html(``);

              $(".cmedium").html(``);
              $(".cgrade").html(``);
              $(".csection").html(``);
              $(".csr").html(``);
              $('#gradeId').val('');

          }
      }

      // "Neo" receipt layout — same markup/CSS as fees/receipt-neo.html's
      // #contentToExport (see the .rn- CSS block above), built here as a JS
      // template from the exact same /student-receipt-print/{id} JSON this
      // page already fetches, instead of that page's server-side Thymeleaf
      // rendering. escapeHtml()/formatINR() usage mirrors what this function
      // already did for the old layout - see the XSS-fix note further up.
      const createReceiptHTML = (data) => {
          const school = data.school;
          const fs = data.feeSubmission;
          const student = data.student;
          const paymentSmall = fs.paymentDisplay && String(fs.paymentDisplay).indexOf('+') !== -1;
          const showPrevBalance = fs.previousFeeBalanceRemark != null
              && String(fs.previousFeeBalanceRemark).trim() !== ''
              && String(fs.previousFeeBalanceRemark).trim() !== '0';
          const showMigrationDiscount = fs.migrationDiscountAmount != null && Number(fs.migrationDiscountAmount) > 0;

          return `<div class="card-body" id="contentToExport">
                  <input type="hidden" id="feeid" value="${fs.id}">

                  <div class="rn-header">
                    <div class="rn-qr" id="rnQr" aria-hidden="true"></div>
                    <h1>${escapeHtml((school.schoolName || '').toUpperCase())}</h1>
                    <p class="rn-addr">${escapeHtml((school.address || '').toUpperCase())}</p>
                    <p class="rn-contact">
                      Contact No: (+91) ${escapeHtml(school.mobile1)}${school.mobile2 ? ', ' + escapeHtml(school.mobile2) : ''}
                      ${school.email ? '&nbsp;|&nbsp; Email: ' + escapeHtml(school.email) : ''}
                    </p>
                  </div>
                  <div class="rn-title-strip">Fee Payment Receipt</div>

                  <div class="rn-info-block">
                    <div class="rn-info-line">
                      <div class="rn-field"><span class="rn-k">Receipt No.</span><span class="rn-v">${escapeHtml(fs.receiptNo)}</span></div>
                      <div class="rn-field"><span class="rn-k">Academic Year</span><span class="rn-v">${escapeHtml(data.academicYear)}</span></div>
                      <div class="rn-field">
                        <span class="rn-k">Payment Mode</span>
                        <span class="rn-v"${paymentSmall ? ' style="font-size:8.5px;"' : ''}>${fs.paymentDisplay != null ? escapeHtml(fs.paymentDisplay) : ''}</span>
                      </div>
                    </div>
                    <div class="rn-info-line">
                      <div class="rn-field"><span class="rn-k">Student Name</span><span class="rn-v">${escapeHtml(student.student.studentName)}</span></div>
                      <div class="rn-field"><span class="rn-k">Submission Date</span><span class="rn-v">${escapeHtml(new Date(fs.feeSubmissionDate).toLocaleString())}</span></div>
                    </div>
                    <div class="rn-info-line">
                      <div class="rn-field"><span class="rn-k">Father's Name</span><span class="rn-v">${escapeHtml(student.student.fatherName)}</span></div>
                      <div class="rn-field"><span class="rn-k">Mother's Name</span><span class="rn-v">${escapeHtml(student.student.motherName)}</span></div>
                    </div>
                    <div class="rn-info-line">
                      <div class="rn-field"><span class="rn-k">Class</span><span class="rn-v">${escapeHtml(student.grade.gradeName)}-${escapeHtml(student.section.sectionName)}</span></div>
                      <div class="rn-field"><span class="rn-k">SR No.</span><span class="rn-v">${student.classSrNo == null ? '' : escapeHtml(student.classSrNo)}</span></div>
                      <div class="rn-field"><span class="rn-k">Contact No.</span><span class="rn-v">(+91) ${escapeHtml(student.student.mobile1)}</span></div>
                    </div>
                  </div>

                  <div class="rn-month-block">
                    <div class="rn-months-title">Month-wise Status</div>
                    <div class="rn-month-grid">
                      ${createFeeMonthDetailHTML(data.feeSubmittedMonths)}
                    </div>
                  </div>

                  <div class="rn-sec-title">Fee Breakup</div>
                  <table class="rn-fees">
                    <thead><tr><th>S.No.</th><th>Head Name</th><th>Unit</th><th class="rn-amt">Amount</th></tr></thead>
                    <tbody>
                      ${createFeeHeadDetailHTML(data.feesublist)}
                    </tbody>
                  </table>

                  <div class="rn-totals">
                    <table>
                      <tr class="rn-remark">
                        <td>Fine Remark: <span>${fs.fineRemark != null ? escapeHtml(fs.fineRemark) : ''}</span></td>
                        <td class="rn-v">Fine Amount: <span>₹ ${formatINR(fs.fineAmount)}</span></td>
                      </tr>
                      ${fs.discounthead ? `
                      <tr class="rn-remark">
                        <td>Discount Remark: <span>${escapeHtml(fs.discounthead.discountName)}</span></td>
                        <td class="rn-v">Discount Amount: <span>₹ ${formatINR(fs.discountAmount)}</span></td>
                      </tr>` : ''}
                      ${showPrevBalance ? `
                      <tr class="rn-remark">
                        <td>Previous Balance:</td>
                        <td class="rn-v">₹ ${escapeHtml(fs.previousFeeBalanceRemark)}</td>
                      </tr>` : ''}
                      ${showMigrationDiscount ? `
                      <tr class="rn-remark">
                        <td>Special Discount (Admin):</td>
                        <td class="rn-v">₹ ${formatINR(fs.migrationDiscountAmount)}</td>
                      </tr>` : ''}
                      <tr class="rn-final"><td>Total Amount</td><td class="rn-v">₹ ${formatINR(fs.totalAmount)}</td></tr>
                      <tr><td>Paid Amount</td><td class="rn-v">₹ ${formatINR(fs.paidAmount)}</td></tr>
                      <tr class="rn-final"><td>Balance Amount</td><td class="rn-v">₹ ${formatINR(fs.balanceAmount)}</td></tr>
                    </table>
                  </div>

                  <div class="rn-sign-row"><div class="rn-sign-box">Authorized Signatory</div></div>
                  <div class="rn-footnote">Computer generated receipt &mdash; no signature required for validity.</div>

              </div>`
      }

      const createFeeMonthDetailHTML = (feeSubmittedMonths) => {
          let feeMonthHTML = '';
          feeSubmittedMonths.forEach(feeList => {
              const parts = feeList.split('####');
              const monthName = (parts[1] || '').replace(/[():]/g, '').trim();
              const isPaid = feeList.indexOf('PAID') !== -1;
              const statusText = isPaid ? (parts[2] || '').replace('PAID', 'Paid') : '';

              feeMonthHTML += `
                <div class="rn-m3${isPaid ? '' : ' rn-empty'}">
                    <b>${escapeHtml(monthName)}</b>
                    ${isPaid ? `&mdash; &#10003; <span>${escapeHtml(statusText)}</span>` : `&mdash; Not paid`}
                </div>`;
          });
          return feeMonthHTML;
      };

      const createFeeHeadDetailHTML = (feeSubmittedMonths) => {
          let feeMonthHTML = '';
          let rowIndex = 1;
          feeSubmittedMonths.forEach(feeList => {
              const index = rowIndex++ + '.';
              const headName = feeList.feehead.feeHeadName;
              const unit = (feeList.quantity != null) ? `${feeList.rate} x ${feeList.quantity}` : '-';
              const amount = feeList.amount;

              feeMonthHTML += `
                <tr>
                    <td>${index}</td>
                    <td>${escapeHtml(headName)}</td>
                    <td>${escapeHtml(unit)}</td>
                    <td class="rn-amt">₹ ${formatINR(amount)}</td>
                </tr>
                `;
          });
          return feeMonthHTML;
      };

      // QR code — same rendering approach as fees/receipt-neo.html's own
      // DOMContentLoaded handler (see /js/qrcode.js), just triggered here
      // right after the markup above is injected instead of on page load.
      // Encodes this specific receipt's permanent /fees/receipt-print-neo/{id}
      // link (the same encodedId already used for the /student-receipt-print/{id}
      // fetch that produced `data`) rather than this list page's own URL, so
      // scanning it opens that one receipt directly - matching what scanning
      // the QR on the standalone receipt-neo.html page itself would do.
      const renderReceiptQr = (encodedId) => {
          try {
              const rnQr = document.getElementById('rnQr');
              if (rnQr && typeof qrcode === 'function') {
                  const qrUrl = window.location.origin + contextPath + 'fees/receipt-print-neo/' + encodeURIComponent(encodedId);
                  const qr = qrcode(0, 'M');
                  qr.addData(qrUrl);
                  qr.make();
                  const qrTargetPx = 52, qrRenderScale = 3, qrMarginModules = 2;
                  const qrModuleCount = qr.getModuleCount();
                  const qrCellSize = Math.max(1, Math.floor((qrTargetPx * qrRenderScale) / (qrModuleCount + qrMarginModules * 2)));
                  rnQr.innerHTML = qr.createImgTag(qrCellSize, qrMarginModules * qrCellSize);
                  const qrImg = rnQr.querySelector('img');
                  if (qrImg) {
                      qrImg.style.width = '100%';
                      qrImg.style.height = '100%';
                      qrImg.style.display = 'block';
                  }
              }
          } catch (qrErr) {
              console.error('QR code generation failed', qrErr);
          }
      };

      // Print and PDF-export both go through SmsPrintUtils (see
      // /js/print-utils.js) instead of the old printDiv() window.open()+
      // hardcoded-CDN approach: they reuse this app's own local CSS as-is, so
      // the output always matches the on-screen design and never depends on
      // an external CDN being reachable.
      document.getElementById('printreceipt').addEventListener('click', function () {
          if (!document.getElementById('contentToExport')) {
              showWarningMsg('warning', 'Click the printer icon on a receipt row first.', 'Message');
              return;
          }
          SmsPrintUtils.printElement('contentToExport', 'Fee Receipt - ' + _frCurrentReceiptNo);
      });
      document.getElementById('downloadreceiptpdf').addEventListener('click', function () {
          if (!document.getElementById('contentToExport')) {
              showWarningMsg('warning', 'Click the printer icon on a receipt row first.', 'Message');
              return;
          }
          SmsPrintUtils.downloadElementAsPdf('contentToExport', 'Receipt-' + _frCurrentReceiptNo + '.pdf');
      });

  </script>

  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
</body>
</html>
