<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Garde-wise Fees Income')}"></div>

                <table id="student-discount-list" class="table table-bordered table-striped table-hover table-sm" th:if="${hasData}">
                    <thead>
                    <tr>
                        <th>Garde</th>
                        <th>Section</th>
                        <th>Total Students</th>
                        <th>Monthly Fees</th>
                        <th>Total Students(Discount)</th>
                        <th>Total Discount Fees</th>
                        <th>Fee Income(Section)</th>
                    </tr>
                    </thead>
                    <tbody class="table-group-divider">

                    <tr th:each="feelist,iterStat : ${datalist}">
                        <td th:text="${feelist[0]}"></td>
                        <td th:text="${feelist[1]}"></td>
                        <td th:text="${feelist[2]}"></td>
                        <td th:text="${feelist[3]}"></td>
                        <td th:text="${feelist[4]}"></td>
                        <td th:text="${feelist[5]}"></td>
                        <td th:text="${feelist[6]}"></td>

                    </tr>
                    </tbody>
                    <tfoot class="table-group-divider">
                    <tr>
                        <td></td>
                        <td></td>
                        <td th:text="${totalStudentsCount}"></td>
                        <td></td>
                        <td th:text="${totalStudentsDiscountCount}"></td>
                        <td th:text="${@money.rupees(totalDiscountFees)}"></td>
                        <td th:text="${@money.rupees(totalFeesCollected)}"></td>
                    </tr>
                    </tfoot>
                </table>
                <div th:if="${!hasData}">
                    <div th:replace="~{components/ui :: empty-state('No Grade-wise Fee Income Found.', 'bi-inbox')}"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" th:inline="javascript">
        $(document).ready(function () {
            const exportColumns = [0,1,2,3,4,5,6];
            $('#student-discount-list').DataTable({
                layout: {
                    bottomEnd: {
                        paging: {
                            firstLast: false
                        }
                    },
                    top1Start: {
                        buttons: [
                            {
                                extend: 'excelHtml5',
                                text: '<i class="bi bi-file-excel-fill text-success"></i>',
                                titleAttr: 'Excel',
                                title: 'Grade-wise Fees Income Data Report',
                                exportOptions: {
                                    columns: exportColumns
                                }
                            },
                            {
                                extend: 'csvHtml5',
                                text: '<i class="bi bi-filetype-csv text-info"></i>',
                                titleAttr: 'CSV',
                                title: 'Grade-wise Fees Income Data Report'
                            },
                            {
                                extend: 'pdfHtml5',
                                text: '<i class="bi bi-file-pdf-fill text-danger"></i>',
                                titleAttr: 'PDF',
                                title: 'Grade-wise Fees Income Data Report',
                                exportOptions: {
                                    columns: exportColumns
                                }
                            },
                            'colvis'
                        ]
                    }
                },
                lengthMenu: [
                    [5, 10, 25, 50, 100, -1],
                    [5, 10, 25, 50, 100, 'All']
                ],
                pageLength: 10,
                columnDefs: [
                    { "orderable": false, "targets": [0,6] } // Disable sorting on the first and fourth columns
                ]
            });
            $(".buttons-excel, .buttons-csv, .buttons-pdf").each(function() {
                // Remove the btn-secondary class from each button
                $(this).removeClass("btn-secondary");
            });
        });
        toastr.options = {
            "closeButton": true,
            "debug": false,
            "newestOnTop": false,
            "progressBar": false,
            "positionClass": "toast-top-right",
            "preventDuplicates": false,
            "onclick": null,
            "showDuration": "600",
            "hideDuration": "1000",
            "timeOut": "5000",
            "extendedTimeOut": "1000",
            "showEasing": "swing",
            "hideEasing": "linear",
            "showMethod": "fadeIn",
            "hideMethod": "fadeOut"
        }


        


    </script>

  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
</body>
</html>
