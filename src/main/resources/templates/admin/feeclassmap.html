<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - School</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12 ">
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Fee-Grade Mapping List</h1>
          <div class="page-header-actions">
            <a sms:access="ADMIN_FEE_CLASS:CREATE" class="btn btn-success btn-sm" th:href="@{/admin/fee-class/add}"><i class="bi bi-plus-lg"></i> Add Fee-Grade Mapping</a>
          </div>
        </div>

        <table class="table table-bordered table-striped table-hover table-sm" th:if="${hasFeeClassMap}" id="feeDateTable">
          <thead>
          <tr>
            <th>#</th>
            <th>Grade</th>
            <th>Feehead</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody class="table-group-divider">

          <tr th:each="fcmap,iterStat : ${feeclass}">
            <td th:text="${iterStat.index + 1}"></td><!--th:rowspan="${#lists.size(fcmap.feeClassMapSubs)}"-->
            <td th:text="${fcmap.grade.gradeName}"></td>
            <td th:text="${fcmap.feehead.feeHeadName}"></td>
            <td th:text="${fcmap.amount}"></td>
            <td th:text="${fcmap.description}"></td>

            <td style="white-space: nowrap" class="text-center">
              <a sms:access="ADMIN_FEE_CLASS:EDIT" class="btn btn-primary" th:href="@{/admin/fee-class/edit/{id}(id=${fcmap.id})}" data-bs-toggle="tooltip" data-bs-title="Default tooltip">
                <i class="bi bi-pencil-square"></i> </a>

              <button sms:access="ADMIN_FEE_CLASS:DELETE" class="btn btn-danger delete-btn" th:attr="data-item-id=${fcmap.id}"><i class="bi bi-trash3-fill"></i> </button>
            </td>
          </tr>
          </tbody>
        </table>
        <div th:if="${!hasFeeClassMap}">
          <div th:replace="~{components/ui :: empty-state('No Fee-Grade Mapping found.', 'bi-inbox')}"></div>
        </div>
      </div>
    </div>
  </div>
  <script th:src="@{/js/jquery-3.7.1.js}"></script>
  <script th:src="@{/js/jquery-3.6.0.min.js}"></script>
  <script th:src="@{/js/toastr.min.js}"></script>

  <script th:inline="javascript" type="text/javascript">
    const contextPath = /*[[@{/}]]*/ '/';
    $(document).ready(function () {
      $('.delete-btn').click(function (e) {
        e.preventDefault(); // Prevent default action of the button
        let itemId = $(this).data('item-id'); // Get the item ID from data attribute
        console.log("itemId  "+itemId);
        if (confirm('Are you sure you want to delete this record?')) {
          // Send DELETE request using AJAX
          $.ajax({
            type: 'POST',
            url: `${contextPath}admin/fee-class/delete/` + itemId,
            success: function (response) {
              // Optionally handle success response
              console.log('Item deleted successfully '+response);
              if(response.status === "success"){
                showMsg("info","Fee-Class mapping deleted successfully.", "Delete");
              } else{
                const errorMsg = "Failed to delete the record." + response.message;
                //toastr["error"](errorMsg, "Error");
                showMsg("error",errorMsg, "Error");
              }
              //location.reload(); // Reload the page after successful deletion
              $('#feeDateTable').load(location.href + " #feeDateTable > *");
            },
            error: function (xhr, status, error) {
              // Handle error
              console.error('Error deleting item:', error);
              //alert('Failed to delete the record.');
              //toastr["error"]("Failed to delete the record.", "Error");
              showMsg("error","Failed to delete the record.", "Error");
            }
          });
        }
      });
    });
  </script>

  <script type="text/javascript" th:inline="javascript">
      $(document).ready(function () {
          $('#feeDateTable').DataTable({
              layout: {
                  bottomEnd: {
                      paging: {
                          firstLast: false
                      }
                  },
                top1Start: {
                  buttons: [
                    {
                      extend: 'excelHtml5',
                      text: '<i class="bi bi-file-excel-fill text-success"></i>',
                      titleAttr: 'Excel',
                      title: 'Fee-Grade Mapping Data export',
                      exportOptions: {
                        columns: [0, 1, 2, 3, 4]
                      }
                    },
                    {
                      extend: 'csvHtml5',
                      text: '<i class="bi bi-filetype-csv text-info"></i>',
                      titleAttr: 'CSV',
                      title: 'Fee-Grade Mapping Data export'
                    },
                    {
                      extend: 'pdfHtml5',
                      text: '<i class="bi bi-file-pdf-fill text-danger"></i>',
                      titleAttr: 'PDF',
                      title: 'Fee-Grade Mapping Data export',
                      exportOptions: {
                        columns: [0, 1, 2, 3, 4]
                      }
                    },
                    'colvis'
                  ]
                }
              },
              lengthMenu: [
                  [5, 10, 25, 50, 100, -1],
                  [5, 10, 25, 50, 100, 'All']
              ],
              pageLength: 25,
              columnDefs: [
                  { "orderable": false, "targets": [0,5] } // Disable sorting on the first and fourth columns
              ]
          });
          $(".buttons-excel, .buttons-csv, .buttons-pdf").each(function() {
            // Remove the btn-secondary class from each button
            $(this).removeClass("btn-secondary");
          });
      });

    


    



      


  </script>
</section>
</body>
</html>
