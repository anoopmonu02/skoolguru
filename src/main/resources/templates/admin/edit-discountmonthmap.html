<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>Edit Discount-Month Mapping</title>
</head>
<body>
<section class="container-fluid px-3">
  <style>
    .form-card-wrap { max-width: 760px; margin: 4px auto 40px; }
    .form-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 26px 28px 22px;
    }
    .form-card .form-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .form-card .form-control, .form-card .form-select {
      border-radius: 10px; border: 1px solid var(--border-color); font-size: 13.8px;
    }
    .form-card .form-control:focus, .form-card .form-select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
    }
    .form-card .form-control[readonly] { background: var(--body-bg, #f4f6f8); color: var(--text-muted); }
    .form-card .text-danger { font-size: 12px; margin-top: 4px; }
    .form-card .form-check { padding-top: 8px; }
    .form-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; padding-top: 18px; border-top: 1px dashed var(--border-color); }
    .form-btn {
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);
      padding: 9px 18px; border-radius: 10px; font-size: 13.8px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .form-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .form-btn-primary:hover { background: var(--accent); opacity: .92; color: #fff; }
  </style>

  <div class="form-card-wrap">
    <div th:replace="~{components/ui :: page-header('Edit Discount-Month Mapping')}"></div>

    <div class="form-card">
      <form th:action="@{/admin/edit-discount-month}" th:object="${discountmonthmap}" method="post">
        <!-- Still needed for @Valid's @NotNull checks at bind time - the
             controller no longer trusts these submitted values, it
             re-fetches the real row by id and copies only
             Applicable/Description onto it. See updateFeeMonthMap. -->
        <input type="hidden" name="id" id="id" th:field="*{id}"/>
        <input type="hidden" name="school_id" id="school_id" th:field="*{school.id}"/>
        <input type="hidden" name="academicYear" id="academicYear" th:field="*{academicYear.id}" />
        <input type="hidden" name="discounthead" id="discounthead" th:field="*{discounthead}" />
        <input type="hidden" name="monthMaster" id="monthMaster" th:field="*{monthMaster}" />

        <div class="row g-3">
          <div class="col-md-6">
            <label for="grade1" class="form-label">Discounthead</label>
            <input type="text" class="form-control" id="grade1" name="grade1" th:field="*{discounthead.discountName}" readonly="readonly"/>
            <p class="text-danger" th:if="${#fields.hasErrors('discounthead')}" th:errors="*{discounthead}">discounthead Error</p>
          </div>

          <div class="col-md-6">
            <label for="feehead1" class="form-label">Month</label>
            <input type="text" class="form-control" id="feehead1" name="feehead1" th:field="*{monthMaster.monthName}" readonly="readonly"/>
            <p class="text-danger" th:if="${#fields.hasErrors('monthMaster')}" th:errors="*{monthMaster}">Feehead Error</p>
          </div>

          <div class="col-md-6">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="isApplicable" name="isApplicable" th:field="*{isApplicable}" />
              <label for="isApplicable" class="form-check-label form-label mb-0">Applicable</label>
            </div>
            <p class="text-danger" th:if="${#fields.hasErrors('isApplicable')}" th:errors="*{isApplicable}">isApplicable Error</p>
          </div>

          <div class="col-md-12">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" placeholder="Add description here" class="form-control" name="description" style="height: 90px;" rows="4" th:field="*{description}"></textarea>
            <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">description Error</p>
          </div>
        </div>

        <div class="form-foot">
          <a class="form-btn" th:href="@{/admin/discount-month}"><i class="bi bi-arrow-left"></i> Back to List</a>
          <button id="savebtn" type="submit" class="form-btn form-btn-primary"><i class="bi bi-save2-fill"></i> Update</button>
        </div>
      </form>
    </div>
  </div>

  <script type="text/javascript" th:inline="javascript">
    // Surfaces a same-page validation/duplicate error (set as a plain model
    // attribute when this form re-renders after a failed POST) - was set
    // server-side but never actually displayed anywhere on this page.
    const discountMonthErrorMessage = [[${error}]];
    $(document).ready(function () {
      if (discountMonthErrorMessage) showMsg("error", discountMonthErrorMessage, "Error");
    });
  </script>

  <!-- Library <script> tags removed: this page has no JavaScript of its own,
       and base.html already loads jQuery, Bootstrap, toastr and select2. -->
</section>
</body>
</html>
