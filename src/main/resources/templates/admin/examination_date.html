<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - School</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-8 offset-md-2">
        <!-- Same inline add/search pattern as universal/section.html - see
             that file for the fuller explanatory comments. No inline Edit:
             Examination Dates never had an Edit feature server-side either. -->
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Examination Declared Date
            <span class="header-count-badge" th:text="${#lists.size(examinations ?: {})}">0</span>
          </h1>
          <div class="page-header-actions">
            <button sms:access="ADMIN_EXAM_DATE:CREATE" type="button" class="btn-cta" onclick="toggleAddPanel()">
              <i class="bi bi-plus-lg"></i> Add Examination Details
            </button>
          </div>
        </div>

        <div class="inline-panel" id="addPanel" sms:access="ADMIN_EXAM_DATE:CREATE">
          <div class="inline-panel-body">
            <div class="inline-panel-icon"><i class="bi bi-calendar-check"></i></div>
            <form th:action="@{/admin/examination-details}" th:object="${examDetails}" method="post" class="inline-panel-form">
              <input type="hidden" name="school_id" th:field="*{school.id}"/>
              <input type="hidden" name="academicYear" th:field="*{academicYear.id}"/>
              <select id="ed_exam" name="examination" class="form-select form-select-sm" style="flex:1 1 170px">
                <option value="">Select Examination</option>
                <option th:each="exam : ${examinationOptions}" th:value="${exam.id}" th:text="${exam.examinationName}">Examination</option>
              </select>
              <input type="text" class="form-control form-control-sm" id="ed_date" placeholder="Exam date"
                     autocomplete="off" th:field="*{examDeclaredDate}" style="flex:1 1 130px"/>
              <input type="text" class="form-control form-control-sm" id="ed_desc" placeholder="Description (optional)"
                     autocomplete="off" th:field="*{remarks}"/>
              <div class="inline-panel-actions">
                <button type="submit" class="btn-accent-solid"><i class="bi bi-check2"></i> Save</button>
                <button type="button" class="btn-accent-ghost" onclick="toggleAddPanel()">Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <div class="config-list-card" th:if="${isExamination}">
          <div class="config-list-toolbar">
            <div class="config-search-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control form-control-sm" id="examDateSearch"
                     placeholder="Search examination dates..." oninput="filterList(this.value, 'examDateListBody')">
            </div>
            <button type="button" class="config-sort-btn" title="Sort A-Z / Z-A"
                    onclick="toggleSort('examDateListBody', this)">
              <i class="bi bi-sort-alpha-down"></i>
            </button>
          </div>

          <div id="examDateListBody">
          <th:block th:each="exam,iterStat : ${examinations}">
            <div class="config-row row-view" th:attr="data-name=${#strings.toLowerCase(exam.examination.examinationName)}">
              <div class="config-row-icon"><i class="bi bi-calendar-check"></i></div>
              <div class="config-row-text">
                <div class="config-row-name" th:text="${exam.examination.examinationName} + ' — ' + ${#dates.format(exam.examDeclaredDate, 'dd/MMM/yyyy')}"></div>
                <div class="config-row-meta" th:if="${exam.remarks != null and !#strings.isEmpty(exam.remarks)}" th:text="${exam.remarks}"></div>
              </div>
              <div class="config-row-actions">
                <form sms:access="ADMIN_EXAM_DATE:DELETE" th:action="@{/admin/examinations-detail/delete/{id}(id=${exam.uuid})}" method="post" style="display:contents;">
                  <button type="submit" class="config-icon-btn danger" title="Delete"
                          onclick="return confirm('Are you sure you want to delete this record?')">
                    <i class="bi bi-trash3"></i>
                  </button>
                </form>
              </div>
            </div>
          </th:block>
          </div>

          <div class="config-list-footer"
               th:text="|${#lists.size(examinations)} examination date${#lists.size(examinations) != 1 ? 's' : ''} configured|">N examination dates configured</div>
        </div>
        <th:block th:if="${!isExamination}">
          <div th:replace="~{components/ui :: empty-state('No Examination Details found.', 'bi-inbox')}"></div>
        </th:block>
      </div>
    </div>
  </div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
  <script th:inline="none">
    function toggleAddPanel() {
      document.getElementById('addPanel').classList.toggle('open');
    }
    function filterList(query, listId) {
      query = query.trim().toLowerCase();
      document.querySelectorAll('#' + listId + ' > div.row-view').forEach(function (row) {
        row.style.display = row.getAttribute('data-name').indexOf(query) !== -1 ? '' : 'none';
      });
    }
    function toggleSort(listId, btn) {
      var container = document.getElementById(listId);
      var rows = Array.from(container.children).filter(function (el) { return el.classList.contains('row-view'); });
      var desc = btn.getAttribute('data-dir') === 'asc';
      rows.sort(function (a, b) {
        var ka = a.getAttribute('data-name') || '', kb = b.getAttribute('data-name') || '';
        if (ka < kb) { return desc ? 1 : -1; }
        if (ka > kb) { return desc ? -1 : 1; }
        return 0;
      });
      rows.forEach(function (r) { container.appendChild(r); });
      btn.setAttribute('data-dir', desc ? 'desc' : 'asc');
      btn.classList.add('active');
      btn.querySelector('i').className = desc ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up';
    }
  </script>

  <script type="text/javascript" th:inline="javascript">
    const examDateSuccessMessage = [[${success}]];
    const examDateErrorMessage   = [[${error}]];
    $(document).ready(function () {
      if (examDateSuccessMessage) showMsg("success", examDateSuccessMessage, "Success");
      if (examDateErrorMessage)   showMsg("error", examDateErrorMessage, "Error");

      flatpickr("#ed_date", { dateFormat: "d/M/Y" });
    });
  </script>
</section>
</body>
</html>
