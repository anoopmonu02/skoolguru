<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - School</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12">

      <div th:replace="~{components/ui :: list-page-header('Fee-Month Mapping List', null, ~{::feeMonthActions})}"></div>
      <!-- feeMonthActions is only ever meant to render once, inside the
           list-page-header call above via ~{::feeMonthActions}. Wrapped in a
           plain display:none div (not th:remove) - see employee.html for
           why th:remove on the fragment node itself breaks this. -->
      <div style="display:none">
        <div th:fragment="feeMonthActions">
          <a class="btn-cta" sms:access="ADMIN_FEE_MONTH:CREATE" th:href="@{/admin/fee-month/add}"><i class="bi bi-plus-lg"></i> Add Fee-Month Mapping</a>
        </div>
      </div>

      <div class="list-table-card">
        <div class="config-list-toolbar list-page-toolbar">
          <div class="config-search-wrap">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control form-control-sm" id="feeMonthSearchInput"
                   placeholder="Search fee-month mappings…">
          </div>
          <div id="feeMonthExportSlot" class="list-export-slot"></div>
        </div>

        <table class="table table-sm list-table" id="feemonth-list" th:if="${hasFeeMonthMap}">
          <thead>
          <tr>
            <th>#</th>
            <th>Feehead</th>
            <th>Month</th>
            <th>Applicable</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="fmmap,iterStat : ${feemonths}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${fmmap.feehead.feeHeadName}"></td>
            <td th:text="${fmmap.monthMaster.monthName}"></td>
            <td class="text-center">
              <i th:classappend="${fmmap.isApplicable} ? 'bi bi-bookmark-check-fill text-success' : 'bi bi-bookmark-x-fill text-danger'"></i>
            </td>
            <td th:text="${fmmap.description}"></td>
            <td class="text-nowrap text-center">
              <div class="row-actions">
                <a sms:access="ADMIN_FEE_MONTH:EDIT" class="config-icon-btn" title="Edit"
                   th:href="@{/admin/fee-month/edit/{id}(id=${fmmap.id})}">
                  <i class="bi bi-pencil"></i></a>
                <button type="button" sms:access="ADMIN_FEE_MONTH:DELETE" class="config-icon-btn danger delete-btn" title="Delete"
                        th:data-id="${fmmap.id}" th:data-feehead="${fmmap.feehead.feeHeadName}"
                        th:data-month="${fmmap.monthMaster.monthName}"
                        th:data-applicable="${fmmap.isApplicable} ? 'Yes' : 'No'"
                        th:data-description="${fmmap.description}"
                        data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal">
                  <i class="bi bi-trash3"></i></button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>

        <div th:if="${!hasFeeMonthMap}" class="p-3">
          <div th:replace="~{components/ui :: empty-state('No Fee-Month Mapping found.', 'bi-inbox')}"></div>
        </div>

        <!-- Custom footer: rows-per-page + "Showing X-Y of Z" + page-number
             pagination — built by the shared initListDataTable() helper
             (static/js/list-table-init.js), same as Employee/Academic-Year. -->
        <div class="list-table-footer" th:if="${hasFeeMonthMap}">
          <div class="list-footer-left">
            <label class="list-length-label">Rows per page
              <select id="feeMonthPageLength" class="list-length-select">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
            <span id="feeMonthPageInfo" class="list-page-info">Showing 0 of 0 fee-month mappings</span>
          </div>
          <div class="list-pagination" id="feeMonthPagination"></div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger-subtle">
          <h5 class="modal-title text-danger-emphasis" id="deleteConfirmationModalLabel">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Remove Fee-Month Mapping
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-3">You're about to remove the following fee-month mapping:</p>

          <div class="border rounded p-3 mb-3 bg-light">
            <div class="row gy-2">
              <div class="col-6">
                <small class="text-muted d-block">Feehead</small>
                <span class="fw-semibold" id="deleteFeeMonthFeehead">-</span>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Month</small>
                <span class="fw-semibold" id="deleteFeeMonthMonth">-</span>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Applicable</small>
                <span class="fw-semibold" id="deleteFeeMonthApplicable">-</span>
              </div>
              <div class="col-12">
                <small class="text-muted d-block">Description</small>
                <span class="fw-semibold" id="deleteFeeMonthDescription">-</span>
              </div>
            </div>
          </div>

          <div class="alert alert-warning d-flex align-items-start mb-0" role="alert">
            <i class="bi bi-info-circle-fill me-2 mt-1"></i>
            <div>This cannot be undone.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Cancel </button>
          <button type="button" class="btn btn-danger" id="confirmDeleteButton"><i class="bi bi-trash3-fill"></i> Remove Mapping </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Real POST form the confirm button submits - a state-changing action
       needs to go through POST so Spring Security's CSRF check actually
       covers it (GET requests are exempt from CSRF). Thymeleaf auto-injects
       the _csrf hidden field for any th:action form, same as every other
       POST form in this app. -->
  <form id="deleteFeeMonthForm" method="post" th:action="@{/admin/fee-month/delete/0}" style="display:none"></form>

  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';

    // Flash-attribute success/error banner after redirects (save/edit/delete
    // all set these server-side already; this page just never displayed them
    // before now).
    const feeMonthSuccessMessage = [[${success}]];
    const feeMonthErrorMessage   = [[${error}]];

    $(document).ready(function () {
      if (feeMonthSuccessMessage) showMsg("success", feeMonthSuccessMessage, "Success");
      if (feeMonthErrorMessage)   showMsg("error", feeMonthErrorMessage, "Error");

      if ($('#feemonth-list').length) {
        initListDataTable({
          tableSelector: '#feemonth-list',
          searchInputSelector: '#feeMonthSearchInput',
          exportSlotSelector: '#feeMonthExportSlot',
          lengthSelectSelector: '#feeMonthPageLength',
          pageInfoSelector: '#feeMonthPageInfo',
          paginationSelector: '#feeMonthPagination',
          itemLabel: 'fee-month mappings',
          exportTitle: 'Fee-Month Mapping Data export',
          exportColumns: [0, 1, 2, 3, 4],
          printHeaderText: 'Fee-Month Mappings',
          dtOptions: {
            columnDefs: [{ orderable: false, targets: [0, 5] }]
          }
        });
      }

      // Delete confirmation modal wiring — same pattern as Employee/Academic-Year List.
      let deleteFeeMonthId = null;
      $(document).on('click', '.delete-btn', function () {
        const btn = $(this);
        deleteFeeMonthId = btn.data('id');
        $('#deleteFeeMonthFeehead').text(btn.data('feehead') || '-');
        $('#deleteFeeMonthMonth').text(btn.data('month') || '-');
        $('#deleteFeeMonthApplicable').text(btn.data('applicable') || '-');
        $('#deleteFeeMonthDescription').text(btn.data('description') || '-');
      });

      $('#confirmDeleteButton').on('click', function () {
        if (deleteFeeMonthId) {
          const $form = $('#deleteFeeMonthForm');
          $form.attr('action', contextPath + 'admin/fee-month/delete/' + deleteFeeMonthId);
          $form.trigger('submit');
        }
      });
    });

    toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": false,
      "progressBar": false,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "600",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    }
  </script>
</section>
</body>
</html>
