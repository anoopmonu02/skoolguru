<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}" th:inline="javascript">
<head>
  <meta charset="UTF-8">
  <title>Add academic year</title>
</head>
<body>

<section class="container-fluid px-3">
  <div class="mt-2">
    <div th:replace="~{components/ui :: page-header('Fee-date Form')}"></div>


    <form th:action="@{/admin/feedate}" th:object="${feedate}" method="post" >
      <div class="row g-2">

        <div class="col-md-7">
          <!--<label for="school" class="form-label">School</label>-->
          <input type="hidden" name="school_id" id="school_id" th:field="*{school.id}"/>
          <!--<input type="text" class="form-control" id="school" name="school" th:field="*{school.schoolName}"  readonly/>
          <p class="text-danger" th:if="${#fields.hasErrors('school')}" th:errors="*{school}">school Error</p>-->
        </div>
        <div class="col-md-4">
          &nbsp;<input type="hidden" name="academicYear" id="academicYear" th:field="*{academicYear.id}" />
        </div>

        <div class="col-md-5">
          <label for="province" class="form-label">Month</label>
          <select id="province" th:field="*{monthMaster}" class="form-select" name="monthMaster">
            <option value="">Select Month</option>
            <option th:each="month : ${months}" th:value="${month.id}" th:text="${month.monthName}"
                    th:selected="${month} == ${feedate.monthMaster}">Month</option>
          </select>
          <p class="text-danger" th:if="${#fields.hasErrors('monthMaster')}" th:errors="*{monthMaster}">Province Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>


        <div class="col-md-5">
          <label for="customer_name" class="form-label">Fee Date</label>
          <input type="text"  class="form-control" id="customer_name" name="feeSubmissiondate" th:field="*{feeSubmissiondate}" />
          <p class="text-danger" th:if="${#fields.hasErrors('feeSubmissiondate')}" th:errors="*{feeSubmissiondate}">date Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>

        <div class="col-md-7">
          <label for="description" class="form-label">Description</label>
          <div class="form-floating">
            <textarea id="description" placeholder="Add description here" class="form-control" name="description" style="height: 100px;" rows="4" cols="50" th:field="*{description}"></textarea>
            <label for="description">Add Description Here</label>
          </div>
          <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">description Error</p>
        </div>
        <div class="col-md-2">
          &nbsp;
        </div>


        <hr/>
        <div class="col-md-4">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/feedate}"><i class="bi bi-arrow-left"></i> Back to List</a>
        </div>
        <div class="col-md-6 mb-5">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save2-fill"></i> Save</button>
        </div>
      </div>
    </form>





  </div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
  <script type="text/javascript" th:inline="javascript">
      flatpickr("#customer_name", {
        dateFormat: "d/m/Y",  // d=padded day, m=padded numeric month (01-12), Y=4-digit year
      });

    // Surfaces a same-page validation/duplicate error (set as a plain model
    // attribute when this form re-renders after a failed POST) - was set
    // server-side but never actually displayed anywhere on this page.
    const feeDateErrorMessage = [[${error}]];
    $(document).ready(function () {
      if (feeDateErrorMessage) showMsg("error", feeDateErrorMessage, "Error");
    });
      toastr.options = {
        "closeButton": true,
        "debug": false,
        "newestOnTop": false,
        "progressBar": false,
        "positionClass": "toast-top-right",
        "preventDuplicates": false,
        "onclick": null,
        "showDuration": "600",
        "hideDuration": "1000",
        "timeOut": "5000",
        "extendedTimeOut": "1000",
        "showEasing": "swing",
        "hideEasing": "linear",
        "showMethod": "fadeIn",
        "hideMethod": "fadeOut"
      }
    


  </script>


  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>


</body>
</html>
