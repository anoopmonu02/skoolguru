<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - School</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-8 offset-md-2">
        <!-- Same inline add/search pattern as universal/section.html - see
             that file for the fuller explanatory comments. No inline Edit
             here: Fee-Date never had an Edit feature server-side (the old
             template's edit link was commented out and dead), so none is
             added now either - this is a chrome/styling + inline-add pass,
             not a new-feature pass. -->
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Fee-Date List
            <span class="header-count-badge" th:text="${#lists.size(feedates ?: {})}">0</span>
          </h1>
          <div class="page-header-actions">
            <button sms:access="ADMIN_FEEDATE:CREATE" type="button" class="btn-cta" onclick="toggleAddPanel()">
              <i class="bi bi-plus-lg"></i> Add Fee-Date
            </button>
          </div>
        </div>

        <div class="inline-panel" id="addPanel" sms:access="ADMIN_FEEDATE:CREATE">
          <div class="inline-panel-body">
            <div class="inline-panel-icon"><i class="bi bi-calendar-event"></i></div>
            <form th:action="@{/admin/feedate}" th:object="${feedate}" method="post" class="inline-panel-form">
              <input type="hidden" name="school_id" th:field="*{school.id}"/>
              <input type="hidden" name="academicYear" th:field="*{academicYear.id}"/>
              <select id="fd_month" class="form-select form-select-sm" th:field="*{monthMaster}" style="flex:1 1 150px">
                <option value="">Select Month</option>
                <option th:each="month : ${months}" th:value="${month.id}" th:text="${month.monthName}">Month</option>
              </select>
              <input type="text" class="form-control form-control-sm" id="fd_date" placeholder="Fee Date"
                     autocomplete="off" th:field="*{feeSubmissiondate}" style="flex:1 1 130px"/>
              <input type="text" class="form-control form-control-sm" id="fd_desc" placeholder="Description (optional)"
                     autocomplete="off" th:field="*{description}"/>
              <div class="inline-panel-actions">
                <button type="submit" class="btn-accent-solid"><i class="bi bi-check2"></i> Save</button>
                <button type="button" class="btn-accent-ghost" onclick="toggleAddPanel()">Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <div class="config-list-card" th:if="${isFeeDates}">
          <div class="config-list-toolbar">
            <div class="config-search-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control form-control-sm" id="feeDateSearch"
                     placeholder="Search fee dates..." oninput="filterList(this.value, 'feeDateListBody')">
            </div>
            <button type="button" class="config-sort-btn" title="Sort A-Z / Z-A"
                    onclick="toggleSort('feeDateListBody', this)">
              <i class="bi bi-sort-alpha-down"></i>
            </button>
          </div>

          <div id="feeDateListBody">
          <th:block th:each="feedate,iterStat : ${feedates}">
            <div class="config-row row-view" th:attr="data-name=${#strings.toLowerCase(feedate.monthMaster.monthName)}">
              <div class="config-row-icon"><i class="bi bi-calendar-event"></i></div>
              <div class="config-row-text">
                <div class="config-row-name" th:text="${feedate.monthMaster.monthName} + ' — ' + ${#dates.format(feedate.feeSubmissiondate, 'dd/MMM/yyyy')}"></div>
                <div class="config-row-meta" th:if="${feedate.description != null and !#strings.isEmpty(feedate.description)}" th:text="${feedate.description}"></div>
              </div>
              <div class="config-row-actions">
                <form sms:access="ADMIN_FEEDATE:DELETE" th:action="@{/admin/feedate/delete/{id}(id=${feedate.id})}" method="post" style="display:contents;">
                  <button type="submit" class="config-icon-btn danger" title="Delete"
                          onclick="return confirm('Are you sure you want to delete this record?')">
                    <i class="bi bi-trash3"></i>
                  </button>
                </form>
              </div>
            </div>
          </th:block>
          </div>

          <div class="config-list-footer"
               th:text="|${#lists.size(feedates)} fee date${#lists.size(feedates) != 1 ? 's' : ''} configured|">N fee dates configured</div>
        </div>
        <th:block th:if="${!isFeeDates}">
          <div th:replace="~{components/ui :: empty-state('No Fee-date found.', 'bi-inbox')}"></div>
        </th:block>
      </div>
    </div>
  </div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
  <script th:inline="none">
    function toggleAddPanel() {
      document.getElementById('addPanel').classList.toggle('open');
    }
    function filterList(query, listId) {
      query = query.trim().toLowerCase();
      document.querySelectorAll('#' + listId + ' > div.row-view').forEach(function (row) {
        row.style.display = row.getAttribute('data-name').indexOf(query) !== -1 ? '' : 'none';
      });
    }
    function toggleSort(listId, btn) {
      var container = document.getElementById(listId);
      var rows = Array.from(container.children).filter(function (el) { return el.classList.contains('row-view'); });
      var desc = btn.getAttribute('data-dir') === 'asc';
      rows.sort(function (a, b) {
        var ka = a.getAttribute('data-name') || '', kb = b.getAttribute('data-name') || '';
        if (ka < kb) { return desc ? 1 : -1; }
        if (ka > kb) { return desc ? -1 : 1; }
        return 0;
      });
      rows.forEach(function (r) { container.appendChild(r); });
      btn.setAttribute('data-dir', desc ? 'desc' : 'asc');
      btn.classList.add('active');
      btn.querySelector('i').className = desc ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up';
    }
  </script>

  <script type="text/javascript" th:inline="javascript">
    const feeDateSuccessMessage = [[${success}]];
    const feeDateErrorMessage   = [[${error}]];
    $(document).ready(function () {
      if (feeDateSuccessMessage) showMsg("success", feeDateSuccessMessage, "Success");
      if (feeDateErrorMessage)   showMsg("error", feeDateErrorMessage, "Error");

      // FeeDate.feeSubmissiondate is @DateTimeFormat(pattern = "dd/MM/yyyy") -
      // numeric month, unlike Holiday/Examination-Date which use "dd/MMM/yyyy".
      // Using "d/M/Y" (textual month, e.g. "15/Jan/2027") here made every
      // submission fail Spring's date-binding with a type-mismatch error.
      flatpickr("#fd_date", { dateFormat: "d/m/Y" });
    });
  </script>
</section>
</body>
</html>
