<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}" th:inline="javascript">
<head>
  <meta charset="UTF-8">
  <title>Add academic year</title>
</head>
<body>

<section class="container-fluid px-3">
  <div class="mt-2">
    <div th:replace="~{components/ui :: page-header('Holiday Form')}"></div>


    <form th:action="@{/admin/holiday}" th:object="${holiday}" method="post" >
      <div class="row g-2">

        <div class="col-md-7">
          <!--<label for="school" class="form-label">School</label>-->
          <input type="hidden" name="school_id" id="school_id" th:field="*{school.id}"/>
          <!--<input type="text" class="form-control" id="school" name="school" th:field="*{school.schoolName}"  readonly/>
          <p class="text-danger" th:if="${#fields.hasErrors('school')}" th:errors="*{school}">school Error</p>-->
        </div>
        <div class="col-md-4">
          &nbsp;<input type="hidden" name="academicYear" id="academicYear" th:field="*{academicYear.id}" />
        </div>

        <div class="col-md-5">
          <label for="holidayName" class="form-label">Holiday Name</label>
          <input type="text"  class="form-control" id="holidayName" name="holidayName" th:field="*{holidayName}" />
          <p class="text-danger" th:if="${#fields.hasErrors('holidayName')}" th:errors="*{holidayName}">Name Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>


        <div class="col-md-5">
          <label for="holidayStartDate" class="form-label">Start Date</label>
          <input type="text"  class="form-control" id="holidayStartDate" name="holidayStartDate" th:field="*{holidayStartDate}" />
          <p class="text-danger" th:if="${#fields.hasErrors('holidayStartDate')}" th:errors="*{holidayStartDate}">date Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>

        <div class="col-md-5">
          <label for="holidayEndDate" class="form-label">End Date</label>
          <input type="text"  class="form-control" id="holidayEndDate" name="holidayStartDate" th:field="*{holidayEndDate}" />
          <p class="text-danger" th:if="${#fields.hasErrors('holidayEndDate')}" th:errors="*{holidayEndDate}">date Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>

        <div class="col-md-7">
          <label for="description" class="form-label">Description</label>
          <div class="form-floating">
            <textarea id="description" placeholder="Add description here" class="form-control" name="description" style="height: 100px;" rows="4" cols="50" th:field="*{description}"></textarea>
            <label for="description">Add Description Here</label>
          </div>
          <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">description Error</p>
        </div>
        <div class="col-md-2">
          &nbsp;
        </div>


        <hr/>
        <div class="col-md-4">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/holidays}"><i class="bi bi-arrow-left"></i> Back to List</a>
        </div>
        <div class="col-md-6 mb-5">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save2-fill"></i> Save</button>
        </div>
      </div>
    </form>





  </div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
  <script type="text/javascript" th:inline="javascript">
    flatpickr("#holidayEndDate", {
      dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
    });
    flatpickr("#holidayStartDate", {
      dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
    });
    toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": false,
      "progressBar": false,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "600",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    }
    


  </script>


  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>


</body>
</html>
