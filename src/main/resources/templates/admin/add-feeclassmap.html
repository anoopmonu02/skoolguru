<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}" th:inline="javascript">
<head>
  <meta charset="UTF-8">
  <title>Add Fee-Grade Mapping</title>
</head>
<body>

<section class="container-fluid px-3">
  <!-- Light-touch restyle only: the picker row and the wrapper card below
       get the app's visual language (rounded card, polished selects/
       buttons), and the dynamically-built fee table gets the same look via
       plain CSS selectors on its existing tag/class names. loadFeeData()
       and every string it writes (ids, names, classes) below are untouched
       - this whole flow is a multi-field matrix submit, not a simple form,
       so the JS itself is out of scope for this pass. -->
  <style>
    .form-card-wrap { max-width: 900px; margin: 4px auto 40px; }
    .form-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 26px 28px 22px;
    }
    .form-card .form-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .form-card .form-control, .form-card .form-select, .form-card .form-control-sm {
      border-radius: 10px; border: 1px solid var(--border-color); font-size: 13.8px;
    }
    .form-card .form-control:focus, .form-card .form-select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
    }
    .form-card .picker-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed var(--border-color); }
    .form-card .picker-row > div { min-width: 180px; }
    #result table { width: 100%; border-collapse: collapse; font-size: 13.8px; }
    #result table thead th {
      text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 700;
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      background: var(--body-bg); white-space: nowrap; border-bottom: 1px solid var(--border-color);
    }
    #result table tbody td {
      padding: 10px 14px; vertical-align: middle;
      border-bottom: 1px solid var(--border-color); background: transparent;
    }
    #result table tbody tr:last-child td { border-bottom: none; }
    .form-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; padding-top: 18px; border-top: 1px dashed var(--border-color); }
    .form-btn {
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);
      padding: 9px 18px; border-radius: 10px; font-size: 13.8px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .form-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .form-btn-primary:hover { background: var(--accent); opacity: .92; color: #fff; }
    .form-btn:disabled { opacity: .5; cursor: not-allowed; }
    #result table tbody tr:hover td { background: var(--body-bg); }
    #result table tbody td:first-child, #result table thead th:first-child { text-align: center; width: 48px; color: var(--text-muted); }
    .table-empty-state { padding: 34px 10px; text-align: center; color: var(--text-muted); font-size: 13.5px; }
    .table-empty-state .spinner-border { width: 1rem; height: 1rem; margin-right: 8px; vertical-align: -2px; }
  </style>

  <div class="form-card-wrap">
    <div th:replace="~{components/ui :: page-header('Fee-Grade Mapping Form')}"></div>

    <div class="form-card">
      <div class="picker-row">
        <div>
          <label for="feeclass" class="form-label">Select Grade</label>
          <select id="feeclass" class="form-select" name="feeclass">
            <option value="">Select Grade</option>
            <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
          </select>
        </div>
        <div>
          <label for="feemedium" class="form-label">Select Medium</label>
          <select id="feemedium" class="form-select" name="feemedium">
            <option value="">Select Medium</option>
            <option th:each="medium : ${mediums}" th:value="${medium.id}" th:text="${medium.mediumName}">Medium</option>
          </select>
        </div>
        <div>
          <label for="aa" class="visually-hidden">Button</label>
          <button id="aa" type="button" class="form-btn form-btn-primary" onclick="loadFeeData()"><i class="bi bi-search"></i> Get Fee</button>
        </div>
      </div>

      <form th:action="@{/admin/fee-class}" th:object="${feeClassMapWrapper}" method="post">
        <input type="hidden" name="school_id" id="school_id" th:field="*{feeClassMaps[0].school.id}"/>
        <input type="hidden" name="academicYear" id="academicYear" th:field="*{feeClassMaps[0].academicYear.id}" />
        <input type="hidden" name="grade" id="grade" th:field="*{feeClassMaps[0].grade}" />
        <input type="hidden" name="medium" id="medium" th:field="*{feeClassMaps[0].medium}" />

        <div id="result">
          <div class="table-empty-state">Select Grade and Medium above, then click &quot;Get Fee&quot; to load the fee heads for this mapping.</div>
        </div>

        <div class="form-foot">
          <a class="form-btn" th:href="@{/admin/fee-class}"><i class="bi bi-arrow-left"></i> Back to List</a>
          <button id="savebtn" disabled="disabled" type="submit" class="form-btn form-btn-primary"><i class="bi bi-save2-fill"></i> Save</button>
        </div>
      </form>
    </div>
  </div>


  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';

    // Surfaces a same-page validation/duplicate error (set as a plain model
    // attribute when this form re-renders after a failed POST) - was set
    // server-side but never actually displayed anywhere on this page.
    const feeClassErrorMessage = [[${error}]];
    $(document).ready(function () {
      if (feeClassErrorMessage) showMsg("error", feeClassErrorMessage, "Error");
    });

    toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": false,
      "progressBar": false,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "600",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    }
    



    const loadFeeData=()=>{
      let classId = $('#feeclass').val();
      let mediumId = $('#feemedium').val();
      if (!classId || !mediumId) {
        toastr["warning"]("Please select both Grade and Medium.", "Warning");
        return;
      }
      $('#result').html('<div class="table-empty-state"><span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>Loading fee heads…</div>');
      $('#aa').prop('disabled', true);
      console.log("------------------------------------");
      $.ajax({
        url: `${contextPath}admin/fee-class/getAllFeeData/`+classId+`/`+mediumId, // URL of the Spring Boot endpoint
        type: 'POST',
        success: function(response) {
          $('#aa').prop('disabled', false);
          let tableContent = '';
          console.log("response:"+response);
          $.each(response, function(key, subMap) {
            console.log("key:"+key);
            console.log("value:::"+subMap);
            if(key === 'success'){
              let index = 1;
              tableContent = '<table class="fee-matrix-table" id="feeDataTable"><thead><tr><th>#</th><th>Fee Head</th><th class="text-end">Amount</th><th>Description</th></tr></thead><tbody>';
              $.each(subMap, function(subKey, value) {
                //let feeObject = subKey.toJSON();
                console.log("_____-----------__________"+subKey);
                tableContent += '<tr>';
                tableContent += '<td><input type="hidden" th:field="*{feeClassMaps['+ (index-1) +'].id}" name="feeClassMaps['+ (index-1) +'].id" value="'+ subKey.split(':')[2] +'" />' + index + '</td>';
                tableContent += '<td><input type="hidden" th:field="*{feeClassMaps['+ (index-1) +'].feehead}" name="feeClassMaps['+ (index-1) +'].feehead" value="'+subKey.split(':')[0] +'" />' + subKey.split(':')[1] + '</td>';
                tableContent += '<td class="text-end"><input type="number" class="form-control-sm" id="fee_' + subKey.split(':')[0] + '" name="feeClassMaps['+ (index-1) +'].amount" value="' + value + '"/></td>';
                tableContent += '<td><input type="text" class="form-control" id="description_' + subKey.split(':')[0] + '" name="feeClassMaps['+ (index-1) +'].description" placeholder="Optional note"/></td>';
                tableContent += '</tr>';
                index++;
              });
              tableContent += '</tbody></table>';
              $('#result').html(tableContent);
              $('#grade').val(classId);
              $('#medium').val(mediumId);
              document.getElementById("savebtn").disabled = false;
            }
            else{
              $('#result').html('<div class="table-empty-state">No Fee-Class Mapping Data Found.</div>');
              document.getElementById("savebtn").disabled = true;
            }
          });

          /*response.forEach(function(item) {
            tableContent += '<tr><td>' + item.col1 + '</td><td>' + item.col2 + '</td></tr>';
          });*/



        },
        error: function(error) {
          $('#aa').prop('disabled', false);
          $('#result').html('<div class="table-empty-state text-danger">Something went wrong while loading fee data. Please try again.</div>');
          console.log(error);
        }
      });
    }

  </script>


  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>


</body>
</html>
