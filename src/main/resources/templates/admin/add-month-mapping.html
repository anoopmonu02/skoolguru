<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}" th:inline="javascript">
<head>
    <meta charset="UTF-8">
    <title>Add academic year</title>
</head>
<body>

<section class="container-fluid px-3">
    <div class="mt-2 gy-5 mb-5">
        <div th:replace="~{components/ui :: page-header('Month-Mapping Form')}"></div>


        <form th:action="@{/admin/month-mapping}" method="post" th:object="${monthMapping}">
            <div class="row g-2">

                <div class="col-md-5">
                    <label for="months" class="form-label">Academic Year Starting Month</label>
                    <select id="months" th:field="*{monthMaster}" class="form-select" name="monthMaster">
                        <option value="">Select Month</option>
                        <option th:each="month : ${months}" th:value="${month.id}" th:text="${month.monthName}">State</option>
                    </select>
                </div>
                <div class="col-md-5">

                </div>

                <hr/>
                <div class="col-md-4">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/month-mapping}"><i class="bi bi-arrow-left"></i>
                        Back to List</a>
                </div>
                <div class="col-md-6 mb-5">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-bounding-box"></i> Generate Mapping</button>
                </div>
            </div>
        </form>


    </div>

    <script type="text/javascript" th:inline="javascript">
        // Surfaces a same-page error (set as a plain model attribute when
        // this form re-renders after a failed save) - was set server-side
        // but never actually displayed anywhere on this page before now.
        const monthMappingErrorMessage = [[${error}]];
        $(document).ready(function () {
            if (monthMappingErrorMessage) showMsg("error", monthMappingErrorMessage, "Error");
        });
    </script>

</section>


</body>
</html>
