<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}" th:inline="javascript">
<head>
  <meta charset="UTF-8">
  <title>Add academic year</title>
</head>
<body>

<section class="container-fluid px-3">
  <div class="mt-2">
    <div th:replace="~{components/ui :: page-header('Examination Details Form')}"></div>


    <form th:action="@{/admin/examination-details}" th:object="${examDetails}" method="post" >
      <div class="row g-2">
        <input type="hidden" name="school_id" id="school_id" th:field="*{school.id}"/>
        <input type="hidden" name="academicYear" id="academicYear" th:field="*{academicYear.id}" />
        <div class="col-md-5">
          <label for="examination" class="form-label">Examination Name</label>
          <select name="examination" id="examination" class="form-select">
            <option value="">Select Examination</option>
            <option th:each="exam : ${examinations}" th:value="${exam.id}" th:text="${exam.examinationName}">Examination</option>
          </select>
          <p class="text-danger" th:if="${#fields.hasErrors('examination')}" th:errors="*{examination}">Name Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>
        <div class="col-md-5">
          <label for="customer_name" class="form-label">Examination Date</label>
          <input type="text"  class="form-control" id="customer_name" name="examDeclaredDate" th:field="*{examDeclaredDate}" />
          <p class="text-danger" th:if="${#fields.hasErrors('examDeclaredDate')}" th:errors="*{examDeclaredDate}">date Error</p>
        </div>
        <div class="col-md-6">
          &nbsp;
        </div>


        <div class="col-md-7">
          <label for="description" class="form-label">Description</label>
          <div class="form-floating">
            <textarea id="description" placeholder="Add description here" class="form-control" name="remarks" style="height: 100px;" rows="4" cols="50" th:field="*{remarks}"></textarea>
            <label for="description">Add Description Here</label>
          </div>
          <p class="text-danger" th:if="${#fields.hasErrors('remarks')}" th:errors="*{remarks}">description Error</p>
        </div>
        <div class="col-md-2">
          &nbsp;
        </div>


        <hr/>
        <div class="col-md-4">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/examinations-date}"><i class="bi bi-arrow-left"></i> Back to List</a>
        </div>
        <div class="col-md-6 mb-5">
          <button type="submit" class="btn btn-primary"><i class="bi bi-save2-fill"></i> Save</button>
        </div>
      </div>
    </form>





  </div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
  <script type="text/javascript" th:inline="javascript">
    flatpickr("#customer_name", {
      dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
    });

    // Surfaces a same-page validation/duplicate error (set as a plain model
    // attribute when this form re-renders after a failed POST) - was set
    // server-side but never actually displayed anywhere on this page.
    const examDetailsErrorMessage = [[${error}]];
    $(document).ready(function () {
      if (examDetailsErrorMessage) showMsg("error", examDetailsErrorMessage, "Error");
    });
    toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": false,
      "progressBar": false,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "600",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    }
    


  </script>


  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>


</body>
</html>
