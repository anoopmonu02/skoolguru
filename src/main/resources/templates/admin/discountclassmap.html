<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - School</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12">

      <div th:replace="~{components/ui :: list-page-header('Discount-Grade Mapping List', null, ~{::discountClassActions})}"></div>
      <!-- discountClassActions is only ever meant to render once, inside the
           list-page-header call above via ~{::discountClassActions}. Wrapped in a
           plain display:none div (not th:remove) - see employee.html for
           why th:remove on the fragment node itself breaks this. -->
      <div style="display:none">
        <div th:fragment="discountClassActions">
          <a class="btn-cta" sms:access="ADMIN_DISCOUNT_CLASS:CREATE" th:href="@{/admin/discount-class/add}"><i class="bi bi-plus-lg"></i> Add Discount-Grade Mapping</a>
        </div>
      </div>

      <div class="list-table-card">
        <div class="config-list-toolbar list-page-toolbar">
          <div class="config-search-wrap">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control form-control-sm" id="discountClassSearchInput"
                   placeholder="Search discount-grade mappings…">
          </div>
          <div id="discountClassExportSlot" class="list-export-slot"></div>
        </div>

        <table class="table table-sm list-table" id="discountclass-list" th:if="${hasDiscountClassMap}">
          <thead>
          <tr>
            <th>#</th>
            <th>Grade</th>
            <th>Medium</th>
            <th>Discount Head</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="dcmap,iterStat : ${discountclasses}">
            <td th:text="${iterStat.index + 1}"></td>
            <td th:text="${dcmap.grade.gradeName}"></td>
            <td th:text="${dcmap.medium.mediumName}"></td>
            <td th:text="${dcmap.discounthead.discountName}"></td>
            <td th:text="${dcmap.amount}"></td>
            <td th:text="${dcmap.description}"></td>
            <td class="text-nowrap text-center">
              <div class="row-actions">
                <a sms:access="ADMIN_DISCOUNT_CLASS:EDIT" class="config-icon-btn" title="Edit"
                   th:href="@{/admin/discount-class/edit/{id}(id=${dcmap.id})}">
                  <i class="bi bi-pencil"></i></a>
                <button type="button" sms:access="ADMIN_DISCOUNT_CLASS:DELETE" class="config-icon-btn danger delete-btn" title="Delete"
                        th:data-id="${dcmap.id}" th:data-grade="${dcmap.grade.gradeName}"
                        th:data-medium="${dcmap.medium.mediumName}" th:data-discounthead="${dcmap.discounthead.discountName}"
                        th:data-amount="${dcmap.amount}" th:data-description="${dcmap.description}"
                        data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal">
                  <i class="bi bi-trash3"></i></button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>

        <div th:if="${!hasDiscountClassMap}" class="p-3">
          <div th:replace="~{components/ui :: empty-state('No Discount-Grade Mapping found.', 'bi-inbox')}"></div>
        </div>

        <!-- Custom footer: rows-per-page + "Showing X-Y of Z" + page-number
             pagination — built by the shared initListDataTable() helper
             (static/js/list-table-init.js), same as Employee/Academic-Year. -->
        <div class="list-table-footer" th:if="${hasDiscountClassMap}">
          <div class="list-footer-left">
            <label class="list-length-label">Rows per page
              <select id="discountClassPageLength" class="list-length-select">
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
            <span id="discountClassPageInfo" class="list-page-info">Showing 0 of 0 discount-grade mappings</span>
          </div>
          <div class="list-pagination" id="discountClassPagination"></div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger-subtle">
          <h5 class="modal-title text-danger-emphasis" id="deleteConfirmationModalLabel">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>Remove Discount-Grade Mapping
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-3">You're about to remove the following discount-grade mapping:</p>

          <div class="border rounded p-3 mb-3 bg-light">
            <div class="row gy-2">
              <div class="col-6">
                <small class="text-muted d-block">Grade</small>
                <span class="fw-semibold" id="deleteDiscountClassGrade">-</span>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Medium</small>
                <span class="fw-semibold" id="deleteDiscountClassMedium">-</span>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Discount Head</small>
                <span class="fw-semibold" id="deleteDiscountClassDiscounthead">-</span>
              </div>
              <div class="col-6">
                <small class="text-muted d-block">Amount</small>
                <span class="fw-semibold" id="deleteDiscountClassAmount">-</span>
              </div>
              <div class="col-12">
                <small class="text-muted d-block">Description</small>
                <span class="fw-semibold" id="deleteDiscountClassDescription">-</span>
              </div>
            </div>
          </div>

          <div class="alert alert-warning d-flex align-items-start mb-0" role="alert">
            <i class="bi bi-info-circle-fill me-2 mt-1"></i>
            <div>This cannot be undone.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Cancel </button>
          <button type="button" class="btn btn-danger" id="confirmDeleteButton"><i class="bi bi-trash3-fill"></i> Remove Mapping </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Real POST form the confirm button submits - a state-changing action
       needs to go through POST so Spring Security's CSRF check actually
       covers it (GET requests are exempt from CSRF). Thymeleaf auto-injects
       the _csrf hidden field for any th:action form, same as every other
       POST form in this app. -->
  <form id="deleteDiscountClassForm" method="post" th:action="@{/admin/discount-class/delete/0}" style="display:none"></form>

  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';

    // Flash-attribute success/error banner after redirects (save/edit/delete
    // all set these server-side already; this page just never displayed them
    // before now).
    const discountClassSuccessMessage = [[${success}]];
    const discountClassErrorMessage   = [[${error}]];

    $(document).ready(function () {
      if (discountClassSuccessMessage) showMsg("success", discountClassSuccessMessage, "Success");
      if (discountClassErrorMessage)   showMsg("error", discountClassErrorMessage, "Error");

      if ($('#discountclass-list').length) {
        initListDataTable({
          tableSelector: '#discountclass-list',
          searchInputSelector: '#discountClassSearchInput',
          exportSlotSelector: '#discountClassExportSlot',
          lengthSelectSelector: '#discountClassPageLength',
          pageInfoSelector: '#discountClassPageInfo',
          paginationSelector: '#discountClassPagination',
          itemLabel: 'discount-grade mappings',
          exportTitle: 'Discount-Grade Mapping Data export',
          exportColumns: [0, 1, 2, 3, 4, 5],
          printHeaderText: 'Discount-Grade Mappings',
          dtOptions: {
            columnDefs: [{ orderable: false, targets: [0, 6] }]
          }
        });
      }

      // Delete confirmation modal wiring — same pattern as Employee/Academic-Year List.
      let deleteDiscountClassId = null;
      $(document).on('click', '.delete-btn', function () {
        const btn = $(this);
        deleteDiscountClassId = btn.data('id');
        $('#deleteDiscountClassGrade').text(btn.data('grade') || '-');
        $('#deleteDiscountClassMedium').text(btn.data('medium') || '-');
        $('#deleteDiscountClassDiscounthead').text(btn.data('discounthead') || '-');
        $('#deleteDiscountClassAmount').text(btn.data('amount') || '-');
        $('#deleteDiscountClassDescription').text(btn.data('description') || '-');
      });

      $('#confirmDeleteButton').on('click', function () {
        if (deleteDiscountClassId) {
          const $form = $('#deleteDiscountClassForm');
          $form.attr('action', contextPath + 'admin/discount-class/delete/' + deleteDiscountClassId);
          $form.trigger('submit');
        }
      });
    });

    toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": false,
      "progressBar": false,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "600",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    }
  </script>
</section>
</body>
</html>
