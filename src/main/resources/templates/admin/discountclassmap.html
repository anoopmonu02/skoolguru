<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - School</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12 ">
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Discount-Grade Mapping List</h1>
          <div class="page-header-actions">
            <a sms:access="ADMIN_DISCOUNT_CLASS:CREATE" class="btn btn-success btn-sm" th:href="@{/admin/discount-class/add}"><i class="bi bi-plus-lg"></i> Add Discount-Grade Mapping</a>
          </div>
        </div>

        <table class="table table-bordered table-striped table-hover table-sm" th:if="${hasDiscountClassMap}" id="feeDateTable">
          <thead>
          <tr>
            <th>#</th>
            <th>Grade</th>
            <th>Feehead</th>
            <th>Amount</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody class="table-group-divider">

          <tr th:each="dcmap,iterStat : ${discountclasses}">
            <td th:text="${iterStat.index + 1}"></td><!--th:rowspan="${#lists.size(fcmap.feeClassMapSubs)}"-->
            <td th:text="${dcmap.grade.gradeName}"></td>
            <td th:text="${dcmap.discounthead.discountName}"></td>
            <td th:text="${dcmap.amount}"></td>
            <td th:text="${dcmap.description}"></td>

            <td style="white-space: nowrap" class="text-center">
              <a sms:access="ADMIN_DISCOUNT_CLASS:EDIT" class="btn btn-primary" th:href="@{/admin/discount-class/edit/{id}(id=${dcmap.id})}" data-bs-toggle="tooltip" data-bs-title="Default tooltip">
                <i class="bi bi-pencil-square"></i> </a>

              <button sms:access="ADMIN_DISCOUNT_CLASS:DELETE" class="btn btn-danger delete-btn" th:attr="data-item-id=${dcmap.id}"><i class="bi bi-trash3-fill"></i> </button>
            </td>
          </tr>
          </tbody>
        </table>
        <div th:if="${!hasDiscountClassMap}">
          <div th:replace="~{components/ui :: empty-state('No Discount-Grade Mapping found.', 'bi-inbox')}"></div>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript" type="text/javascript">
    const contextPath = /*[[@{/}]]*/ '/';
    $(document).ready(function () {
      $('.delete-btn').click(function (e) {
        e.preventDefault(); // Prevent default action of the button
        let itemId = $(this).data('item-id'); // Get the item ID from data attribute
        console.log("itemId  "+itemId);
        if (confirm('Are you sure you want to delete this record?')) {
          // Send DELETE request using AJAX
          $.ajax({
            type: 'POST',
            url: `${contextPath}admin/discount-class/delete/` + itemId,
            success: function (response) {
              // Optionally handle success response
              console.log('Item deleted successfully '+response);
              if(response.status === "success"){
                showMsg("info","Discount-Class mapping deleted successfully.","Delete");
              } else{
                const errorMsg = "Failed to delete the record." + response.message;
                //toastr["error"](errorMsg, "Error");
                showMsg("error",errorMsg,"Error");
              }
              //location.reload(); // Reload the page after successful deletion
              $('#feeDateTable').load(location.href + " #feeDateTable > *");
            },
            error: function (xhr, status, error) {
              // Handle error
              console.error('Error deleting item:', error);
              //alert('Failed to delete the record.');
              //toastr["error"]("Failed to delete the record.", "Error");
              showMsg("error","Failed to delete the record.","Error");
            }
          });
        }
      });
    });
  </script>

  <script type="text/javascript" th:inline="javascript">
    $(document).ready(function () {
      $('#feeDateTable').DataTable({
        layout: {
          bottomEnd: {
            paging: {
              firstLast: false
            }
          },
          top1Start: {
            buttons: [
              {
                extend: 'excelHtml5',
                text: '<i class="bi bi-file-excel-fill text-success"></i>',
                titleAttr: 'Excel',
                title: 'Discount-Grade Mapping Data export',
                exportOptions: {
                  columns: [0, 1, 2, 3, 4]
                }
              },
              {
                extend: 'csvHtml5',
                text: '<i class="bi bi-filetype-csv text-info"></i>',
                titleAttr: 'CSV',
                title: 'Discount-Grade Mapping Data export'
              },
              {
                extend: 'pdfHtml5',
                text: '<i class="bi bi-file-pdf-fill text-danger"></i>',
                titleAttr: 'PDF',
                title: 'Discount-Grade Mapping Data export',
                exportOptions: {
                  columns: [0, 1, 2, 3, 4]
                }
              },
              'colvis'
            ]
          }
        },
        lengthMenu: [
          [5, 10, 25, 50, 100, -1],
          [5, 10, 25, 50, 100, 'All']
        ],
        pageLength: 25,
        columnDefs: [
          { "orderable": false, "targets": [0,5] } // Disable sorting on the first and fourth columns
        ]
      });
      $(".buttons-excel, .buttons-csv, .buttons-pdf").each(function() {
        // Remove the btn-secondary class from each button
        $(this).removeClass("btn-secondary");
      });
    });

    

    /*toastr.options = {
      "closeButton": true,
      "debug": false,
      "newestOnTop": false,
      "progressBar": false,
      "positionClass": "toast-top-right",
      "preventDuplicates": false,
      "onclick": null,
      "showDuration": "600",
      "hideDuration": "1000",
      "timeOut": "5000",
      "extendedTimeOut": "1000",
      "showEasing": "swing",
      "hideEasing": "linear",
      "showMethod": "fadeIn",
      "hideMethod": "fadeOut"
    }*/
    


    




  </script>
  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
</body>
</html>
