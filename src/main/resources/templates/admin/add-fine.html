<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}" th:inline="javascript">
<head>
  <meta charset="UTF-8">
  <title>Add Fine</title>
</head>
<body>

<section class="container-fluid px-3">
  <style>
    .form-card-wrap { max-width: 760px; margin: 4px auto 40px; }
    .form-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm); padding: 26px 28px 22px;
    }
    .form-card .form-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; }
    .form-card .form-control, .form-card .form-select {
      border-radius: 10px; border: 1px solid var(--border-color); font-size: 13.8px;
    }
    .form-card .form-control:focus, .form-card .form-select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
    }
    .form-card .text-danger { font-size: 12px; margin-top: 4px; }
    .form-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; padding-top: 18px; border-top: 1px dashed var(--border-color); }
    .form-btn {
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);
      padding: 9px 18px; border-radius: 10px; font-size: 13.8px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .form-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .form-btn-primary:hover { background: var(--accent); opacity: .92; color: #fff; }
  </style>

  <div class="form-card-wrap">
    <div th:replace="~{components/ui :: page-header('Fine Form')}"></div>

    <div class="form-card">
      <form th:action="@{/admin/fine}" th:object="${fine}" method="post">
        <input type="hidden" name="school_id" id="school_id" th:field="*{school.id}"/>
        <input type="hidden" name="academicYear" id="academicYear" th:field="*{academicYear.id}" />

        <div class="row g-3">
          <div class="col-md-6">
            <label for="fine" class="form-label">Fine</label>
            <select id="fine" th:field="*{finehead}" class="form-select" name="fine">
              <option value="">Select Fine</option>
              <option th:each="fineObj : ${fineheads}" th:value="${fineObj.id}" th:text="${fineObj.fineHeadName}"
                      th:selected="${fineObj} == ${fine.finehead}">Fine</option>
            </select>
            <p class="text-danger" th:if="${#fields.hasErrors('finehead')}" th:errors="*{finehead}">Fine Error</p>
          </div>

          <div class="col-md-6">
            <label for="frequency" class="form-label">Frequency</label>
            <select id="frequency" name="frequency" class="form-select" th:field="*{frequency}">
                <option value=1 th:selected="1 == ${fine.frequency}">Monthly</option>
                <option value=2 th:selected="2 == ${fine.frequency}">Quarterly</option>
                <option value=3 th:selected="3 == ${fine.frequency}">Half Yearly</option>
                <option value=4 th:selected="4 == ${fine.frequency}">Annually</option>
            </select>
            <p class="text-danger" th:if="${#fields.hasErrors('frequency')}" th:errors="*{frequency}">date Error</p>
          </div>

          <div class="col-md-6">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="amount" name="amount" th:field="*{fineAmount}" />
            <p class="text-danger" th:if="${#fields.hasErrors('fineAmount')}" th:errors="*{fineAmount}">Amount Error</p>
          </div>

          <div class="col-md-6">
            <label for="maxcalculated" class="form-label">Max Calculated</label>
            <input type="number" class="form-control" id="maxcalculated" name="maxcalculated" th:field="*{maxCalculated}" />
            <p class="text-danger" th:if="${#fields.hasErrors('maxCalculated')}" th:errors="*{maxCalculated}">Amount Error</p>
          </div>

          <div class="col-md-12">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" placeholder="Add description here" class="form-control" name="description" style="height: 90px;" rows="4" th:field="*{description}"></textarea>
            <p class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">description Error</p>
          </div>
        </div>

        <div class="form-foot">
          <a class="form-btn" th:href="@{/admin/fine}"><i class="bi bi-arrow-left"></i> Back to List</a>
          <button type="submit" class="form-btn form-btn-primary"><i class="bi bi-save2-fill"></i> Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="text/javascript" th:inline="javascript">
    // Surfaces a same-page validation/duplicate error (set as a plain model
    // attribute when this form re-renders after a failed POST) - was set
    // server-side but never actually displayed anywhere on this page.
    const fineErrorMessage = [[${error}]];
    $(document).ready(function () {
      if (fineErrorMessage) showMsg("error", fineErrorMessage, "Error");
    });
  </script>

  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>


</body>
</html>
