<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — SkoolGuru</title>
    <!--
      Deliberately self-contained: this page must still render correctly
      when something upstream is broken (DB down, session state missing,
      etc.), so it does NOT use base::Layout (which depends on session
      school/user context via BaseController's @ModelAttribute methods —
      context CustomErrorController never populates) and does NOT pull in
      any external CDN (the old version loaded Bootstrap 4.5.2 + FontAwesome
      from two different CDNs — both single points of failure for a page
      whose whole job is to still work when things are going wrong).
      It only links tokens.css (a static asset, no model attributes needed)
      so the colours/spacing match the rest of the app, and bootstrap-icons
      which is already served locally.
    -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%; margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--body-bg); color: var(--text-primary);
        }
        .err-wrap {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .err-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
            max-width: 460px; width: 100%; padding: 44px 36px 36px; text-align: center;
        }
        .err-icon {
            width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 50%;
            background: var(--accent-light); color: var(--accent);
            display: flex; align-items: center; justify-content: center; font-size: 34px;
        }
        .err-message {
            font-size: 18px; font-weight: 700; color: var(--text-primary);
            margin: 0 0 8px; line-height: 1.4;
        }
        .err-sub {
            font-size: 13.5px; color: var(--text-muted); margin: 0 0 30px;
        }
        .err-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .err-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: 10px; font-size: 13.8px; font-weight: 700;
            text-decoration: none; cursor: pointer; border: 1px solid var(--border-color);
            transition: background var(--transition), color var(--transition), border-color var(--transition);
        }
        .err-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .err-btn-primary:hover { opacity: .92; color: #fff; }
        .err-btn-ghost { background: var(--card-bg); color: var(--text-primary); }
        .err-btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        [data-bs-theme="dark"] .err-icon { background: var(--accent-light); }
    </style>
</head>
<body>
<div class="err-wrap">
    <div class="err-card">
        <div class="err-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <p class="err-message" th:text="${errorMessage}">An unexpected error occurred</p>
        <p class="err-sub">Please try again, or head back to the homepage. If this keeps happening, let your administrator know what you were doing when it appeared.</p>
        <div class="err-actions">
            <a href="javascript:history.back()" class="err-btn err-btn-ghost"><i class="bi bi-arrow-left"></i> Go Back</a>
            <a th:href="@{/}" class="err-btn err-btn-primary"><i class="bi bi-house-door"></i> Go to Homepage</a>
        </div>
    </div>
</div>
</body>
</html>
