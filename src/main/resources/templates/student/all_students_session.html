<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <!-- Page-specific styling only — same .aa-card filter convention + shared
         "list page" datatable chrome (list-table.css + list-table-init.js)
         as the other redesigned report pages, plus a small set of insight
         components (completeness meters + a gender-distribution stacked bar)
         replacing the four cramped Chart.js bar charts this page used to
         render for what are really "ratio against a total" questions, not
         magnitude comparisons. Colors are the validated 3-slot categorical
         palette (dataviz skill default, all-pairs CVD-checked for exactly
         3 series in both light and dark) for gender identity, and this
         app's own --accent/--accent-light tokens (same-ramp fill/track) for
         the single-ratio meters. -->
    <style>
        .aa-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
        }
        .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .aa-icon {
            width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
            justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .aa-icon-accent { background: var(--accent-light); color: var(--accent); }
        .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

        .aa-btn-primary {
            background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
            border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
            transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
        }
        .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
        .aa-btn-primary:active { transform: translateY(1px); }
        .aa-btn-primary:disabled { opacity: .65; cursor: default; }

        #studentTable, #studentTable th, #studentTable td { font-size: .78rem; }
        #studentTable .stu-avatar { width: 24px; height: 24px; font-size: .62rem; }

        /* ── Insight cards ─────────────────────────────────────────────── */
        .insight-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 16px 18px; height: 100%;
        }
        .insight-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 12px; }

        /* Single-ratio meter: fill = --accent, track = --accent-light — a
           lighter step of the same ramp, per the "meter" mark spec, so state
           reads across the whole bar rather than as an unrelated gray track. */
        .meter-figure { font-size: 26px; font-weight: 700; color: var(--text-primary); line-height: 1; margin-bottom: 10px; }
        .meter-track { height: 10px; border-radius: 6px; background: var(--accent-light); overflow: hidden; }
        .meter-fill { height: 100%; border-radius: 6px; background: var(--accent); transition: width .4s ease; }
        .meter-caption { font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }

        /* Gender distribution — a single stacked bar (part-to-whole, 3
           categories) instead of a 3-bar column chart. Segments separated by
           a 2px surface gap (flex gap, not a border) with rounded outer
           corners only, via overflow:hidden on the track. */
        .gender-stack { display: flex; height: 20px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--body-bg); }
        .gender-seg { height: 100%; min-width: 2px; }
        .gender-seg-male { background: #2a78d6; }
        .gender-seg-female { background: #eb6834; }
        .gender-seg-other { background: #1baf7a; }
        [data-bs-theme="dark"] .gender-seg-male { background: #3987e5; }
        [data-bs-theme="dark"] .gender-seg-female { background: #d95926; }
        [data-bs-theme="dark"] .gender-seg-other { background: #199e70; }
        .gender-legend { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .gender-legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-primary); }
        .gender-legend-item .gender-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .gender-legend-item .gender-count { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    </style>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Student List')}"></div>

                <div class="aa-card">
                    <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-funnel-fill"></i></span><h2>Filter</h2></div>
                    <div class="aa-sub">Pick a medium, then click Get List to load the session's student data.</div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for="medium" class="form-label">Medium</label>
                            <select name="medium" id="medium" class="form-select">
                                <option value="">Select Medium</option>
                                <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex flex-column align-items-start">
                            <label class="form-label invisible">Action</label>
                            <button type="button" class="aa-btn-primary flex-fill" onclick="validateAndSubmit();"><i class="bi bi-search"></i> Get List</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Loading overlay — shown while fetch is in progress -->
        <div id="loading-overlay" style="display:none; position:fixed; inset:0; background:var(--overlay-bg);
             backdrop-filter:blur(3px); z-index:9999; flex-direction:column;
             align-items:center; justify-content:center;">
            <div class="text-center">
                <div class="spinner-border text-primary" style="width:3.5rem;height:3.5rem;" role="status">
                    <span class="visually-hidden">Loading…</span>
                </div>
                <div class="mt-3 fw-semibold text-primary fs-5">Fetching student list…</div>
                <div class="text-muted small mt-1">This may take a moment for large classes</div>
            </div>
        </div>
        <div id="printable-div" style="display: none">
            <div th:replace="~{components/ui :: page-header('All Student Data(Academic-Year)')}"></div>

            <div class="row g-3 mb-1" id="graph-div">
                <div class="col-sm-6 col-lg-3" id="gender-div-parent"></div>
                <div class="col-sm-6 col-lg-3" id="no-mobile-div-parent"></div>
                <div class="col-sm-6 col-lg-3" id="no-sr-div-parent"></div>
                <div class="col-sm-6 col-lg-3" id="no-aadhar-div-parent"></div>
            </div>

            <div class="list-table-card">
                <div class="config-list-toolbar list-page-toolbar">
                    <div class="config-search-wrap">
                        <i class="bi bi-search"></i>
                        <input type="text" class="form-control form-control-sm" id="tssSearchInput"
                               placeholder="Search by name, SR#, grade…">
                    </div>
                    <div id="tssExportSlot" class="list-export-slot"></div>
                </div>

                <div class="student-details" id="student-collection-data">

                </div>

                <div class="list-table-footer">
                    <div class="list-footer-left">
                        <label class="list-length-label">Rows per page
                            <select id="tssPageLength" class="list-length-select">
                                <option value="5">5</option>
                                <option value="10">10</option>
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </label>
                        <span id="tssPageInfo" class="list-page-info">Showing 0 of 0 students</span>
                    </div>
                    <div class="list-pagination" id="tssPagination"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';

        // Escape HTML special chars so every student/family/bank text field
        // never breaks the table or runs as markup — this page previously
        // rendered all 29 non-counter columns (names, addresses, IDs, bank
        // details, ...) completely unescaped with no escHtml() helper
        // defined at all, the widest XSS gap found in this app so far.
        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Avatar-initials chip shown next to the student's name (same
        // palette/convention used across the other report pages).
        const avatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
        const initialsOf = function (name) {
            return (name || '').trim().split(/\s+/).filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
        };

        // ── PII masking (Contact 1/2, Aadhaar, PEN, Apaar ID, Account No) ──
        // Display-only: masks the value on screen with a click-to-reveal eye
        // icon (same .mask-cell/.mask-toggle component used on Student List).
        // NOTE this is NOT a substitute for server-side masking — the real
        // value is still present in this page's AJAX response.
        const maskMobile = function (raw) {
            var v = String(raw || '');
            if (v.length <= 4) { return v; }
            return v.slice(0, 2) + 'x'.repeat(v.length - 4) + v.slice(-2);
        };
        const maskAadhaar = function (raw) {
            var digits = String(raw || '').replace(/\D/g, '');
            if (digits.length === 12) { return 'xxxx xxxx ' + digits.slice(-4); }
            var v = String(raw || '');
            return v.length <= 4 ? v : 'x'.repeat(v.length - 4) + v.slice(-4);
        };
        // Generic fallback for PEN No / Apaar ID / Account No — show only
        // the last 4 characters, mask the rest.
        const maskGeneric = function (raw) {
            var v = String(raw || '');
            return v.length <= 4 ? v : 'x'.repeat(v.length - 4) + v.slice(-4);
        };
        const maskedCell = function (raw, maskFn) {
            if (!raw) { return ''; }
            var full = escHtml(raw);
            var masked = escHtml(maskFn(raw));
            return '<span class="mask-cell">' +
                '<span class="mask-text" data-full="' + full + '" data-masked="' + masked + '">' + masked + '</span>' +
                '<button type="button" class="mask-toggle" title="Show"><i class="bi bi-eye"></i></button>' +
                '</span>';
        };
        // Mask/reveal toggle — event delegation since rows are rendered
        // dynamically after each "Get List" click.
        $(document).on('click', '.mask-toggle', function () {
            var $btn = $(this);
            var $text = $btn.siblings('.mask-text');
            var revealed = $text.attr('data-revealed') === 'true';
            if (revealed) {
                $text.text($text.attr('data-masked')).attr('data-revealed', 'false');
                $btn.attr('title', 'Show').find('i').attr('class', 'bi bi-eye');
            } else {
                $text.text($text.attr('data-full')).attr('data-revealed', 'true');
                $btn.attr('title', 'Hide').find('i').attr('class', 'bi bi-eye-slash');
            }
        });

        const validateAndSubmit=()=>{
            let medium = $("#medium").val();
            if(medium===''){
                showMsg("error","Medium is mandatory","Error");
                return;
            }
            let requestBody = {};
            requestBody = {
                medium: medium
            };
            let url = `${contextPath}getTotalStudentDetails`;

            // Show spinner, disable button
            const overlay = document.getElementById('loading-overlay');
            const getListBtn = document.querySelector('button[onclick="validateAndSubmit();"]');
            overlay.style.display = 'flex';
            if (getListBtn) { getListBtn.disabled = true; }

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    console.log("======"+response);
                    return response.json();  // Parse response as JSON
                })
                .then(data => {
                    // Hide spinner, re-enable button
                    overlay.style.display = 'none';
                    if (getListBtn) { getListBtn.disabled = false; }

                    if (!data.finalData) {
                        showMsg("error", data.error || "Server error while fetching student list", "Error");
                        return;
                    }
                    let feeData = data.finalData.totalStudentCollectionDetails;
                    if (!feeData || feeData.length === 0) {
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showMsg("error", "No matching data found for the selected medium", "No Data");
                        return;
                    }
                    // If totalStudentCollectionDetails is a string, it's a server message
                    if (typeof feeData === 'string') {
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showMsg("error",`${feeData}`,"No Data");
                        return; // Stop further execution
                    }
                    $("#printable-div").show();
                    let counter = 1;
                    let maleCounter = 0;
                    let femaleCounter = 0;
                    let notPreferredCounter = 0;
                    let mobileCounter = 0;
                    let noMobileCounter = 0;
                    let srCounter = 0;
                    let noSrCounter = 0;
                    let aadharCounter = 0;
                    let noAadharCounter = 0;
                    let tblData = `<table class="table table-sm list-table" id="studentTable">
                    <thead>
                    <tr>
                        <th>SNo</th>
                        <th>Grade</th>
                        <th>Sec</th>
                        <th>SR No</th>
                        <th>Student Name</th>
                        <th>Father Name</th>
                        <th>Mother Name</th>
                        <th>PSRN#</th>
                        <th>DOB</th>
                        <th>Religion</th>
                        <th>Caste</th>
                        <th>Category</th>
                        <th>Gender</th>
                        <th>Contact 1</th>
                        <th>Contact 2</th>
                        <th>Address</th>
                        <th>Distance->School</th>
                        <th>Aadhaar No</th>
                        <th>PEN No</th>
                        <th>Apaar ID</th>
                        <th>Blood Group</th>
                        <th>Height</th>
                        <th>Weight</th>
                        <th>Father's Qualification</th>
                        <th>Mother's Qualification</th>
                        <th>Account No</th>
                        <th>IFSC Code</th>
                        <th>Bank Name</th>
                        <th>Branch Name</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>`;
                    feeData.forEach(academicStudent =>{
                        let srno = academicStudent.classSrNo ? academicStudent.classSrNo.trim() : '';
                        let grd = academicStudent.grade.gradeName;
                        let landmark = academicStudent.student.landmark;
                        let address = academicStudent.student.address ? (academicStudent.student.address.trim() + (landmark ? ' ' + landmark.trim() : '')) : '';
                        let dt = academicStudent.migrationDate
                            ? new Date(academicStudent.migrationDate).toISOString().split('T')[0] // Extracts "2025-01-22"
                            : '';
                        if (dt) {
                            let dateObj = new Date(dt);
                            dt = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                            dt = dt.replaceAll(" ","/");
                        }
                        let dob = academicStudent.student.dob ? new Date(academicStudent.student.dob).toISOString().split('T')[0] : '';
                        if (dob) {
                            let dateObj = new Date(dob);
                            dob = dateObj.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                            dob = dob.replaceAll(" ","/");
                        }
                        // Gender is stored as free text and has historically been written
                        // in mixed case ("Male") as well as uppercase ("MALE") depending on
                        // which form saved it — compare case-insensitively so students aren't
                        // silently miscounted into "not preferred" based on casing alone.
                        let genderUpper = (academicStudent.student.gender || '').toUpperCase();
                        if(genderUpper==='MALE'){
                            maleCounter++;
                        } else if(genderUpper==='FEMALE'){
                            femaleCounter++;
                        } else{
                            notPreferredCounter++;
                        }
                        console.log(">>>>>>"+academicStudent.student.psrn);
                        if(academicStudent.student.mobile1!=''){
                            mobileCounter++;
                        } else if(academicStudent.student.mobile1===''){
                            noMobileCounter++;
                        }
                        if(srno!=''){
                            srCounter++;
                        } else if(srno===''){
                            noSrCounter++;
                        }
                        if(academicStudent.student.aadharNo!=''){
                            aadharCounter++;
                        } else if(academicStudent.student.aadharNo===''){
                            noAadharCounter++;
                        }
                        let statusClass = (academicStudent.student.status||'').toUpperCase() === 'INACTIVE' ? 'class="table-danger"' : '';
                        tblData += `<tr ${statusClass}>
                            <td>${counter}</td>
                            <td>${escHtml(grd)}</td>
                            <td>${escHtml(academicStudent.section.sectionName)}</td>
                            <td>${escHtml(srno)}</td>
                            <td>
                                <div class="stu-cell">
                                    <div class="stu-avatar" style="background:${avatarColors[counter % avatarColors.length]}22;color:${avatarColors[counter % avatarColors.length]}">${initialsOf(academicStudent.student.studentName)}</div>
                                    <div class="stu-name-stack">
                                        <span class="stu-name-text">${escHtml(academicStudent.student.studentName)}</span>
                                        <span class="stu-sub-text">Grade: ${escHtml(grd)} - ${escHtml(academicStudent.section.sectionName)} &nbsp;|&nbsp; SR No.: ${escHtml(srno) || '\u2014'}</span>
                                        <span class="stu-sub-text">PSRN#: ${escHtml(academicStudent.student.psrn) || '\u2014'}</span>
                                    </div>
                                </div>
                            </td>
                            <td>${escHtml(academicStudent.student.fatherName)}</td>
                            <td>${escHtml(academicStudent.student.motherName)}</td>
                            <td>${escHtml(academicStudent.student.psrn)}</td>

                            <td>${escHtml(dob)}</td>
                            <td>${escHtml(academicStudent.student.religion)}</td>
                            <td>${escHtml(academicStudent.student.cast.castName)}</td>
                            <td>${escHtml(academicStudent.student.category.categoryName)}</td>
                            <td>${escHtml(academicStudent.student.gender)}</td>
                            <td>${maskedCell(academicStudent.student.mobile1, maskMobile)}</td>
                            <td>${maskedCell(academicStudent.student.mobile2, maskMobile)}</td>
                            <td>${escHtml(address)}</td>
                            <td>${escHtml(academicStudent.student.distanceFromSchool)}</td>
                            <td>${maskedCell(academicStudent.student.aadharNo, maskAadhaar)}</td>
                            <!-- PEN No / Apaar ID were previously swapped here (apaarNo
                                 rendered under the "PEN No" header, penNo under "Apaar
                                 ID") — fixed to match the header order below. -->
                            <td>${maskedCell(academicStudent.student.penNo, maskGeneric)}</td>
                            <td>${maskedCell(academicStudent.student.apaarNo, maskGeneric)}</td>
                            <td>${escHtml(academicStudent.student.bloodGroup)}</td>
                            <td>${escHtml(academicStudent.student.height ?? '')}</td>
                            <td>${escHtml(academicStudent.student.weight ?? '')}</td>
                            <td>${escHtml(academicStudent.student.fatherQualification)}</td>
                            <td>${escHtml(academicStudent.student.motherQualification)}</td>
                            <td>${maskedCell(academicStudent.student.accountNo, maskGeneric)}</td>
                            <td>${escHtml(academicStudent.student.ifscCode)}</td>
                            <td>${escHtml(academicStudent.student.bank.bankName)}</td>
                            <td>${escHtml(academicStudent.student.branchName)}</td>
                            <td>${escHtml(academicStudent.student.status)}</td>
                        </tr>`;
                        counter++;
                    });
                    tblData+=`</tbody></table>`;
                    $("#student-collection-data").html(tblData);

                    const exportColumns = Array.from({length: 30}, (_, i) => i);

                    // Reset the search box / export slot / paging-length listeners
                    // before re-wiring — this handler can fire multiple times (once
                    // per "Get List" click), while only the table itself is torn
                    // down and rebuilt.
                    $('#tssExportSlot').empty();
                    $('#tssSearchInput').off('input');
                    $('#tssPageLength').off('change');

                    initListDataTable({
                        tableSelector: '#studentTable',
                        searchInputSelector: '#tssSearchInput',
                        exportSlotSelector: '#tssExportSlot',
                        lengthSelectSelector: '#tssPageLength',
                        pageInfoSelector: '#tssPageInfo',
                        paginationSelector: '#tssPagination',
                        itemLabel: 'students',
                        exportTitle: 'Total Students Data export',
                        exportColumns: exportColumns,
                        printHeaderText: 'Total Students Data',
                        // Student Name packs an avatar badge + Grade/Sec/SR/PSRN
                        // sub-lines for display (those 4 columns stay in the DOM,
                        // just hidden on screen, so export still gets them as real
                        // columns) — export should get just the plain name. Masked
                        // cells (Contact 1/2, Aadhaar, PEN, Apaar ID, Account No)
                        // must export the ORIGINAL value, not the masked display
                        // text, so they're pulled from the cell's data-full
                        // attribute instead. Everything else falls back to
                        // DataTables Buttons' own default stripping.
                        exportBodyFormat: function (data, row, column, node) {
                            var $name = $(node).find('.stu-name-text');
                            if ($name.length) { return $name.text(); }
                            var $maskText = $(node).find('.mask-text');
                            if ($maskText.length) {
                                var full = $maskText.attr('data-full') || '';
                                if (/^[=+\-@\t\r]/.test(full)) { full = "'" + full; }
                                return full;
                            }
                            return $.fn.dataTable.Buttons.stripData(data);
                        },
                        dtOptions: {
                            scrollX: true,
                            columnDefs: [
                                { orderable: false, targets: [0] },
                                { visible: false, targets: [1, 2, 3, 7] }
                            ]
                        }
                    });

                    renderInsightCards(
                        { male: maleCounter, female: femaleCounter, other: notPreferredCounter },
                        { have: mobileCounter, total: mobileCounter + noMobileCounter },
                        { have: srCounter, total: srCounter + noSrCounter },
                        { have: aadharCounter, total: aadharCounter + noAadharCounter }
                    );
                })
                .catch(error => {
                    // Hide spinner, re-enable button
                    overlay.style.display = 'none';
                    if (getListBtn) { getListBtn.disabled = false; }

                    console.error('Error:', error);  // Handle error response
                    const errorMsg = '';//(error.includes('error#####'))?error.split("#####")[1]:error;
                    $("#student-collection-data").empty();
                    $("#printable-div").hide();
                    showMsg("error", errorMsg, "Error");
                });
        };

        // Gender is a 3-category part-to-whole, best read as one stacked bar
        // rather than three separate columns — each segment is direct-labeled
        // in the legend below the bar (never color alone), width proportional
        // to its share of the total.
        function renderGenderCard(gender) {
            const total = gender.male + gender.female + gender.other;
            const pct = (n) => total > 0 ? (n / total * 100) : 0;
            const segments = [
                { key: 'male', cls: 'gender-seg-male', dotCls: 'gender-dot gender-seg-male', label: 'Male', count: gender.male },
                { key: 'female', cls: 'gender-seg-female', dotCls: 'gender-dot gender-seg-female', label: 'Female', count: gender.female },
                { key: 'other', cls: 'gender-seg-other', dotCls: 'gender-dot gender-seg-other', label: 'No Preference', count: gender.other }
            ];
            const bar = segments.map(s => `<div class="gender-seg ${s.cls}" style="width:${pct(s.count)}%" title="${escHtml(s.label)}: ${s.count} (${pct(s.count).toFixed(1)}%)"></div>`).join('');
            const legend = segments.map(s => `
                <div class="gender-legend-item">
                    <span class="${s.dotCls}"></span>
                    <span>${escHtml(s.label)}</span>
                    <span class="gender-count">${s.count} (${pct(s.count).toFixed(0)}%)</span>
                </div>`).join('');
            return `
                <div class="insight-card">
                    <div class="insight-title">Gender Distribution</div>
                    <div class="gender-stack">${bar}</div>
                    <div class="gender-legend">${legend}</div>
                </div>`;
        }

        // "X of Y students have a mobile/SR/Aadhaar number on file" is a
        // single ratio against a total, not a magnitude comparison — a meter
        // (hero percentage + same-ramp fill/track bar) reads that at a
        // glance where a 2-bar column chart made the reader do the division
        // themselves.
        function renderMeterCard(title, have, total) {
            const pct = total > 0 ? (have / total * 100) : 0;
            return `
                <div class="insight-card">
                    <div class="insight-title">${escHtml(title)}</div>
                    <div class="meter-figure">${pct.toFixed(0)}%</div>
                    <div class="meter-track"><div class="meter-fill" style="width:${pct}%"></div></div>
                    <div class="meter-caption">${have} of ${total} students</div>
                </div>`;
        }

        function renderInsightCards(gender, mobile, sr, aadhar) {
            $('#gender-div-parent').html(renderGenderCard(gender));
            $('#no-mobile-div-parent').html(renderMeterCard('Mobile on File', mobile.have, mobile.total));
            $('#no-sr-div-parent').html(renderMeterCard('SR Number Assigned', sr.have, sr.total));
            $('#no-aadhar-div-parent').html(renderMeterCard('Aadhaar on File', aadhar.have, aadhar.total));
        }

    </script>

  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. DataTables
       / Buttons / printThis / list-table-init are loaded globally too, via
       the page=='datatable' block in base.html (this controller already sets
       model.addAttribute("page", "datatable")). Chart.js is no longer needed
       on this page — the four insight cards are plain HTML/CSS (a stacked
       bar + three meters), not canvas charts. -->
</section>

</body>
</html>
