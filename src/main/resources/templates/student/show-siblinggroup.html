<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>
</head>
<body>
    <section>
        <div class="container-fluid px-3">
            <div class="row mt-2">
                <div class="col-md-12">
                    <div class="page-header page-header-row">
                      <h1 class="page-header-title">Sibling Group Detail</h1>
                      <div class="page-header-actions">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/sibling/sibling-group}"><i class="bi bi-arrow-left"></i> Back to List</a>
                      </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <span class=""><b>Group Name: </b></span><span class="mb-4" th:text="${siblinggroup.groupName}"></span>
                        </div>

                    </div>

                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>Grade</th>
                                <th>Father Name</th>
                                <th>Mother Name</th>
                                <th>Contact</th>
                                <th>School</th>
                            </tr>
                        </thead>
                        <tbody class="table-group-divider">
                            <tr th:each="stu, iter : ${siblinggroup.getSiblingGroupStudents()}">
                                <td th:text="${iter.index+1}"></td>
                                <td th:text="${stu.academicStudent.student.studentName}"></td>
                                <td th:text="${stu.academicStudent.grade.gradeName}+' - '+${stu.academicStudent.section.sectionName}"></td>
                                <td th:text="${stu.academicStudent.student.fatherName}"></td>
                                <td th:text="${stu.academicStudent.student.motherName}"></td>
                                <td th:text="${stu.academicStudent.student.mobile1}"></td>
                                <td th:text="${stu.academicStudent.school.schoolName}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
      <!-- Library <script> tags removed: this page has no JavaScript of its own,
       and base.html already loads jQuery, Bootstrap, toastr and select2. -->
</section>
</body>

</html>
