<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>
</head>
<body>
<section>

  <style>
    /* ============================================================
       Update Student Images (Group-wise) — filter card + per-row
       photo upload table, styled 1:1 off Update Student Details /
       Student Health Report (.aa-card / #usi-table conventions) so
       the same visual language means the same thing everywhere.
       ============================================================ */
    .aa-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
    }
    .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
    .aa-icon { width: 30px; height: 30px; border-radius: 9px; background: rgba(124,58,237,.12); color: #7c3aed; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

    .aa-btn-primary {
      background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
      border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
      align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
    .aa-btn-primary:active { transform: translateY(1px); }
    .aa-btn-primary:disabled { opacity: .65; cursor: default; }

    .aa-btn-outline {
      background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 18px;
      border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
      align-items: center; gap: 7px; cursor: pointer; text-decoration: none;
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }
    .aa-btn-outline:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

    .aa-count-badge {
      display: inline-flex; align-items: center; gap: 6px; background: var(--accent-light); color: var(--accent);
      border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; margin-left: auto;
    }

    #usi-table.table { border: none; width: 100%; }
    #usi-table, #usi-table th, #usi-table td { font-size: 0.82rem; }
    #usi-table thead th {
      text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 700;
      font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; background: var(--card-bg) !important;
      white-space: nowrap; border-top: none !important; border-bottom: 1px solid var(--border-color) !important;
    }
    #usi-table tbody td {
      padding: 9px 14px; vertical-align: middle; border-top: none !important; border-left: none !important;
      border-right: none !important; border-bottom: 1px solid var(--border-color) !important; background-color: transparent !important;
    }
    #usi-table tbody tr:hover td { background-color: var(--body-bg) !important; }
    #usi-table tbody tr:last-child td { border-bottom: none !important; }
    .usi-table-scroll { overflow-x: auto; }

    .aa-name-block { display: flex; flex-direction: column; line-height: 1.3; }
    .stu-cell { display: flex; align-items: center; gap: 8px; }
    .stu-avatar {
      width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: .68rem; font-weight: 700; flex-shrink: 0;
    }
    .stu-name-text { color: var(--text-primary); font-weight: 600; }
    .aa-sr-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-left: 36px; }

    .usi-photo-cell { display: flex; align-items: center; gap: 10px; }
    .usi-photo-thumb, .usi-photo-preview {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); flex-shrink: 0;
    }
    .usi-photo-placeholder {
      width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--border-color);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 15px; flex-shrink: 0;
    }
    .usi-file-input { max-width: 200px; }

    .aa-empty { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 34px 10px; }
    .aa-empty i { font-size: 26px; display: block; margin-bottom: 8px; color: var(--border-color); }

    .usi-row-save-btn .spinner-border { width: .85rem; height: .85rem; }

    /* Camera capture — icon-only button next to the file picker, plus a
       shared modal (one for the whole page, not per-row) with a live
       getUserMedia preview -> Capture -> Retake/Use Photo. "Use Photo"
       feeds the captured/compressed image into the SAME file input + Save
       flow the file picker already uses (via DataTransfer), so
       saveStudentImage and its existing validation stay untouched. */
    .usi-camera-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: var(--radius-md); flex-shrink: 0;
      border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary);
      font-size: 14px; cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
    }
    .usi-camera-btn:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
    .usi-camera-btn:disabled { opacity: .55; cursor: default; }

    .usi-cam-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 2000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .usi-cam-modal {
      background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      width: 100%; max-width: 480px; overflow: hidden; display: flex; flex-direction: column;
    }
    .usi-cam-modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-bottom: 1px solid var(--border-color);
    }
    .usi-cam-modal-head h5 { margin: 0; font-size: 14.5px; font-weight: 800; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .usi-cam-close {
      border: none; background: transparent; color: var(--text-muted); font-size: 16px; cursor: pointer;
      width: 30px; height: 30px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), color var(--transition);
    }
    .usi-cam-close:hover { background: var(--body-bg); color: var(--text-primary); }
    .usi-cam-modal-body { padding: 16px 18px; }
    .usi-cam-video-wrap {
      background: #000; border-radius: var(--radius-md); overflow: hidden;
      display: flex; align-items: center; justify-content: center; min-height: 240px;
    }
    .usi-cam-video-wrap video, .usi-cam-video-wrap canvas { width: 100%; max-height: 340px; display: block; object-fit: contain; }
    .usi-cam-error {
      margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-md);
      background: rgba(220,38,38,.08); color: #dc2626; font-size: 12.5px; font-weight: 600;
    }
    .usi-cam-modal-foot {
      display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border-color);
    }
    .usi-cam-foot-spacer { flex: 1; }
  </style>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12 ">
        <div th:replace="~{components/ui :: page-header('Update Student Images (Group-wise)')}"></div>
      </div>

      <div class="col-12">
        <div class="aa-card">
          <div class="aa-card-head"><span class="aa-icon"><i class="bi bi-images"></i></span><h2>Filter Students</h2></div>
          <div class="aa-sub">Pick Medium / Grade / Section, then upload each student's photo one at a time — every row saves on its own.</div>
          <div class="row g-3">
            <div class="col-md-2">
              <label for="medium" class="form-label">Medium</label>
              <select name="medium" id="medium" class="form-select">
                <option value="">Select</option>
                <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="grade" class="form-label">Grade</label>
              <select name="grade" id="grade" class="form-select">
                <option value="">Select</option>
                <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="section" class="form-label">Section</label>
              <select name="section" id="section" class="form-select">
                <option value="">Select</option>
                <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">Section</option>
              </select>
            </div>
            <div class="col-md-3 align-self-end">
              <button type="button" id="getListBtn" class="aa-btn-primary"><i class="bi bi-search"></i> Get Student List</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="aa-card">
          <div class="aa-card-head">
            <span class="aa-icon"><i class="bi bi-person-bounding-box"></i></span><h2>Student Photos</h2>
            <span class="aa-count-badge d-none" id="usiCountBadge"><i class="bi bi-person-check"></i> <span id="usiCountNum">0</span> students</span>
          </div>
          <div id="student-image-container">
            <div class="aa-empty"><i class="bi bi-search"></i>Pick Medium / Grade / Section above, then click "Get Student List".</div>
          </div>
        </div>
      </div>

      <div class="col-12 mb-3">
        <a th:href="@{'/student/update-student-details'}" class="aa-btn-outline">
          <i class="bi bi-arrow-left-circle me-1"></i>Update Student Details
        </a>
      </div>
    </div>
  </div>

  <!-- Camera Photo Capture — one shared modal for the whole page (not
       per-row): each row's camera-icon button opens it, and "Use Photo"
       routes the processed capture back to that row's own file input via
       usiCamTargetUuid. See script block below. -->
  <div class="usi-cam-overlay" id="usiCamOverlay" style="display:none;">
    <div class="usi-cam-modal">
      <div class="usi-cam-modal-head">
        <h5><i class="bi bi-camera-fill"></i> Capture Photo</h5>
        <button type="button" class="usi-cam-close" id="usiCamCloseBtn" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="usi-cam-modal-body">
        <div class="usi-cam-video-wrap">
          <video id="usiCamVideo" autoplay playsinline muted></video>
          <canvas id="usiCamCanvas" style="display:none;"></canvas>
        </div>
        <div class="usi-cam-error d-none" id="usiCamError"></div>
      </div>
      <div class="usi-cam-modal-foot">
        <button type="button" class="aa-btn-outline usi-cam-switch d-none" id="usiCamSwitchBtn"><i class="bi bi-arrow-repeat"></i> Switch Camera</button>
        <div class="usi-cam-foot-spacer"></div>
        <button type="button" class="aa-btn-outline usi-cam-retake d-none" id="usiCamRetakeBtn"><i class="bi bi-arrow-counterclockwise"></i> Retake</button>
        <button type="button" class="aa-btn-primary" id="usiCamCaptureBtn" disabled><i class="bi bi-camera"></i> Capture</button>
        <button type="button" class="aa-btn-primary usi-cam-use d-none" id="usiCamUseBtn"><i class="bi bi-check-lg"></i> Use Photo</button>
      </div>
    </div>
  </div>

  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';

    function showMsg(msgType, msg, headerValue) {
      toastr.options = {
        "closeButton": true, "debug": false, "newestOnTop": false, "progressBar": false,
        "positionClass": "toast-top-right", "preventDuplicates": false, "onclick": null,
        "showDuration": "600", "hideDuration": "1000", "timeOut": "5000", "extendedTimeOut": "1000",
        "showEasing": "swing", "hideEasing": "linear", "showMethod": "fadeIn", "hideMethod": "fadeOut"
      };
      toastr[msgType](msg, headerValue);
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    }

    const avatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
    const initialsOf = function (name) {
      return (name || '').trim().split(/\s+/).filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
    };

    function photoUrl(pic) {
      return pic ? (contextPath + 'student/images/' + encodeURIComponent(pic) + '?v=' + Date.now()) : '';
    }

    function validateMandatoryFilters() {
      const medium = $('#medium').val();
      const grade = $('#grade').val();
      const section = $('#section').val();
      if (!medium || !grade || !section) {
        showMsg('error', 'Medium, Grade and Section are all mandatory', 'Warning');
        return false;
      }
      return true;
    }

    function renderTable(rows) {
      let html = `<div class="usi-table-scroll"><table class="table table-sm" id="usi-table"><thead><tr>` +
        '<th>Student Name</th><th>Father Name</th><th>Mother Name</th><th>PSRN</th>' +
        '<th>Photo</th><th>New Photo</th><th></th></tr></thead><tbody>';

      rows.forEach((row, idx) => {
        const color = avatarColors[idx % avatarColors.length];
        const initials = initialsOf(row.studentName);
        const url = photoUrl(row.pic);
        const currentPhotoHtml = url
          ? `<img src="${url}" alt="" class="usi-photo-thumb" data-thumb-uuid="${row.uuid}" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'usi-photo-placeholder', innerHTML:'<i class=\\'bi bi-person\\'></i>'}))">`
          : `<span class="usi-photo-placeholder" data-thumb-uuid="${row.uuid}"><i class="bi bi-person"></i></span>`;

        html += `<tr data-uuid="${row.uuid}">`;
        html += `<td><div class="aa-name-block"><div class="stu-cell"><span class="stu-avatar" style="background:${color}">${escapeHtml(initials)}</span><span class="stu-name-text">${escapeHtml(row.studentName)}</span></div>${row.psrn ? `<span class="aa-sr-sub">PSRN: ${escapeHtml(row.psrn)}</span>` : ''}</div></td>`;
        html += `<td>${escapeHtml(row.fatherName)}</td><td>${escapeHtml(row.motherName)}</td><td>${escapeHtml(row.psrn)}</td>`;
        html += `<td><span class="usi-current-photo-slot" data-slot-uuid="${row.uuid}">${currentPhotoHtml}</span></td>`;
        html += `<td>
                    <div class="usi-photo-cell">
                      <span class="usi-preview-slot" data-preview-uuid="${row.uuid}"></span>
                      <button type="button" class="usi-camera-btn" data-uuid="${row.uuid}" title="Capture photo with camera"><i class="bi bi-camera-fill"></i></button>
                      <input type="file" accept="image/*" class="form-control form-control-sm usi-file-input image-file-input" data-uuid="${row.uuid}">
                    </div>
                  </td>`;
        html += `<td>
                    <button type="button" class="aa-btn-primary usi-row-save-btn" data-uuid="${row.uuid}">
                      <span class="usi-btn-normal"><i class="bi bi-upload"></i> Save</span>
                      <span class="usi-btn-loading d-none"><span class="spinner-border" role="status"></span> Saving...</span>
                    </button>
                  </td>`;
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      $('#student-image-container').html(html);
      $('#usiCountNum').text(rows.length);
      $('#usiCountBadge').removeClass('d-none');
    }

    $('#getListBtn').on('click', function () {
      if (!validateMandatoryFilters()) return;
      const requestData = { mediumId: $('#medium').val(), gradeId: $('#grade').val(), sectionId: $('#section').val() };
      fetch(`${contextPath}getStudentsForImageUpload`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestData)
      })
        .then(response => {
          if (!response.ok) return response.text().then(t => { throw new Error(t || 'Network response was not ok'); });
          return response.json();
        })
        .then(rows => {
          if (!Array.isArray(rows) || rows.length === 0) {
            $('#student-image-container').html('<div class="aa-empty"><i class="bi bi-emoji-frown"></i>No students found for this Medium / Grade / Section.</div>');
            $('#usiCountBadge').addClass('d-none');
            showMsg('warning', 'No students found for the given criteria.', 'No Data');
            return;
          }
          renderTable(rows);
        })
        .catch(err => {
          console.error(err);
          showMsg('error', 'An error occurred while fetching students', 'Error');
        });
    });

    // Live preview as soon as a file is chosen (event delegation — rows are
    // rendered dynamically). Also fires when the camera flow assigns a
    // captured photo into the same input, so both paths share one preview.
    $(document).on('change', '.image-file-input', function () {
      const file = this.files && this.files[0];
      const uuid = $(this).data('uuid');
      const $slot = $(`.usi-preview-slot[data-preview-uuid="${uuid}"]`);
      if (!file) { $slot.empty(); return; }
      const reader = new FileReader();
      reader.onload = function (e) {
        $slot.html(`<img src="${e.target.result}" alt="" class="usi-photo-preview">`);
      };
      reader.readAsDataURL(file);
    });

    function setRowSaveLoading($btn, isLoading) {
      $btn.prop('disabled', isLoading);
      $btn.find('.usi-btn-normal').toggleClass('d-none', isLoading);
      $btn.find('.usi-btn-loading').toggleClass('d-none', !isLoading);
    }

    // Each row saves independently — row-wise, no page-wide "Save Changes" step.
    $(document).on('click', '.usi-row-save-btn', function () {
      const $btn = $(this);
      const uuid = $btn.data('uuid');
      const $row = $btn.closest('tr');
      const $fileInput = $row.find('.image-file-input');
      const file = $fileInput[0].files && $fileInput[0].files[0];
      if (!file) {
        showMsg('error', 'Please choose a photo to upload first.', 'Nothing to Save');
        return;
      }

      const studentName = $row.find('.stu-name-text').first().text().trim();
      const formData = new FormData();
      formData.append('uuid', uuid);
      formData.append('file', file);

      setRowSaveLoading($btn, true);
      fetch(`${contextPath}saveStudentImage`, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
          if (data && data.success) {
            showMsg('success', studentName ? ('Photo saved for ' + studentName) : (data.message || 'Photo saved'), 'Saved');
            const $thumbSlot = $(`.usi-current-photo-slot[data-slot-uuid="${uuid}"]`);
            const url = photoUrl(data.fileName);
            $thumbSlot.html(`<img src="${url}" alt="" class="usi-photo-thumb" data-thumb-uuid="${uuid}">`);
            $(`.usi-preview-slot[data-preview-uuid="${uuid}"]`).empty();
            $fileInput.val('');
          } else {
            showMsg('error', (data && data.message) ? data.message : 'Failed to save the photo.', 'Error');
          }
        })
        .catch(err => {
          console.error(err);
          showMsg('error', 'An error occurred while saving. Please try again.', 'Error');
        })
        .finally(() => setRowSaveLoading($btn, false));
    });

    // ------------------------------------------------------------------
    // Camera Photo Capture — icon-only button opens a shared modal with a
    // live getUserMedia() preview. "Use Photo" downsizes/recompresses the
    // shot client-side and hands it to the SAME <input type="file"> the
    // file picker uses (via the DataTransfer trick), so the existing
    // preview + Save flow above (and /saveStudentImage) needs zero changes.
    // Secure-context only (https, or localhost specifically) — getUserMedia
    // is simply unavailable elsewhere, so the file-picker path is the only
    // graceful fallback there, same as when no camera/permission exists.
    // ------------------------------------------------------------------
    let usiCamStream = null;
    let usiCamTargetUuid = null;
    let usiCamDevices = [];
    let usiCamDeviceIndex = 0;

    function usiCameraSupported() {
      return !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }

    function usiResetCamUI() {
      $('#usiCamError').addClass('d-none').text('');
      $('#usiCamVideo').show();
      $('#usiCamCanvas').hide();
      $('#usiCamCaptureBtn').removeClass('d-none').prop('disabled', true);
      $('#usiCamRetakeBtn, #usiCamUseBtn').addClass('d-none');
      $('#usiCamSwitchBtn').addClass('d-none');
    }

    function usiShowCamError(msg) {
      $('#usiCamError').text(msg).removeClass('d-none');
      $('#usiCamVideo, #usiCamCanvas').hide();
      $('#usiCamCaptureBtn, #usiCamRetakeBtn, #usiCamUseBtn, #usiCamSwitchBtn').addClass('d-none');
    }

    function usiStopCamStream() {
      if (usiCamStream) {
        usiCamStream.getTracks().forEach(function (t) { t.stop(); });
        usiCamStream = null;
      }
    }

    function usiStartCameraStream(deviceId) {
      usiStopCamStream();
      const constraints = { audio: false, video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: 'user' } };
      navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
        usiCamStream = stream;
        const video = document.getElementById('usiCamVideo');
        video.srcObject = stream;
        const playPromise = video.play();
        if (playPromise && playPromise.catch) { playPromise.catch(function () {}); }
        $('#usiCamCaptureBtn').prop('disabled', false);

        return navigator.mediaDevices.enumerateDevices().then(function (devices) {
          usiCamDevices = devices.filter(function (d) { return d.kind === 'videoinput'; });
          if (usiCamDevices.length > 1) {
            const track = stream.getVideoTracks()[0];
            const settings = track && track.getSettings ? track.getSettings() : {};
            const idx = usiCamDevices.findIndex(function (d) { return d.deviceId === settings.deviceId; });
            usiCamDeviceIndex = idx >= 0 ? idx : 0;
            $('#usiCamSwitchBtn').removeClass('d-none');
          } else {
            $('#usiCamSwitchBtn').addClass('d-none');
          }
        });
      }).catch(function (err) {
        console.error('Camera error', err);
        let msg = 'Unable to access the camera. You can still upload a photo using the file picker.';
        if (err && err.name === 'NotAllowedError') {
          msg = 'Camera permission was denied. Please allow camera access, or upload a photo using the file picker.';
        } else if (err && (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError')) {
          msg = 'No camera was found on this device. Please upload a photo using the file picker.';
        } else if (err && err.name === 'NotReadableError') {
          msg = 'The camera is already in use by another application. Please close it and try again, or use the file picker.';
        }
        usiShowCamError(msg);
      });
    }

    function usiOpenCameraModal(uuid) {
      usiCamTargetUuid = uuid;
      usiResetCamUI();
      $('#usiCamOverlay').css('display', 'flex');
      usiStartCameraStream();
    }

    function usiCloseCameraModal() {
      usiStopCamStream();
      $('#usiCamOverlay').hide();
      usiCamTargetUuid = null;
    }

    $(document).on('click', '.usi-camera-btn', function () {
      if (!usiCameraSupported()) {
        showMsg('error', "Camera capture needs a secure connection (HTTPS, or localhost) and isn't available here. Please upload a photo using the file picker instead.", 'Camera Unavailable');
        return;
      }
      usiOpenCameraModal($(this).data('uuid'));
    });

    $('#usiCamCloseBtn').on('click', usiCloseCameraModal);
    $('#usiCamOverlay').on('click', function (e) { if (e.target === this) usiCloseCameraModal(); });
    $(document).on('keydown', function (e) {
      if (e.key === 'Escape' && $('#usiCamOverlay').is(':visible')) usiCloseCameraModal();
    });

    $('#usiCamCaptureBtn').on('click', function () {
      const video = document.getElementById('usiCamVideo');
      const canvas = document.getElementById('usiCamCanvas');
      if (!video.videoWidth || !video.videoHeight) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      $('#usiCamVideo').hide();
      $('#usiCamCanvas').show();
      $('#usiCamCaptureBtn').addClass('d-none');
      $('#usiCamRetakeBtn, #usiCamUseBtn').removeClass('d-none');
    });

    $('#usiCamRetakeBtn').on('click', function () {
      $('#usiCamCanvas').hide();
      $('#usiCamVideo').show();
      $('#usiCamCaptureBtn').removeClass('d-none');
      $('#usiCamRetakeBtn, #usiCamUseBtn').addClass('d-none');
    });

    $('#usiCamSwitchBtn').on('click', function () {
      if (!usiCamDevices.length) return;
      usiCamDeviceIndex = (usiCamDeviceIndex + 1) % usiCamDevices.length;
      usiResetCamUI();
      usiStartCameraStream(usiCamDevices[usiCamDeviceIndex].deviceId);
    });

    // Downscale to max 1280px on the long edge, then re-compress as JPEG,
    // stepping quality down until comfortably under the backend's existing
    // ~2MB hard limit (FileHandleHelper.saveImage / MAX_FILE_SIZE) — same
    // limit the file-picker path already has to satisfy, unchanged.
    function usiProcessCapturedImage(sourceCanvas, callback) {
      const MAX_DIM = 1280;
      const MAX_BYTES = 1.5 * 1024 * 1024;
      const MIN_QUALITY = 0.5;
      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      const scale = Math.min(1, MAX_DIM / Math.max(width, height));
      const outW = Math.max(1, Math.round(width * scale));
      const outH = Math.max(1, Math.round(height * scale));

      let outCanvas = sourceCanvas;
      if (scale < 1) {
        outCanvas = document.createElement('canvas');
        outCanvas.width = outW;
        outCanvas.height = outH;
        outCanvas.getContext('2d').drawImage(sourceCanvas, 0, 0, outW, outH);
      }

      function tryQuality(q) {
        outCanvas.toBlob(function (blob) {
          if (!blob) { callback(null); return; }
          if (blob.size <= MAX_BYTES || q <= MIN_QUALITY) {
            callback(blob);
          } else {
            tryQuality(Math.round((q - 0.1) * 100) / 100);
          }
        }, 'image/jpeg', q);
      }
      tryQuality(0.92);
    }

    $('#usiCamUseBtn').on('click', function () {
      const uuid = usiCamTargetUuid;
      if (!uuid) return;
      const canvas = document.getElementById('usiCamCanvas');
      const $useBtn = $(this);
      $useBtn.prop('disabled', true);

      usiProcessCapturedImage(canvas, function (blob) {
        $useBtn.prop('disabled', false);
        if (!blob) {
          showMsg('error', 'Could not process the captured photo. Please try again.', 'Error');
          return;
        }
        const file = new File([blob], 'camera-' + Date.now() + '.jpg', { type: 'image/jpeg' });
        const $fileInput = $(`.image-file-input[data-uuid="${uuid}"]`);
        if (!$fileInput.length) {
          showMsg('error', 'Could not find the photo row to attach the capture to.', 'Error');
          return;
        }
        try {
          const dt = new DataTransfer();
          dt.items.add(file);
          $fileInput[0].files = dt.files;
          $fileInput.trigger('change');
        } catch (e) {
          console.error('DataTransfer assign failed', e);
          showMsg('error', 'Your browser could not attach the captured photo. Please use the file picker instead.', 'Error');
          return;
        }
        usiCloseCameraModal();
      });
    });
  </script>
</section>
</body>
</html>
