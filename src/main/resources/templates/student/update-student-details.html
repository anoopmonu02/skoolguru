<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>
</head>
<body>
<section>

  <style>
    /* ============================================================
       Update Student Details (Group-wise) — filter card + editable
       table, styled 1:1 off the Update Aadhar / Student List pages
       (.aa-card / #sr-table-data / #student-list conventions) so the
       same visual language means the same thing everywhere in the app.
       ============================================================ */
    .aa-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
    }
    .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
    .aa-icon { width: 30px; height: 30px; border-radius: 9px; background: rgba(59,130,246,.12); color: #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

    .aa-btn-primary {
      background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
      border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
      align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
      transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
    }
    .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
    .aa-btn-primary:active { transform: translateY(1px); }

    .aa-count-badge {
      display: inline-flex; align-items: center; gap: 6px; background: var(--accent-light); color: var(--accent);
      border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; margin-left: auto;
    }

    /* Table look copied 1:1 from the Student List page (#student-list) —
       no vertical grid lines, no zebra stripes; header row + bottom hairline
       under each body row, hover highlight. No Bootstrap table-bordered. */
    #usd-table.table { border: none; width: 100%; }
    #usd-table, #usd-table th, #usd-table td { font-size: 0.82rem; }
    #usd-table thead th {
      text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 700;
      font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; background: var(--card-bg) !important;
      white-space: nowrap; border-top: none !important; border-bottom: 1px solid var(--border-color) !important;
    }
    #usd-table tbody td {
      padding: 9px 14px; vertical-align: middle; border-top: none !important; border-left: none !important;
      border-right: none !important; border-bottom: 1px solid var(--border-color) !important; background-color: transparent !important;
    }
    #usd-table tbody tr:hover td { background-color: var(--body-bg) !important; }
    #usd-table tbody tr:last-child td { border-bottom: none !important; }
    #usd-table .field-input { min-width: 140px; }
    #usd-table .field-input.is-invalid { border-color: #dc2626; }
    .usd-table-scroll { overflow-x: auto; }

    .aa-name-block { display: flex; flex-direction: column; line-height: 1.3; }
    .aa-sr-sub { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-left: 38px; }
    .stu-name-text { color: var(--text-primary); font-weight: 600; }

    .aa-empty { text-align: center; color: var(--text-muted); font-size: 13.5px; padding: 34px 10px; }
    .aa-empty i { font-size: 26px; display: block; margin-bottom: 8px; color: var(--border-color); }

    .aa-action-bar {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xs); padding: 16px 20px; margin: 0 0 40px;
    }
    .aa-save-btn {
      display: inline-flex; align-items: center; gap: 8px; border: none; color: #fff;
      background: linear-gradient(135deg, #16a34a, #15803d); padding: 11px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(22,163,74,.35);
      transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    }
    .aa-save-btn:hover { opacity: .93; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(22,163,74,.45); }
    .aa-save-btn:disabled { opacity: .65; cursor: default; transform: none; }

    .modal-header .bi { color: #3b82f6; }
  </style>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12 ">
        <div th:replace="~{components/ui :: page-header('Update Student Details')}"></div>
      </div>

      <div class="col-12">
        <div class="aa-card">
          <div class="aa-card-head"><span class="aa-icon"><i class="bi bi-pencil-square"></i></span><h2>Filter Students</h2></div>
          <div class="aa-sub">Pick Medium / Grade / Section and the data you want to update, then load the class list.</div>
          <div class="row g-3">
            <div class="col-md-2">
              <label for="medium" class="form-label">Medium</label>
              <select name="medium" id="medium" class="form-select">
                <option value="">Select Medium</option>
                <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="grade" class="form-label">Grade</label>
              <select name="grade" id="grade" class="form-select">
                <option value="">Select Grade</option>
                <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="section" class="form-label">Section</label>
              <select name="section" id="section" class="form-select">
                <option value="">Select Section</option>
                <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">Section</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="dataGroup" class="form-label">Select Data</label>
              <select name="dataGroup" id="dataGroup" class="form-select">
                <option value="">Select Data</option>
                <option th:each="grp : ${fieldGroups}" th:value="${grp.key}" th:text="${grp.label}">Group</option>
              </select>
            </div>
            <div class="col-md-3 align-self-end">
              <button type="button" id="getListBtn" class="aa-btn-primary"><i class="bi bi-search"></i> Get Student List</button>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12">
        <div class="aa-card aa-table-wrap">
          <div class="aa-card-head">
            <span class="aa-icon"><i class="bi bi-people-fill"></i></span><h2>Student List</h2>
            <span class="aa-count-badge d-none" id="usdCountBadge"><i class="bi bi-person-check"></i> <span id="usdCountNum">0</span> loaded</span>
          </div>

          <div id="student-data-container">
            <div class="aa-empty"><i class="bi bi-search"></i>Pick Medium / Grade / Section / Select Data above, then click "Get Student List".</div>
          </div>
        </div>
      </div>

      <div class="col-12" id="btn-save-row" style="display:none;">
        <div class="aa-action-bar">
          <button type="button" id="saveDataBtn" class="aa-save-btn"><i class="bi bi-save2-fill"></i> Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm-before-save modal — matches the pattern used on Update Aadhar's
       bulk save (exact count shown before anything is sent to the server). -->
  <div class="modal fade" id="saveConfirmModal" tabindex="-1" aria-labelledby="saveConfirmModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="saveConfirmModalLabel"><i class="bi bi-exclamation-triangle-fill text-warning me-1"></i> Confirm Save</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-1">You are about to update <span class="fw-bold fs-5 text-primary" id="saveConfirmCount">0</span> student record(s).</p>
          <p class="text-muted small mb-0" id="saveConfirmSkippedNote"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Cancel</button>
          <button type="button" class="aa-btn-primary" id="confirmSaveDataBtn">
            <span class="normal-state"><i class="bi bi-check-lg"></i> Yes, Save</span>
            <span class="loading-state d-none"><span class="spinner-border spinner-border-sm me-2"></span>Saving&hellip;</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
  <script th:src="@{/js/flatpickr.js}"></script>
  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';
    const CATEGORIES = /*[[${categories}]]*/ [];
    const CASTS = /*[[${casts}]]*/ [];
    const BANKS = /*[[${banks}]]*/ [];
    const PROVINCES = /*[[${provinces}]]*/ [];
    const BLOOD_GROUPS = /*[[${bloodGroups}]]*/ [];
    const BODY_TYPES = /*[[${bodyTypes}]]*/ [];
    const RELIGIONS = /*[[${religions}]]*/ [];
    const QUALIFICATIONS = /*[[${qualifications}]]*/ {};
    const QUALIFICATION_OPTIONS = Object.entries(QUALIFICATIONS).map(([label, value]) => ({ label, value }));

    const GENDER_OPTIONS = [
      { value: 'MALE', label: 'Male' },
      { value: 'FEMALE', label: 'Female' },
      { value: 'NO_PREFERENCE', label: 'No Preference' }
    ];

    // Fields where the user must only be able to TYPE digits (no letters, no
    // decimal points) — enforced live via the delegated 'input' handler below,
    // same convention add-student.html already uses via its .intfields class.
    const NUMERIC_ONLY_FIELDS = ['mobile1', 'mobile2', 'pincode', 'aadharNo', 'penNo', 'apaarId', 'accountNo', 'distanceFromSchool', 'height', 'weight'];

    // Fixed/bounded field lengths, enforced live via the HTML maxlength attribute
    // (typing simply stops accepting more once the max is reached) so a value can
    // never become "too long" client-side — the server-side checks in
    // StudentBulkUpdateService re-enforce the same limits independently.
    const FIELD_MAX_LENGTHS = {
      mobile1: 10, mobile2: 10, pincode: 6, aadharNo: 12, penNo: 11, apaarId: 12,
      distanceFromSchool: 2, ifscCode: 11, height: 3, weight: 3
    };

    function numericOnlyClass(fieldKey) { return NUMERIC_ONLY_FIELDS.includes(fieldKey) ? ' numeric-only-input' : ''; }
    function maxLengthAttr(fieldKey) { const m = FIELD_MAX_LENGTHS[fieldKey]; return m ? ` maxlength="${m}"` : ''; }

    // Delegated (not re-bound per render) so it applies to every row the table
    // ever renders, including rows added after a later "Get Student List" click.
    $(document).on('input', '.numeric-only-input', function () {
      this.value = this.value.replace(/[^0-9]/g, '');
    });

    /**
     * Body Type <-> Have Health Issue / Have Eye Issue business rule, shared by
     * every row of the HEALTH_EYE_ISSUE group:
     *  - Body Type = NORMAL: both checkboxes are forced off and disabled.
     *  - Body Type = PERSON WITH A DISABILITY: at least one of the two checkboxes
     *    must be checked (both may be checked).
     * Enforced here for immediate feedback; StudentBulkUpdateService re-enforces
     * the same rule server-side so it can't be bypassed.
     */
    function applyHealthEyeIssueRule($row) {
      const bodyType = $row.find('.field-input[data-field="bodyType"]').val();
      const $health = $row.find('.field-input[data-field="haveHealthIssues"]');
      const $eye = $row.find('.field-input[data-field="haveEyeIssue"]');
      if ($health.length === 0 && $eye.length === 0) return null;
      $health.removeClass('is-invalid');
      $eye.removeClass('is-invalid');
      if (bodyType === 'NORMAL') {
        $health.prop('disabled', true).prop('checked', false);
        $eye.prop('disabled', true).prop('checked', false);
        return null;
      }
      $health.prop('disabled', false);
      $eye.prop('disabled', false);
      if (bodyType === 'PERSON WITH A DISABILITY' && !$health.is(':checked') && !$eye.is(':checked')) {
        $health.addClass('is-invalid');
        $eye.addClass('is-invalid');
        return "For 'Person With A Disability', please select Have Health Issue or Have Eye Issue (or both).";
      }
      return null;
    }

    /**
     * Lighter pass run once at initial render only: mirrors stored Body Type by
     * disabling the checkboxes, but deliberately does NOT force-uncheck or flag
     * invalid, so loading the page never silently mutates or blocks pre-existing
     * legacy data nobody has touched yet.
     */
    function setHealthEyeIssueDisabledState($row) {
      const bodyType = $row.find('.field-input[data-field="bodyType"]').val();
      const $health = $row.find('.field-input[data-field="haveHealthIssues"]');
      const $eye = $row.find('.field-input[data-field="haveEyeIssue"]');
      $health.prop('disabled', bodyType === 'NORMAL');
      $eye.prop('disabled', bodyType === 'NORMAL');
    }

    function applyHealthEyeIssueRuleToAllRows() {
      $('#usd-table tbody tr').each(function () { setHealthEyeIssueDisabledState($(this)); });
    }

    // Delegated deliberately: a directly-bound handler gets wiped by
    // wireBlurValidation()'s '.off(\'blur change\')' elsewhere on this page.
    $(document).on('change',
      '.field-input[data-field="bodyType"], .field-input[data-field="haveHealthIssues"], .field-input[data-field="haveEyeIssue"]',
      function () {
        const error = applyHealthEyeIssueRule($(this).closest('tr'));
        if (error) showMsg('error', error, 'Validation');
      });

    function showMsg(msgType, msg, headerValue) {
      toastr.options = {
        "closeButton": true, "debug": false, "newestOnTop": false, "progressBar": false,
        "positionClass": "toast-top-right", "preventDuplicates": false, "onclick": null,
        "showDuration": "600", "hideDuration": "1000", "timeOut": "5000", "extendedTimeOut": "1000",
        "showEasing": "swing", "hideEasing": "linear", "showMethod": "fadeIn", "hideMethod": "fadeOut"
      };
      toastr[msgType](msg, headerValue);
    }

    const avatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
    const initialsOf = function (name) {
      return (name || '').trim().split(/\s+/).filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
    };

    let currentGroupKey = '';
    let currentFields = [];

    function validateMandatoryFilters() {
      const medium = $('#medium').val();
      const grade = $('#grade').val();
      const section = $('#section').val();
      const dataGroup = $('#dataGroup').val();
      if (!medium || !grade || !section || !dataGroup) {
        showMsg('error', 'Medium, Grade, Section and Select Data are all mandatory', 'Warning');
        return false;
      }
      return true;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
    }

    function optionsHtml(list, nameKey, selectedId) {
      let html = '<option value="">Select</option>';
      list.forEach(item => {
        const sel = (selectedId !== null && selectedId !== undefined && String(selectedId) === String(item.id)) ? 'selected' : '';
        html += `<option value="${item.id}" ${sel}>${escapeHtml(item[nameKey])}</option>`;
      });
      return html;
    }

    function fixedOptionsHtml(list, selectedValue) {
      let html = '<option value="">Select</option>';
      list.forEach(opt => {
        const value = (typeof opt === 'string') ? opt : opt.value;
        const label = (typeof opt === 'string') ? opt : opt.label;
        const sel = (selectedValue === value) ? 'selected' : '';
        html += `<option value="${escapeHtml(value)}" ${sel}>${escapeHtml(label)}</option>`;
      });
      return html;
    }

    function widgetHtml(field, rowUuid, value) {
      const inputId = `${field.key}_${rowUuid}`;
      switch (field.widget) {
        case 'SELECT':
          if (field.key === 'gender') return `<select class="form-select form-select-sm field-input" data-field="${field.key}" id="${inputId}" data-original-value="${escapeHtml(value)}">${fixedOptionsHtml(GENDER_OPTIONS, value)}</select>`;
          if (field.key === 'religion') return `<select class="form-select form-select-sm field-input" data-field="${field.key}" id="${inputId}" data-original-value="${escapeHtml(value)}">${fixedOptionsHtml(RELIGIONS, value)}</select>`;
          if (field.key === 'bloodGroup') return `<select class="form-select form-select-sm field-input" data-field="${field.key}" id="${inputId}" data-original-value="${escapeHtml(value)}">${fixedOptionsHtml(BLOOD_GROUPS, value)}</select>`;
          if (field.key === 'bodyType') return `<select class="form-select form-select-sm field-input" data-field="${field.key}" id="${inputId}" data-original-value="${escapeHtml(value)}">${fixedOptionsHtml(BODY_TYPES, value)}</select>`;
          if (field.key === 'fatherQualification' || field.key === 'motherQualification') return `<select class="form-select form-select-sm field-input" data-field="${field.key}" id="${inputId}" data-original-value="${escapeHtml(value)}">${fixedOptionsHtml(QUALIFICATION_OPTIONS, value)}</select>`;
          return `<input type="text" class="form-control form-control-sm field-input" data-field="${field.key}" id="${inputId}" value="${escapeHtml(value)}" data-original-value="${escapeHtml(value)}">`;
        case 'SELECT_LOOKUP': {
          let list = [], nameKey = 'name';
          if (field.key === 'category') { list = CATEGORIES; nameKey = 'categoryName'; }
          else if (field.key === 'cast') { list = CASTS; nameKey = 'castName'; }
          else if (field.key === 'bank') { list = BANKS; nameKey = 'bankName'; }
          else if (field.key === 'province') { list = PROVINCES; nameKey = 'provinceName'; }
          const selId = value && typeof value === 'object' ? value.id : null;
          return `<select class="form-select form-select-sm field-input" data-field="${field.key}" id="${inputId}" data-original-value="${selId !== null && selId !== undefined ? selId : ''}">${optionsHtml(list, nameKey, selId)}</select>`;
        }
        case 'SELECT_CITY': {
          const selId = value && typeof value === 'object' ? value.id : '';
          // Rendered empty on purpose: initializeCityDropdowns() (called right after
          // the table is injected) fetches the real city list per distinct Province
          // present in the result set and populates + preselects every row's City
          // dropdown from it.
          return `<select class="form-select form-select-sm field-input city-select" data-field="${field.key}" id="${inputId}" data-selected-city="${selId}"><option value="">Select City</option></select>`;
        }
        case 'TEXTAREA':
          return `<textarea class="form-control form-control-sm field-input" data-field="${field.key}" id="${inputId}" rows="2" data-original-value="${escapeHtml(value)}">${escapeHtml(value)}</textarea>`;
        case 'NUMBER':
          return `<input type="text" inputmode="numeric" class="form-control form-control-sm field-input${numericOnlyClass(field.key)}" data-field="${field.key}" id="${inputId}" value="${value !== null && value !== undefined ? value : ''}" data-original-value="${value !== null && value !== undefined ? value : ''}"${maxLengthAttr(field.key)}>`;
        case 'DATE':
          return `<input type="text" class="form-control form-control-sm field-input dob-input" data-field="${field.key}" id="${inputId}" value="${escapeHtml(value)}" data-original-value="${escapeHtml(value)}">`;
        case 'EMAIL':
          return `<input type="email" class="form-control form-control-sm field-input" data-field="${field.key}" id="${inputId}" value="${escapeHtml(value)}" data-original-value="${escapeHtml(value)}">`;
        case 'CHECKBOX':
          return `<input type="checkbox" class="form-check form-check-input field-input" data-field="${field.key}" id="${inputId}" ${value ? 'checked' : ''} data-original-value="${value ? 'true' : 'false'}">`;
        default:
          return `<input type="text" class="form-control form-control-sm field-input${numericOnlyClass(field.key)}" data-field="${field.key}" id="${inputId}" value="${escapeHtml(value)}" data-original-value="${escapeHtml(value)}"${maxLengthAttr(field.key)}>`;
      }
    }

    function renderTable(rows) {
      // Student Name / Father Name / Mother Name are always shown for context —
      // no SNo/Serial column (matches the Student List page, which doesn't have
      // one either). Student Name uses the same avatar-initials chip + PSRN
      // sub-line pattern as Update Aadhar's own table.
      let headerCols = '<th>Student Name</th><th>Father Name</th><th>Mother Name</th>';
      currentFields.forEach(f => headerCols += `<th>${escapeHtml(f.label)}</th>`);
      let html = `<div class="usd-table-scroll"><table class="table table-sm" id="usd-table"><thead><tr>${headerCols}</tr></thead><tbody>`;
      rows.forEach((row, idx) => {
        const color = avatarColors[idx % avatarColors.length];
        const initials = initialsOf(row.studentName);
        html += `<tr data-uuid="${row.uuid}">`;
        html += `<td><div class="aa-name-block"><div class="stu-cell"><span class="stu-avatar" style="background:${color}">${escapeHtml(initials)}</span><span class="stu-name-text">${escapeHtml(row.studentName)}</span></div>${row.psrn ? `<span class="aa-sr-sub">PSRN: ${escapeHtml(row.psrn)}</span>` : ''}</div></td>`;
        html += `<td>${escapeHtml(row.fatherName)}</td><td>${escapeHtml(row.motherName)}</td>`;
        currentFields.forEach(f => { html += `<td>${widgetHtml(f, row.uuid, row.values[f.key])}</td>`; });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      $('#student-data-container').html(html);
      $('#usdCountNum').text(rows.length);
      $('#usdCountBadge').removeClass('d-none');
      $('#btn-save-row').show();
      rebaselineSelectFields();
      initializeCityDropdowns();
      wireBlurValidation();
      wireProvinceCityCascade();
      initializeDobPickers();
      applyHealthEyeIssueRuleToAllRows();
    }

    /**
     * A <select> field's baked-in data-original-value comes straight from the
     * server's stored value (e.g. "Male" from legacy/mismatched-case data), but
     * fixedOptionsHtml()/optionsHtml() only mark an <option> selected on a strict
     * match — so when no <option> matches, the browser silently falls back to the
     * blank first option and the select's real .val() ends up "" while
     * data-original-value still holds the non-blank server value. Left alone,
     * isFieldChanged() reads that mismatch as a user edit on page load, before
     * anyone touched anything, inflating the "changed rows" count on Save.
     * Re-baselining to the select's own resolved .val() right after render makes
     * data-original-value describe what is actually shown, for every dropdown
     * field (gender, religion, bloodGroup, bodyType, category, cast, bank,
     * province, ...). The City dropdown is excluded: it tracks its baseline via
     * data-selected-city instead, set later by initializeCityDropdowns().
     */
    function rebaselineSelectFields() {
      $('#usd-table select.field-input').not('.city-select').each(function () {
        const $el = $(this);
        $el.attr('data-original-value', $el.val() || '');
      });
    }

    function initializeDobPickers() {
      $('.dob-input').each(function () {
        const el = this;
        flatpickr(el, {
          altInput: true,
          altFormat: 'd/M/Y',
          dateFormat: 'Y-m-d',
          altInputClass: 'form-control form-control-sm',
          allowInput: false,
          maxDate: 'today',
          onChange: function () { $(el).trigger('change'); }
        });
      });
    }

    /**
     * Populates every row's (initially empty) City dropdown with the FULL list of
     * cities for that row's currently-selected Province, and preselects whichever
     * city was already saved (from data-selected-city). Rows are grouped by
     * Province id first so a class where most students share the same Province
     * fires one /cities lookup per distinct Province, not one per row.
     */
    function initializeCityDropdowns() {
      const provinceGroups = {};
      $('.field-input[data-field="province"]').each(function () {
        const provinceId = $(this).val();
        if (!provinceId) return;
        const citySelect = $(this).closest('tr').find('.field-input[data-field="city"]');
        if (citySelect.length === 0) return;
        if (!provinceGroups[provinceId]) provinceGroups[provinceId] = [];
        provinceGroups[provinceId].push(citySelect);
      });
      Object.keys(provinceGroups).forEach(provinceId => {
        $.ajax({
          type: 'GET',
          url: `${contextPath}student/student/cities`,
          data: { provinceId: provinceId },
          success: function (cities) {
            provinceGroups[provinceId].forEach(citySelect => {
              const targetCityId = citySelect.attr('data-selected-city');
              citySelect.empty().append('<option value="">Select City</option>');
              (cities || []).forEach(c => {
                const sel = (targetCityId && String(targetCityId) === String(c.id)) ? 'selected' : '';
                citySelect.append(`<option value="${c.id}" ${sel}>${escapeHtml(c.cityName)}</option>`);
              });
            });
          },
          error: function () { showMsg('error', 'Unable to load cities for a selected Province', 'Error'); }
        });
      });
    }

    function wireProvinceCityCascade() {
      $('.field-input[data-field="province"]').on('change', function () {
        const row = $(this).closest('tr');
        const provinceId = $(this).val();
        const citySelect = row.find('.field-input[data-field="city"]');
        citySelect.empty().append('<option value="">Select City</option>');
        if (!provinceId) return;
        $.ajax({
          type: 'GET',
          url: `${contextPath}student/student/cities`,
          data: { provinceId: provinceId },
          success: function (cities) {
            (cities || []).forEach(c => { citySelect.append(`<option value="${c.id}">${escapeHtml(c.cityName)}</option>`); });
          },
          error: function () { showMsg('error', 'Unable to load cities for the selected Province', 'Error'); }
        });
      });
    }

    const VALIDATORS = {
      email: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? null : 'Please enter a valid email address',
      mobile1: v => (v === '' || /^[0-9]{10}$/.test(v)) ? null : 'Mobile number must be exactly 10 digits',
      mobile2: v => (v === '' || /^[0-9]{10}$/.test(v)) ? null : 'Mobile number must be exactly 10 digits',
      pincode: v => (v === '' || /^[0-9]{6}$/.test(v)) ? null : 'Pincode must be a 6-digit number',
      aadharNo: v => (v === '' || /^[0-9]{12}$/.test(v)) ? null : 'Aadhar number must be exactly 12 digits',
      penNo: v => (v === '' || /^[0-9]{11}$/.test(v)) ? null : 'PEN number must be exactly 11 digits',
      apaarId: v => (v === '' || /^[0-9]{12}$/.test(v)) ? null : 'Apaar Id must be exactly 12 digits',
      accountNo: v => (v === '' || /^[0-9]+$/.test(v)) ? null : 'Account number must contain digits only',
      distanceFromSchool: v => (v === '' || /^[0-9]{1,2}$/.test(v)) ? null : 'Distance from school must be 1 or 2 digits',
      height: v => (v === '' || (/^[0-9]{1,3}$/.test(v) && parseInt(v, 10) <= 999)) ? null : 'Height must be a valid number up to 3 digits',
      weight: v => (v === '' || (/^[0-9]{1,3}$/.test(v) && parseInt(v, 10) <= 999)) ? null : 'Weight must be a valid number up to 3 digits',
      dob: v => v !== '' ? null : 'Please enter a valid date of birth',
      address: v => v !== '' ? null : 'This field is required',
      fatherOccupation: v => v !== '' ? null : 'This field is required',
      branchName: v => v !== '' ? null : 'This field is required',
      ifscCode: v => v === '' ? 'This field is required' : (v.length <= 11 ? null : 'IFSC code must not exceed 11 characters'),
      gender: v => v !== '' ? null : 'Please select a value',
      religion: v => v !== '' ? null : 'Please select a value',
      bloodGroup: v => v !== '' ? null : 'Please select a value',
      bodyType: v => v !== '' ? null : 'Please select a value'
    };

    function checkEmailAvailability(input) {
      const email = input.val().trim();
      if (!email) return;
      const row = input.closest('tr');
      const uuid = row.attr('data-uuid');
      fetch(`${contextPath}checkStudentEmailAvailability`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, excludeUuid: uuid })
      })
        .then(r => r.json())
        .then(data => {
          if (!data.available) {
            input.addClass('is-invalid');
            showMsg('error', 'This email is already used by another student', 'Error');
          }
        })
        .catch(() => {});
    }

    function wireBlurValidation() {
      $('.field-input').off('blur change').on('blur change', function () {
        const $el = $(this);
        const field = $el.data('field');
        let value = $el.val();
        $el.removeClass('is-invalid');
        if (typeof value === 'string') {
          value = value.trim();
          if (['mobile1', 'mobile2', 'pincode', 'aadharNo', 'penNo', 'apaarId', 'accountNo', 'distanceFromSchool', 'height', 'weight'].includes(field)) {
            value = value.replace(/[^0-9]/g, '');
            $el.val(value);
          }
        }
        if (VALIDATORS[field]) {
          const error = VALIDATORS[field](value);
          if (error) {
            $el.addClass('is-invalid');
            showMsg('error', error, 'Validation');
            return;
          }
        }
        if (field === 'email' && typeof value === 'string' && value !== '') checkEmailAvailability($el);
      });
    }

    $('#getListBtn').on('click', function () {
      if (!validateMandatoryFilters()) return;
      const requestData = {
        mediumId: $('#medium').val(), gradeId: $('#grade').val(),
        sectionId: $('#section').val(), groupKey: $('#dataGroup').val()
      };
      fetch(`${contextPath}getStudentsByFieldGroup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestData)
      })
        .then(response => {
          if (!response.ok) return response.text().then(t => { throw new Error(t || 'Network response was not ok'); });
          return response.json();
        })
        .then(data => {
          if (typeof data === 'string') {
            $('#student-data-container').html('<div class="aa-empty"><i class="bi bi-emoji-frown"></i>No students found for this Medium / Grade / Section.</div>');
            $('#usdCountBadge').addClass('d-none');
            $('#btn-save-row').hide();
            showMsg('warning', data, 'No Data');
            return;
          }
          currentGroupKey = data.groupKey;
          currentFields = data.fields;
          renderTable(data.rows);
        })
        .catch(err => {
          console.error(err);
          showMsg('error', 'An error occurred while fetching students', 'Error');
        });
    });

    /**
     * Answers "did the user actually change this field?" by comparing its current
     * value against the baseline every widget was stamped with at render time
     * (data-original-value, or data-selected-city for the City dropdown). Used to
     * skip untouched rows on Save rather than re-writing records nothing happened to.
     */
    function isFieldChanged($el) {
      if ($el.attr('type') === 'checkbox') {
        const original = $el.attr('data-original-value') === 'true';
        return $el.is(':checked') !== original;
      }
      if ($el.hasClass('city-select')) {
        const original = $el.attr('data-selected-city') || '';
        return String($el.val() || '') !== String(original);
      }
      const original = $el.attr('data-original-value') || '';
      return String($el.val() || '').trim() !== String(original).trim();
    }

    function markFieldSaved($el) {
      if ($el.attr('type') === 'checkbox') {
        $el.attr('data-original-value', $el.is(':checked') ? 'true' : 'false');
      } else if ($el.hasClass('city-select')) {
        $el.attr('data-selected-city', $el.val() || '');
      } else {
        $el.attr('data-original-value', $el.val() || '');
      }
    }

    function setLoading(btnId, isLoading) {
      const btn = document.getElementById(btnId);
      btn.disabled = isLoading;
      btn.querySelector('.normal-state').classList.toggle('d-none', isLoading);
      btn.querySelector('.loading-state').classList.toggle('d-none', !isLoading);
    }

    let saveConfirmModalInstance = null;
    let pendingSaveRows = null;
    let pendingRowElementsByUuid = null;
    let pendingSkippedUnchangedCount = 0;

    function performSave() {
      fetch(`${contextPath}saveStudentFieldGroup`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ groupKey: currentGroupKey, rows: pendingSaveRows })
      })
        .then(r => r.json())
        .then(data => {
          const results = data.results || [];
          const failed = results.filter(r => !r.success);
          const passed = results.filter(r => r.success);

          // Re-baseline every field that actually saved, so clicking Save again
          // with no further edits correctly reports "no changes" a second time
          // instead of re-sending the same values forever.
          passed.forEach(r => {
            const $row = pendingRowElementsByUuid[r.uuid];
            if ($row) $row.find('.field-input').each(function () { markFieldSaved($(this)); });
          });

          if (saveConfirmModalInstance) saveConfirmModalInstance.hide();

          const skippedNote = pendingSkippedUnchangedCount > 0 ? `, ${pendingSkippedUnchangedCount} unchanged (skipped)` : '';
          if (failed.length === 0) {
            showMsg('success', `${passed.length} record(s) saved successfully${skippedNote}`, 'Updated');
          } else {
            const namedFailures = failed.slice(0, 3).map(r => {
              const $row = pendingRowElementsByUuid[r.uuid];
              const name = $row ? $row.find('.stu-name-text').first().text().trim() : r.uuid;
              return `${name}: ${r.message}`;
            }).join('; ');
            const moreFailed = failed.length > 3 ? ` (+${failed.length - 3} more)` : '';
            showMsg('warning', `${passed.length} saved${skippedNote}, ${failed.length} failed — ${namedFailures}${moreFailed}`, 'Partial Save');
          }
        })
        .catch(err => {
          console.error(err);
          showMsg('error', 'An error occurred while saving. Please try again.', 'Error');
        })
        .finally(() => {
          setLoading('confirmSaveDataBtn', false);
          pendingSaveRows = null;
          pendingRowElementsByUuid = null;
        });
    }

    $('#saveDataBtn').on('click', function () {
      const $tableRows = $('#usd-table tbody tr');
      if ($('#usd-table').length === 0 || $tableRows.length === 0) {
        showMsg('error', 'There is nothing to save. Please select Medium/Grade/Section/Select Data and click "Get Student List" first.', 'Nothing to Save');
        return;
      }

      let hasError = false;
      $('.field-input').each(function () { if ($(this).hasClass('is-invalid')) hasError = true; });
      if (hasError) {
        showMsg('error', 'Please fix the highlighted fields before saving', 'Error');
        return;
      }

      const rows = [];
      const rowElementsByUuid = {};
      let skippedUnchangedCount = 0;

      $tableRows.each(function () {
        const $row = $(this);
        const uuid = $row.attr('data-uuid');
        const values = {};
        let rowChanged = false;
        $row.find('.field-input').each(function () {
          const $el = $(this);
          const field = $el.data('field');
          values[field] = $el.attr('type') === 'checkbox' ? $el.is(':checked') : $el.val();
          if (isFieldChanged($el)) rowChanged = true;
        });
        if (rowChanged) {
          rows.push({ uuid: uuid, values: values });
          rowElementsByUuid[uuid] = $row;
        } else {
          skippedUnchangedCount++;
        }
      });

      if (rows.length === 0) {
        showMsg('error', 'No changes detected. Please modify at least one field before saving.', 'Nothing to Save');
        return;
      }

      // Comprehensive pre-save validation: run every VALIDATORS rule against
      // every field of every dirty row, not just fields the user has actually
      // blurred/changed — otherwise an untouched required field (e.g. a blank
      // Gender that was never touched) sails through and only surfaces as a
      // generic failure after Confirm Save.
      const rowErrors = [];
      rows.forEach(row => {
        const $row = rowElementsByUuid[row.uuid];
        const studentName = $row ? $row.find('.stu-name-text').first().text().trim() : row.uuid;
        Object.keys(row.values).forEach(field => {
          if (!VALIDATORS[field]) return;
          const error = VALIDATORS[field](row.values[field]);
          if (!error) return;
          const $fieldEl = $row ? $row.find(`.field-input[data-field="${field}"]`) : null;
          if ($fieldEl && $fieldEl.length) $fieldEl.addClass('is-invalid');
          const fieldDef = currentFields.find(f => f.key === field);
          rowErrors.push(`${studentName} - ${fieldDef ? fieldDef.label : field}: ${error}`);
        });
      });

      if (rowErrors.length > 0) {
        const preview = rowErrors.slice(0, 3).join('; ');
        const more = rowErrors.length > 3 ? ` (+${rowErrors.length - 3} more)` : '';
        showMsg('error', `Please fix the following before saving — ${preview}${more}`, 'Validation');
        return; // Confirm Save modal never opens if anything fails here
      }

      pendingSaveRows = rows;
      pendingRowElementsByUuid = rowElementsByUuid;
      pendingSkippedUnchangedCount = skippedUnchangedCount;

      $('#saveConfirmCount').text(rows.length);
      $('#saveConfirmSkippedNote').text(skippedUnchangedCount > 0 ? `${skippedUnchangedCount} unchanged row(s) will be skipped.` : '');

      if (!saveConfirmModalInstance) saveConfirmModalInstance = new bootstrap.Modal(document.getElementById('saveConfirmModal'));
      saveConfirmModalInstance.show();
    });

    $('#confirmSaveDataBtn').on('click', function () {
      if (!pendingSaveRows || pendingSaveRows.length === 0) return;
      setLoading('confirmSaveDataBtn', true);
      performSave();
    });
  </script>
</section>
