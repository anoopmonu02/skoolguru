<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>


</head>
<body>
<section>
  <!--
      Attendance List (monthly register) — table restyle: a card-wrapped,
      sticky-header table instead of a bare table-bordered grid; the
      Student Name + SR columns are merged into one cell with an avatar-
      initials badge (name on top, "SR: <n>" underneath, same stu-avatar
      pattern used across the fees pages this session); Present/Absent now
      use distinct check-circle / x-circle icons (not just the same person
      icon recoloured, which was easy to misread at a glance) - Sunday/
      holiday cells get a small muted "S" chip instead of bare text.
      Print + a new PDF export were added as icon-only buttons (title/
      aria-label carry the label instead) at both the top and bottom of
      the table, via the shared, CDN-free SmsPrintUtils (see
      /js/print-utils.js) already used on fee-receipt.html/feereminder.html
      this session - replacing this page's own old printDiv() function,
      which opened a new window and pulled Bootstrap from a jsdelivr CDN
      link at print time. Both action bars and the table are rebuilt
      together inside #student-grade-data on every search, so their ids
      (shPrintTop/shPdfTop/shPrintBottom/shPdfBottom) are always unique at
      any one time; the print/PDF target is #attendance-print-area, which
      wraps only the table, not the action buttons.
      New classes are prefixed "sh-" to avoid clashing with other pages.
  -->
  <style>
    .sh-table-card{ background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); overflow:hidden; }
    .sh-table-card .table-responsive{ margin:0; max-height:640px; overflow:auto; }
    .sh-table-card table{ width:100%; margin:0; font-size:.82rem; }
    .sh-table-card thead th{ position:sticky; top:0; background:var(--card-bg); color:var(--text-muted); font-size:.64rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:10px; border:none; border-bottom:1px solid var(--border-color); white-space:nowrap; z-index:1; text-align:center; }
    .sh-table-card thead th:nth-child(1), .sh-table-card thead th:nth-child(2){ text-align:left; }
    .sh-table-card td{ padding:8px 10px; border-top:1px solid var(--border-color); vertical-align:middle; text-align:center; }
    .sh-table-card td:nth-child(1), .sh-table-card td:nth-child(2){ text-align:left; }
    .sh-table-card tbody tr:hover{ background:var(--accent-light); }
    .sh-table-card tr.sh-totalrow td{ background:var(--body-bg); font-weight:700; }
    .sh-namecell{ display:flex; align-items:center; gap:8px; }
    .sh-namecell .stu-avatar{ width:28px; height:28px; font-size:.64rem; flex:none; }
    .sh-namecell-name{ font-weight:600; color:var(--text-primary); font-size:.82rem; white-space:nowrap; }
    .sh-namecell-sr{ font-size:.7rem; color:var(--text-muted); }
    .sh-daycell i{ font-size:1rem; }
    .sh-holiday{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; background:var(--body-bg); color:var(--text-muted); font-size:.66rem; font-weight:700; }
    .sh-total-frac{ font-weight:700; color:var(--text-primary); }
    .sh-actionsbar{ display:flex; justify-content:flex-end; gap:8px; margin-bottom:10px; }
    .sh-actionsbar-bottom{ margin-top:14px; margin-bottom:0; }
  </style>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-12">
        <div th:replace="~{components/ui :: page-header('Attendance List')}"></div>

        <div class="row mt-3">
          <div class="col-md-2">
            <label for="medium" class="form-label">Medium</label>
            <select name="medium" id="medium" class="form-select">
              <option value="">Select Medium</option>
              <option th:each="med : ${mediums}" th:value="${med.id}" th:text="${med.mediumName}">Medium</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="grade" class="form-label">Grade</label>
            <select name="grade" id="grade" class="form-select">
              <option value="">Select Grade</option>
              <option th:each="grade : ${grades}" th:value="${grade.id}" th:text="${grade.gradeName}">Grade</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="section" class="form-label">Section</label>
            <select name="section" id="section" class="form-select">
              <option value="">Select Section</option>
              <option th:each="section : ${sections}" th:value="${section.id}" th:text="${section.sectionName}">Section</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="month" class="form-label">Month</label>
            <select name="month" id="month" class="form-select">
              <option value="">Select Month</option>
              <option th:each="month : ${months}" th:value="${month.id}" th:text="${month.monthName}">Month</option>
            </select>
          </div>
          <div class="col-md-4 align-self-end">
            <div class="col-sm-6">
              <button name="getstu" id="getstu" class="btn btn-primary"><i class="bi bi-search"></i> Get Attendance </button>
            </div>
          </div>
        </div>
        <hr/>
        <div id="badgePDiv" class="col-md-12 text-end" style="display: none;">
                    <span id="badgedDiv" align="right" class="align-self-end">
                        <button type="button" class="btn btn-primary disabled">Total Student <span class="badge badge-info">0</span></button>
                        <button type="button" class="btn btn-success disabled">Present <span class="badge badge-success">0</span></button>
                        <button type="button" class="btn btn-danger disabled">Absent <span class="badge badge-important">0</span></button>
                    </span>
        </div>
        <div class="col-12" id="student-grade-data">

        </div>
      </div>
    </div>
  </div>


  <!-- Chart.js is only needed for the per-student pie chart, which is disabled
       for now (see createPieChart/renderStudentData below) — commented out
       rather than removed so it's a one-line restore if the chart comes back.
  <script th:src="@{/js/chart.js}"></script>
  -->
  <script th:src="@{/js/printThis.js}"></script>
  <script th:src="@{/js/html2canvas.min.js}"></script>
  <script th:src="@{/js/jspdf.umd.min.js}"></script>
  <script th:src="@{/js/print-utils.js}"></script>

  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';

    // Escapes a value before it is interpolated into an .html()-built string.
    // Student name/SR number below come straight from a JSON response with no
    // server-side escaping - a stored-XSS gap. Same fix pattern already
    // applied elsewhere in this pass.
    const escapeHtml = function (value) {
        const div = document.createElement('div');
        div.textContent = value !== undefined && value !== null ? value : '';
        return div.innerHTML;
    };

    // Avatar initials/colour — same visual pattern as the other "Neo"
    // pages this session (fees/feesubmitform-neo.html etc.).
    const _shAvatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
    const _shInitialsOf = (name) => (name || '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const _shAvatarColorFor = (id) => _shAvatarColors[Math.abs(id || 0) % _shAvatarColors.length];

    let medium, grade, section, month;

    const validateMandatoryValues=()=>{
      medium = $('#medium').val();
      grade = $('#grade').val();
      section = $('#section').val();
      month = $('#month').val();
      if(medium === '' || grade === '' || section === '' || month === ''){
        showMsg('error','Medium/Grade/Section/Month is mandatory',"Warning");
        return false;
      }
      return true;
    }

    document.getElementById("getstu").onclick = function(){
      let proceed = validateMandatoryValues();
      if(proceed){
        let url = `${contextPath}getStudentsMonthlyAttendance`;
        let requestData = {
          mediumId: medium.toString(),
          gradeId: grade.toString(),
          sectionId: section.toString(),
          monthId: month.toString()
        };
        fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestData)
        })
                .then(response => {
                  if (!response.ok) {
                    // Handle HTTP errors (e.g., 400, 500)
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                  }
                  return response.json();
                })
                .then(data => {
                  console.log("data======"+data);
                  let monthVal = parseInt(""+month);
                  let yearVal = new Date().getFullYear();
                  let daysInMonth = new Date(yearVal, monthVal, 0).getDate();

                  renderStudentData(data, daysInMonth);
                })
                .catch(error => {
                  console.error('Error:', error);
                  toastr["error"]("An error occurred while fetching the student(s)", "Error");
                });
      }
    };
    const renderStudentData=(studentData, daysInMonth)=> {
      let divTabId = $("#student-grade-data");
      divTabId.html('');
      // Icon-only Print/PDF action bar - same markup at top and bottom,
      // ids kept unique per instance. #attendance-print-area (the table
      // only, not these buttons) is the shared SmsPrintUtils target.
      const actionsBar = (idSuffix, extraClass) => `
        <div class="sh-actionsbar ${extraClass || ''}">
          <button type="button" class="btn btn-success" id="shPrint${idSuffix}" title="Print" aria-label="Print" onclick="SmsPrintUtils.printElement('attendance-print-area','Attendance List')"><i class="bi bi-printer-fill"></i></button>
          <button type="button" class="btn btn-outline-primary" id="shPdf${idSuffix}" title="Download PDF" aria-label="Download PDF" onclick="SmsPrintUtils.downloadElementAsPdf('attendance-print-area','attendance-list.pdf')"><i class="bi bi-file-earmark-pdf"></i></button>
        </div>`;

      //<th>Father Name</th><th>Mother Name</th>
      //<td>${student.studentObj.student.fatherName}</td><td>${student.studentObj.student.motherName}</td>
      let tbl = '<table class="table table-sm mb-0" id="attendance-table-data"><thead><tr><th>#</th><th>Student</th>';
      for (let i = 1; i <= daysInMonth; i++) {
        tbl += `<th>${i}</th>`;
      }
      // "Summary" (pie-chart) column disabled for now to keep the table compact —
      // uncomment to restore it alongside the other chart-related lines below.
      // tbl += `<th>Summary</th>`;
      tbl += `<th>Total</th></tr></thead><tbody class="table-group-divider">`;
      const presentDateCount = new Array(daysInMonth + 1).fill(0);
      const absentDateCount = new Array(daysInMonth + 1).fill(0);
      const holidayDateCount = new Array(daysInMonth + 1).fill(0);
      let counter = 1;
      let myMap = new Map();
      studentData.forEach(student => {
        let srno = student.studentObj.classSrNo ? student.studentObj.classSrNo.trim() : '';
        let avColor = _shAvatarColorFor(student.studentObj.id);
        let srLine = srno ? `<div class="sh-namecell-sr">SR: ${escapeHtml(srno)}</div>` : '';
        tbl += `<tr><td>${counter}</td>
                <td>
                  <div class="sh-namecell">
                    <span class="stu-avatar" style="background:${avColor}22;color:${avColor}">${escapeHtml(_shInitialsOf(student.studentName))}</span>
                    <div>
                      <div class="sh-namecell-name">${escapeHtml(student.studentName)}</div>
                      ${srLine}
                    </div>
                  </div>
                </td>`;
        let presentCount = 0;
        let absentCount = 0;
        let holidayCount = 0;
        for (let i = 1; i <= daysInMonth; i++) {
          let attendanceVal = student[i];
          let attendanceIcon = '';
          if (attendanceVal === "P") {
            // Distinct shape (not just colour) from Absent below, so the two
            // states read clearly at a glance rather than both being the
            // same person icon recoloured.
            attendanceIcon = `<span id="date-wise-att-P-${i}" class="sh-daycell"><i class="bi bi-check-circle-fill text-success"></i></span>`;
            presentCount++;
            presentDateCount[i]++;
          } else if (attendanceVal === "A") {
            attendanceIcon = `<span id="date-wise-att-A-${i}" class="sh-daycell"><i class="bi bi-x-circle-fill text-danger"></i></span>`;
            absentCount++;
            absentDateCount[i]++;
          } else if (attendanceVal === "N") {
            // Date hasn't happened yet this month — leave the cell blank and
            // don't count it toward Present/Absent/Holiday at all.
            attendanceIcon = `<span id="date-wise-att-N-${i}"></span>`;
          } else {
            holidayCount++;
            attendanceIcon = `<span id="date-wise-att-S-${i}" class="sh-holiday">S</span>`; // Sunday/holiday
            holidayDateCount[i]++;
          }
          tbl += `<td>${attendanceIcon}</td>`;
        }
        // Total days = days in month minus Sundays (holidayCount already counts
        // only Sundays — see the "S" branch above), so it doesn't need its own
        // separate tally.
        let totalDays = daysInMonth - holidayCount;
        // Pie-chart cell disabled for now — uncomment this line (and the
        // matching header <th>, the myMap.forEach() call, and the two lines
        // below) to bring it back.
        // tbl += `<td><canvas class="attendance-pie-chart" id="chart${counter}" width="150" height="100"></canvas></td>`;
        tbl += `<td><span class="sh-total-frac">${presentCount}/${totalDays}</span></td></tr>`;
        // let studentAttDataList = [presentCount, absentCount, holidayCount];
        // myMap.set(`chart${counter}`, studentAttDataList);
        counter++;
      });
      tbl += `<tr class="sh-totalrow"><td colspan="2" class="text-center">Total</td>`;
      for (let i = 1; i <= daysInMonth; i++) {
        // You can customize the display format as needed
        tbl += `<td>${
                (presentDateCount[i] + absentDateCount[i] === 0)
                        ? ''
                        : presentDateCount[i] + '/' + (presentDateCount[i] + absentDateCount[i])
        }</td>`;
      }
      // tbl += `<td></td>`; // second empty cell was for the now-disabled Summary/chart column
      tbl += `<td></td></tr>`;
      tbl+='</tbody></table>';
      // table-responsive wraps the table so a horizontal scrollbar only
      // appears when the table (up to 31 date columns wide) is actually
      // wider than the page — not shown at all otherwise.
      divTabId.html(
        actionsBar('Top') +
        '<div class="sh-table-card"><div class="table-responsive" id="attendance-print-area">' + tbl + '</div></div>' +
        actionsBar('Bottom', 'sh-actionsbar-bottom')
      );
      // Pie-chart rendering disabled for now — uncomment alongside the other
      // commented chart lines above (and the Chart.js <script> include) to restore.
      // myMap.forEach((value, key) => {
      //   console.log(key + " = " + value);
      //   createPieChart(key, value);
      // });

    }


    // Pie-chart renderer — disabled for now along with everything else that
    // fed it (see the commented lines in renderStudentData() above and the
    // commented Chart.js <script> include). Left here, commented, as a
    // one-piece restore if the chart column comes back later.
    /*
    function createPieChart(canvasId, values) {
      console.log("canvasId--->"+canvasId);
      let canv = document.getElementById(canvasId);
      var ctx = canv.getContext('2d');
      new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['Present', 'Absent', 'Holiday'],
          datasets: [{
            data: values,
            backgroundColor: ['#36A2EB', '#FF6384', '#494647FF'],
            hoverBackgroundColor: ['#36A2EB', '#FF6384', '#494647FF'],
          }]
        },
        options: {
          responsive: false,
          plugins: {
            legend: {
              position: 'left',
            },
            tooltip: {
              callbacks: {
                label: function (tooltipItem) {
                  return tooltipItem.label + ': ' + tooltipItem.raw + ' Days';
                }
              }
            }
          }
        }
      });
    }
    */

  </script>

  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
</body>
</html>
