<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <!-- Page-specific styling only — same .aa-card filter convention + shared
         "list page" datatable chrome (list-table.css + list-table-init.js)
         as the other redesigned fee/student report pages, so this one
         matches them. -->
    <style>
        .aa-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
        }
        .aa-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
        .aa-card-head h2 { font-size: 14.5px; font-weight: 800; margin: 0; color: var(--text-primary); }
        .aa-icon {
            width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center;
            justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .aa-icon-accent { background: var(--accent-light); color: var(--accent); }
        .aa-sub { font-size: 12px; color: var(--text-muted); margin: 2px 0 16px; }

        .aa-btn-primary {
            background: var(--accent); border: 1px solid var(--accent); color: #fff; padding: 8px 18px;
            border-radius: var(--radius-md); font-size: 13.5px; font-weight: 700; display: inline-flex;
            align-items: center; gap: 7px; cursor: pointer; box-shadow: var(--shadow-sm);
            transition: background var(--transition), box-shadow var(--transition), transform var(--transition);
        }
        .aa-btn-primary:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; box-shadow: var(--shadow-md); }
        .aa-btn-primary:active { transform: translateY(1px); }
        .aa-btn-primary:disabled { opacity: .65; cursor: default; }

        #studentTable, #studentTable th, #studentTable td { font-size: .8rem; }
    </style>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Students Eligible For Discount')}"></div>

                <div class="aa-card">
                    <div class="aa-card-head"><span class="aa-icon aa-icon-accent"><i class="bi bi-funnel-fill"></i></span><h2>Filter</h2></div>
                    <div class="aa-sub">Pick an academic year, then click Get List to load students eligible for discount.</div>
                    <div class="row">
                        <div class="col-md-3">
                            <label for="academic_year" class="form-label">Academic Year</label>
                            <select name="academic_year" id="academic_year" class="form-select">
                                <option th:each="med : ${academicYears}" th:value="${med.id}" th:text="${med.sessionFormat}">Academic Year</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex flex-column align-items-start">
                            <label class="form-label invisible">Action</label>
                            <button name="getfee" id="getfee" class="aa-btn-primary flex-fill"><i class="bi bi-search"></i> Get List</button>
                        </div>
                    </div>
                </div>

                <div id="printable-div" style="display: none">
                    <div th:replace="~{components/ui :: page-header('Eligible Students List')}"></div>

                    <div class="list-table-card">
                        <div class="config-list-toolbar list-page-toolbar">
                            <div class="config-search-wrap">
                                <i class="bi bi-search"></i>
                                <input type="text" class="form-control form-control-sm" id="sdsSearchInput"
                                       placeholder="Search by name, grade, discount…">
                            </div>
                            <div id="sdsExportSlot" class="list-export-slot"></div>
                        </div>

                        <div class="student-details" id="student-collection-data">

                        </div>

                        <div class="list-table-footer">
                            <div class="list-footer-left">
                                <label class="list-length-label">Rows per page
                                    <select id="sdsPageLength" class="list-length-select">
                                        <option value="5">5</option>
                                        <option value="10">10</option>
                                        <option value="25" selected>25</option>
                                        <option value="50">50</option>
                                        <option value="100">100</option>
                                    </select>
                                </label>
                                <span id="sdsPageInfo" class="list-page-info">Showing 0 of 0 students</span>
                            </div>
                            <div class="list-pagination" id="sdsPagination"></div>
                        </div>
                    </div>
                </div>



            </div>
        </div>
    </div>

    <link type="text/css" rel="stylesheet" th:href="@{/css/flatpickr.min.css}"/>
    <script th:src="@{/js/flatpickr.js}"></script>
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>-->

    <script type="text/javascript" th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';
        flatpickr("#lastdate", {
            dateFormat: "d/M/Y",  // Equivalent to dd/MMM/yyyy
        });

        function showWarningMsg(msgType, msg, headerValue){
            toastr.options = {
                "closeButton": true,
                "debug": false,
                "newestOnTop": false,
                "progressBar": false,
                "positionClass": "toast-top-right",
                "preventDuplicates": false,
                "onclick": null,
                "showDuration": "600",
                "hideDuration": "1000",
                "timeOut": "5000",
                "extendedTimeOut": "1000",
                "showEasing": "swing",
                "hideEasing": "linear",
                "showMethod": "fadeIn",
                "hideMethod": "fadeOut"
            }
            toastr[msgType](msg,headerValue);
        }

        // Escape HTML special chars so student/father names, grade, discount
        // name and description never break the table or run as markup — this
        // page previously rendered these fields completely unescaped with no
        // escHtml() helper defined at all (a genuine XSS gap; the sibling
        // report pages already had this helper).
        function escHtml(str) {
            if (str == null) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        $('#getfee').click(async function() {
            $("#student-collection-data").empty();
            $("#printable-div").hide();
            let academicYearVal = $("#academic_year").val();

            if(academicYearVal === ''){
                showWarningMsg('error','Academic Year is mandatory',"Warning");
                return;
            }
            let checkBoxes = "";

            let url = `${contextPath}getStudentsDiscountList`;
            try{
                const requestBody = {
                    academicYearId:academicYearVal
                };
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                //console.log("response "+response);
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                //console.log("-----------------------------")
                const data = await response.json();
                console.log("error: "+data.error);
                console.log("stu: "+data.stuData);
                console.log("res:4: "+data.error);
                if(data.error!=null){
                    $("#student-collection-data").empty();
                    $("#printable-div").hide();
                    showWarningMsg("error", data.error, "No Data");
                    return;
                } else{
                    if(data.stuData!=null){
                        let stulist = data.stuData;
                        $("#printable-div").show();
                        let tblData = `<table class="table table-sm list-table" id="studentTable">
                            <thead>
                            <tr>
                                <th>SNo</th>
                                <th>Grade</th>
                                <th>SR No</th>
                                <th>Student Name</th>
                                <th>Father Name</th>
                                <th>Discount Name</th>
                                <th>Description</th>
                                <th>Assigned By</th>`;

                        tblData+=`</tr></thead><tbody>`;
                        let counter = 1;
                        for (let i=0;i<stulist.length;i++) {
                            console.log("key======>>>>>>> "+stulist);
                            let studentData = stulist[i];
                            console.log("key====== "+i);
                            tblData += `<tr>
                                    <td>${counter}</td>
                                    <td>${escHtml(studentData.grade)}</td>
                                    <td>${escHtml(studentData.srNo)}</td><td>${escHtml(studentData.studentName)}</td><td>${escHtml(studentData.fatherName)}</td><td>${escHtml(studentData.discount)}</td><td>${escHtml(studentData.description)}</td><td>${escHtml(studentData.assignedBy || '')}</td>`;

                            tblData+=`</tr>`;
                            counter++;
                        }
                        tblData+=`</tbody></table>`;
                        //console.log("table last-"+tblData)
                        $("#student-collection-data").html(tblData);

                        // Reset the search box / export slot / paging-length listeners
                        // before re-wiring — this handler can fire multiple times (once
                        // per "Get List" click), while only the table itself is torn
                        // down and rebuilt.
                        $('#sdsExportSlot').empty();
                        $('#sdsSearchInput').off('input');
                        $('#sdsPageLength').off('change');

                        initListDataTable({
                            tableSelector: '#studentTable',
                            searchInputSelector: '#sdsSearchInput',
                            exportSlotSelector: '#sdsExportSlot',
                            lengthSelectSelector: '#sdsPageLength',
                            pageInfoSelector: '#sdsPageInfo',
                            paginationSelector: '#sdsPagination',
                            itemLabel: 'students',
                            exportTitle: 'Total Students Discount Data export',
                            exportColumns: [0,1,2,3,4,5,6,7],
                            printHeaderText: 'Total Students Discount Data',
                            dtOptions: {
                                scrollX: true,
                                autoWidth: false,
                                scrollCollapse: true,
                                sort: false,
                                fixedColumns: false,
                                columnDefs: [{ orderable: false, targets: [0] }]
                            }
                        });

                        if(data.error!=null){
                            $("#student-collection-data").empty();
                            $("#printable-div").hide();
                            showWarningMsg('error', "Error: "+data.error, "Error");
                        }
                    } else{
                        $("#student-collection-data").empty();
                        $("#printable-div").hide();
                        showWarningMsg("error", "Data not found", "No Data");
                        return;
                    }
                }
            } catch(error) {
                $("#student-collection-data").empty();
                $("#printable-div").hide();
                showWarningMsg('error', "There was a problem with the fetch operation: " + error, "Error");
            }
        });



    </script>
  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>

</body>
</html>
