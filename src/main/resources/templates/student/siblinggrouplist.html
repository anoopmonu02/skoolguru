<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Student</title>
</head>
    <body>
        <section>
            <div class="container-fluid px-3">
                <div class="row mt-2">
                    <div class="col-md-12">
                        <div class="page-header page-header-row">
                          <h1 class="page-header-title">Sibling Group List</h1>
                          <div class="page-header-actions">
                            <a sms:access="SIBLING_ADD:CREATE" class="btn btn-success btn-sm" th:href="@{/sibling/sibling-group/add}"><i class="bi bi-plus-lg"></i> Add Sibling-Group</a>
                          </div>
                        </div>

                        <table class="table table-bordered table-striped table-hover table-sm" th:if="${hasSiblingGroup}">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Group Name</th>
                                    <th>Description</th>
                                    <th>Siblings#</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody class="table-group-divider">
                                <tr th:each="sibgrp,iterStat : ${siblingGroups}">
                                    <td th:text="${iterStat.index + 1}"></td>
                                    <td th:text="${sibgrp.groupName}"></td>
                                    <td th:text="${sibgrp.description}"></td>
                                    <td th:text="${sibgrp.getSiblingGroupStudents().size()}">
                                        <!--<table class="table table-sm">
                                            <tr th:each="stu, iter: ${sibgrp.getSiblingGroupStudents()}">
                                                <td th:text="${iter.index+1}+'. '"></td>
                                                <td th:text="${stu.academicStudent.student.studentName}"></td>
                                                <td th:text="${stu.academicStudent.grade.gradeName}+' - '+${stu.academicStudent.section.sectionName}"></td>
                                            </tr>
                                        </table>-->

                                    </td>
                                    <td style="white-space: nowrap" class="text-center">
                                        <div class="col align-self-center">
                                            <a class="btn btn-dark" th:href="@{/sibling/sibling-group/show/{id}(id=${sibgrp.id})}" data-bs-toggle="tooltip" data-bs-title="Default tooltip">
                                                <i class="bi bi-list"></i> </a>
                                            <!--<a class="btn btn-danger" th:href="@{/sibling/sibling-group/delete/{id}(id=${sibgrp.id})}" data-bs-toggle="tooltip" data-bs-title="Default tooltip">
                                                <i class="bi bi-trash3-fill"></i> </a>-->
                                            <a sms:access="SIBLING_DELETE:DELETE" class="btn btn-danger" th:data-id="${sibgrp.id}" data-bs-toggle="modal" data-bs-target="#deleteConfirmationModal" data-bs-title="Default tooltip">
                                                <i class="bi bi-trash3-fill"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <div th:if="${!hasSiblingGroup}">
                            <div th:replace="~{components/ui :: empty-state('No Sibling-Group found.', 'bi-inbox')}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Delete Confirmation Modal -->
            <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="deleteConfirmationModalLabel">Confirm Deletion</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            Are you sure you want to delete this record?
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="button" class="btn btn-danger" id="confirmDeleteButton">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

            <script type="text/javascript" th:inline="javascript">
                const contextPath = /*[[@{/}]]*/ '/';
                toastr.options = {
                    "closeButton": true,
                    "debug": false,
                    "newestOnTop": false,
                    "progressBar": false,
                    "positionClass": "toast-top-right",
                    "preventDuplicates": false,
                    "onclick": null,
                    "showDuration": "600",
                    "hideDuration": "1000",
                    "timeOut": "5000",
                    "extendedTimeOut": "1000",
                    "showEasing": "swing",
                    "hideEasing": "linear",
                    "showMethod": "fadeIn",
                    "hideMethod": "fadeOut"
                }
                

                



                let deleteId = null;

                // Capture the ID of the record to be deleted when the delete button is clicked
                $('a[data-bs-target="#deleteConfirmationModal"]').on('click', function () {
                    deleteId = $(this).data('id');
                });

                // Handle the deletion when "Delete" button is clicked in the modal
                $('#confirmDeleteButton').on('click', function () {
                    if (deleteId) {
                        // Redirect to the delete URL
                        window.location.href = `${contextPath}sibling/sibling-group/delete/${deleteId}`;
                    }
                });
            </script>
          <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
    </body>
</html>
