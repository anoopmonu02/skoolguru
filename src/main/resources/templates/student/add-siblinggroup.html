<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Student</title>
</head>
<body>
<section>

    <!-- Page-local, scoped card look — same ".aa-card" pattern already used on
         Update Aadhar / Update Student Details / Student Health Report, reused
         here for visual consistency rather than redefined. Purely cosmetic:
         no selector below is referenced by this page's JS (which binds by id
         and by .remove-sibling-row / .search-result / etc., all untouched). -->
    <style>
        .aa-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xs); padding: 20px 22px; margin-bottom: 18px;
        }
        .aa-card h4 { font-size: 14.5px; font-weight: 800; margin: 0 0 2px; color: var(--text-primary); }
        .aa-card hr { margin: 10px 0 16px; }

        /* Compact, borderless look for the dynamically-built sibling table,
           matching the font-size/header-background convention used on every
           other list/table this session (e.g. Student List, Update Student
           Details) — kept as a plain styled <table>, not a DataTables
           instance: rows here are added/removed one at a time by
           buildSiblingRow()/renumberSiblingRows() as the user searches, which
           is a different interaction shape from a load-once, browse/sort/
           export list, so DataTables' own row ownership would fight this
           page's incremental add/remove instead of helping it. */
        #siblingTable { border: none; }
        #siblingTable thead th {
            text-align: left; padding: 10px 14px; color: var(--text-muted); font-weight: 700;
            font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
            background: var(--card-bg); white-space: nowrap;
            border-top: none !important; border-bottom: 1px solid var(--border-color) !important;
        }
        #siblingTable tbody td {
            padding: 9px 14px; vertical-align: middle; font-size: .85rem;
            border-top: none !important; border-left: none !important; border-right: none !important;
            border-bottom: 1px solid var(--border-color) !important; background-color: transparent !important;
        }
        #siblingTable tbody tr:last-child td { border-bottom: none !important; }

        /* Search box + results dropdown — same pattern as Discount Assign's
           student search (student/discountassign.html), reused verbatim
           here for both search boxes on this page. */
        .da-search-wrap { position: relative; }
        .da-search-wrap input { padding-left: 38px; }
        .da-search-wrap .bi-search { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .da-search-results { position: absolute; z-index: 20; width: 100%; max-height: 320px; overflow-y: auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); margin-top: 4px; display: none; }
        .da-result-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .da-result-row:last-child { border-bottom: none; }
        .da-result-row:hover { background: var(--accent-light); }
        .da-result-name { font-weight: 600; color: var(--text-primary); }
        .da-result-sub { font-size: .72rem; color: var(--text-muted); }
        .da-result-empty { padding: 14px; color: var(--text-muted); font-size: .85rem; text-align: center; }
    </style>

    <div class="container-fluid px-3">
        <div class="row mt-2">
            <div class="col-md-12">
                <div th:replace="~{components/ui :: page-header('Sibling Group Form')}"></div>

                <!--Search box-->
                <div class="aa-card">
                    <h4>Search by Family</h4>
                    <p class="aa-sub" style="font-size:12px;color:var(--text-muted);margin:2px 0 12px;">
                        Search an already-known sibling and this pulls in every student on record with the same family — fastest way to build a group.
                    </p>
                    <div class="da-search-wrap">
                        <i class="bi bi-search"></i>
                        <input type="text" onkeyup="searchStuName()" class="form-control" id="search-input" placeholder="Search student name" autocomplete="off">
                        <div class="da-search-results search-result"></div>
                    </div>
                </div>

                <!--Add Individual Student-->
                <div class="aa-card">
                    <h4>Add Manually, if not sure</h4>
                    <hr/>
                    <div class="row search-container1">
                        <div class="col-md-6 search-block">
                            <label for="search-input1" class="form-label">Student Name</label>
                            <div class="da-search-wrap">
                                <i class="bi bi-search"></i>
                                <input type="text" onkeyup="searchStuNameIndividual()" class="form-control" id="search-input1" placeholder="Search student name" name="stuname" autocomplete="off">
                                <div class="da-search-results search-result1"></div>
                            </div>
                        </div>
                        <div class="col-md-1">
                            <input type="hidden" id="academic_student" name="academic_student" />
                            <input type="hidden" id="student_id_global" />
                        </div>
                        <div class="col-md-5 align-self-end">
                            <label class="form-label">&nbsp;</label>
                            <div>
                                <button onclick="checkStudentData()" class="btn btn-primary" id="siblingAddBtn"><i class="bi bi-person-plus-fill"></i> Add Student</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="group-data" style="display: none">
                    <div th:replace="~{components/ui :: page-header('Create Group')}"></div>

                    <form name="siblinggroup" th:action="@{/sibling/savesiblinggroup}" method="post">
                        <div class="aa-card">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="groupname" class="form-label">Group Name</label>
                                    <input type="text" class="form-control" name="groupname" id="groupname">
                                </div>
                            </div>
                            <h4>Sibling List</h4>
                            <hr/>
                            <div class="table-responsive">
                                <table class="table table-sm" id="siblingTable">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Student Name</th>
                                        <th>Father Name</th>
                                        <th>Mother Name</th>
                                        <th>Grade</th>
                                        <th>Branch</th>
                                        <th>Action</th>
                                    </tr>
                                    </thead>
                                    <tbody>

                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-5">
                                <a th:replace="~{components/ui :: back-link('/sibling/sibling-group', 'Back to List')}"></a>
                            </div>
                            <div class="col-md-6 mb-5 text-md-end">
                                <button type="button" onclick="checkData()" class="btn btn-primary" id="siblingSubmitBtn"><i class="bi bi-save2-fill"></i> Save</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script th:inline="javascript">
        const contextPath = /*[[@{/}]]*/ '/';
    </script>
    <script type="text/javascript" th:inline="javascript">
        // Escapes a value before it's concatenated into innerHTML below -
        // student/father names are DB data, not hard-coded strings, so this
        // closes off a stored-XSS path in the AJAX-built search results
        // (same approach used on Student List / Discount Assign).
        const daEscape = function (value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        };
        const daAvatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
        const daInitialsOf = function (name) {
            return (name || '').trim().split(/\s+/).filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase();
        };
        const daAvatarColorFor = function (id) {
            return daAvatarColors[Math.abs(id || 0) % daAvatarColors.length];
        };

        /* ── Search box 1 (group search via searchStudentForOtherPage) ── */
        let _sb1Query = '', _sb1Page = 0, _sb1More = false, _sb1Loading = false;
        const _sb1Row = (s) => {
            const sr = s.classSrNo ? ' / SR ' + daEscape(s.classSrNo) : '';
            const color = daAvatarColorFor(s.student ? s.student.id : s.id);
            return `<div class="da-result-row" onclick="loadStudentData(${s.id})">` +
                `<div class="stu-avatar" style="background:${color}22;color:${color}">${daEscape(daInitialsOf(s.student.studentName))}</div>` +
                `<div><div class="da-result-name">${daEscape(s.student.studentName)}</div>` +
                `<div class="da-result-sub">${daEscape(s.student.fatherName)} &middot; ${daEscape(s.grade.gradeName)}-${daEscape(s.section.sectionName)}${sr}</div></div>` +
                `</div>`;
        };
        const _sb1Fetch = (query, page, append) => {
            if (_sb1Loading) return;
            _sb1Loading = true;
            fetch(`${contextPath}searchStudentForOtherPage/${encodeURIComponent(query)}?page=${page}`)
                .then(r => r.json()).then(data => {
                    _sb1Loading = false;
                    _sb1More = data.length === 10;
                    if (!append) {
                        if (data.length === 0) {
                            $(".search-result").html(`<div class="da-result-empty">No students found.</div>`).show();
                        } else {
                            let html = `<div id='sb1-list-group'>`;
                            data.forEach(s => { html += _sb1Row(s); });
                            $(".search-result").html(html + `</div>`).show();
                        }
                    } else {
                        data.forEach(s => { $('#sb1-list-group').append(_sb1Row(s)); });
                    }
                }).catch(() => { _sb1Loading = false; });
        };
        const searchStuName = () => {
            let query = $("#search-input").val();
            if (query.trim().length > 2) {
                if (query !== _sb1Query) { _sb1Query = query; _sb1Page = 0; _sb1Fetch(query, 0, false); }
            } else { _sb1Query = ''; $(".search-result").hide(); }
        };
        document.querySelector('.search-result').addEventListener('scroll', function() {
            if (!_sb1More || _sb1Loading) return;
            if (this.scrollTop + this.clientHeight >= this.scrollHeight - 40) { _sb1Page++; _sb1Fetch(_sb1Query, _sb1Page, true); }
        });

        /* ── Search box 2 (individual — GLOBAL search: all active students, all branches) ── */
        let _sb2Query = '', _sb2Page = 0, _sb2More = false, _sb2Loading = false;
        // Cache stores full lean-map objects keyed by academicStudent.id
        // so we can build the table row without a second API call
        const _sb2Cache = {};

        const _sb2Row = (s) => {
            const sr = s.classSrNo ? ' / SR ' + daEscape(s.classSrNo) : '';
            const school = s.school ? ' &middot; ' + daEscape(s.school.schoolName) : '';
            const color = daAvatarColorFor(s.student ? s.student.id : s.id);
            return `<div class="da-result-row" onclick="loadStudentData1(${s.id})">` +
                `<div class="stu-avatar" style="background:${color}22;color:${color}">${daEscape(daInitialsOf(s.student.studentName))}</div>` +
                `<div><div class="da-result-name">${daEscape(s.student.studentName)}</div>` +
                `<div class="da-result-sub">${daEscape(s.student.fatherName)} &middot; ${daEscape(s.grade.gradeName)}-${daEscape(s.section.sectionName)}${sr}${school}</div></div>` +
                `</div>`;
        };
        const _sb2Fetch = (query, page, append) => {
            if (_sb2Loading) return;
            _sb2Loading = true;
            // Global endpoint — searches ALL active students regardless of school/year
            fetch(`${contextPath}searchStudentForSiblingPage/${encodeURIComponent(query)}?page=${page}`)
                .then(r => r.json()).then(data => {
                    _sb2Loading = false;
                    _sb2More = data.length === 10;
                    // Cache each result by academicStudent.id
                    data.forEach(s => { _sb2Cache[s.id] = s; });
                    if (!append) {
                        if (data.length === 0) {
                            $(".search-result1").html(`<div class="da-result-empty">No students found.</div>`).show();
                        } else {
                            let html = `<div id='sb2-list-group'>`;
                            data.forEach(s => { html += _sb2Row(s); });
                            $(".search-result1").html(html + `</div>`).show();
                        }
                    } else {
                        data.forEach(s => { $('#sb2-list-group').append(_sb2Row(s)); });
                    }
                }).catch(() => { _sb2Loading = false; });
        };
        const searchStuNameIndividual = () => {
            let query = $("#search-input1").val();
            if (query.trim().length > 2) {
                if (query !== _sb2Query) { _sb2Query = query; _sb2Page = 0; _sb2Fetch(query, 0, false); }
            } else { _sb2Query = ''; $(".search-result1").hide(); }
        };
        document.querySelector('.search-result1').addEventListener('scroll', function() {
            if (!_sb2More || _sb2Loading) return;
            if (this.scrollTop + this.clientHeight >= this.scrollHeight - 40) { _sb2Page++; _sb2Fetch(_sb2Query, _sb2Page, true); }
        });

        /* ── Shared: build a table row with remove button ── */
        const buildSiblingRow = (idx, value) => {
            return `<tr>
                <td>${idx}<input type="hidden" name="academicstudent" value="${value.id}" /></td>
                <td>${value.student.studentName}</td>
                <td>${value.student.fatherName}</td>
                <td>${value.student.motherName}</td>
                <td>${value.grade.gradeName} - ${value.section.sectionName}</td>
                <td>${value.school.schoolName}</td>
                <td><button type="button" class="config-icon-btn danger remove-sibling-row" title="Remove"><i class="bi bi-trash"></i></button></td>
            </tr>`;
        };

        /* ── Renumber all rows after a removal ── */
        const renumberSiblingRows = () => {
            $('#siblingTable tbody tr').each(function(index) {
                const td = $(this).find('td').first();
                const hidden = td.find('input[type=hidden]');
                td.text(index + 1);
                td.append(hidden);
            });
        };

        /* ── Remove row click handler (delegated) ── */
        $('#siblingTable').on('click', '.remove-sibling-row', function() {
            $(this).closest('tr').remove();
            renumberSiblingRows();
            if ($('#siblingTable tbody tr').length === 0) {
                $('.group-data').hide();
            }
        });

        const loadStudentData=(id)=>{
            $(".search-result").hide();
            $("#search-input").val('');
            $('.group-data').hide();
            if(id>0){
                let url = `${contextPath}getStudentDetailsForSibling/${id}`;
                fetch(url).then(response => {
                    return response.json();
                }).then((data) => {
                    if('noSibling' in data){
                        showMsg("warning",data.noSibling,"Message");
                    } else{
                        // FIX 2: clear table before loading new search result
                        $('#siblingTable > tbody').empty();
                        $('.group-data').show();
                        let siblings = data.siblingList;
                        for (let i = 0; i < siblings.length; i++) {
                            $('#siblingTable > tbody').append(buildSiblingRow(i + 1, siblings[i]));
                        }
                    }
                }).catch(error => {
                    console.error('Error:', error);
                    showMsg("error", error, "Error");
                });
            }
        }

        // Stores the full lean-map of the student selected in search box 2
        let _selectedSiblingStudent = null;

        const loadStudentData1=(acStuId)=>{
            $(".search-result1").hide();
            if(acStuId > 0){
                const cached = _sb2Cache[acStuId];
                if(cached){
                    _selectedSiblingStudent = cached;
                    $('#academic_student').val("" + cached.id);
                    $('#student_id_global').val("" + cached.student.id);
                    $("#search-input1").val(cached.student.studentName);
                } else{
                    // Fallback if not in cache (shouldn't happen in normal flow)
                    $('#academic_student').val("" + acStuId);
                    $("#search-input1").val('');
                }
            } else{
                _selectedSiblingStudent = null;
                $('.group-data').hide();
            }
        }

        const checkStudentData = () =>{
            let academic_student_id = $('#academic_student').val();
            let student_id = $('#student_id_global').val();
            if(!academic_student_id || academic_student_id <= 0){
                showMsg("warning","No student selected. Please search and select a student first.","Message");
                return;
            }
            // Layer 1: duplicate check — reject if academicStudent.id already in the table
            const alreadyAdded = $('#siblingTable tbody input[name="academicstudent"]')
                .toArray().some(el => el.value === String(academic_student_id));
            if(alreadyAdded){
                showMsg("warning","This student is already added to the group.","Duplicate");
                return;
            }
            // Layer 2: cross-school eligibility check — prevent duplicate sibling discount
            if(student_id && student_id > 0){
                fetch(`${contextPath}checkSiblingEligibility/${student_id}`)
                    .then(r => r.json())
                    .then(eligibility => {
                        if(eligibility.blocked){
                            showMsg("error",
                                `Cannot add: Student is already in sibling group "<b>${eligibility.groupName}</b>" at ${eligibility.schoolName}. Sibling discount is centralised — one group per family across all branches.`,
                                "Duplicate Discount Blocked");
                            return;
                        }
                        // Eligible — build row from cached data (no extra API call needed)
                        const value = _selectedSiblingStudent;
                        if(!value){
                            showMsg("warning","Student data not found. Please search and select again.","Error");
                            return;
                        }
                        const rowCount = $('#siblingTable tbody tr').length;
                        $('.group-data').show();
                        $('#siblingTable > tbody').append(buildSiblingRow(rowCount + 1, value));
                        $('#academic_student').val('');
                        $('#student_id_global').val('');
                        $("#search-input1").val('');
                        _selectedSiblingStudent = null;
                    }).catch(err => {
                        showMsg("error", "Eligibility check failed. Please try again.", "Error");
                        console.error(err);
                    });
            } else{
                // student_id not available — fallback to old API fetch
                let url = `${contextPath}searchStudentIndividualGlobal/${academic_student_id}`;
                fetch(url).then(r => r.json()).then(data => {
                    if('noAcademicStudent' in data){
                        showMsg("warning", data.noAcademicStudent, "Error");
                    } else{
                        const value = data.academicStudent;
                        const rowCount = $('#siblingTable tbody tr').length;
                        $('.group-data').show();
                        $('#siblingTable > tbody').append(buildSiblingRow(rowCount + 1, value));
                        $('#academic_student').val('');
                        $("#search-input1").val('');
                    }
                }).catch(err => { showMsg("error", err, "Error"); });
            }
        }

        const checkData = ()=>{
            const grpName = $('#groupname').val();
            if(grpName.trim()===''){
                showMsg("error","Please enter a group name.","Message");
                return;
            }
            const rowCount = $('#siblingTable tbody tr').length;
            // FIX 3: explicit 0-row check before the min-3 check
            if(rowCount === 0){
                showMsg("warning","No students added to the group yet.","Message");
                return;
            }
            if(rowCount < 3){
                showMsg("info","At least 3 siblings are required to avail this discount.","Info");
                return;
            }
            document.forms.siblinggroup.submit();
        }

    </script>
  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
</body>
</html>
