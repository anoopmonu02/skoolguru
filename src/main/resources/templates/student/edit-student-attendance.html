<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Edit Student Attendance</title>
</head>
<body>
<section>

  <style>
    /* Search box + result rows — same da-search-wrap/da-result-row pattern
       used on add-siblinggroup.html / fees/feesubmitform-neo.html. */
    .da-search-wrap { position: relative; }
    .da-search-wrap input { padding-left: 38px; }
    .da-search-wrap .bi-search { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .da-search-results { position: absolute; z-index: 20; width: 100%; max-height: 320px; overflow-y: auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md); box-shadow: var(--shadow-xs); margin-top: 4px; display: none; }
    .da-result-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
    .da-result-row:last-child { border-bottom: none; }
    .da-result-row:hover { background: var(--accent-light); }
    .da-result-name { font-weight: 600; color: var(--text-primary); font-size: .86rem; }
    .da-result-sub { font-size: .72rem; color: var(--text-muted); }
    .da-result-empty { padding: 14px; color: var(--text-muted); font-size: .85rem; text-align: center; }

    /* Student-info card — name/avatar + meta lines on the left, photo on
       the right — same fc-combocard layout/typography as fees/feecancel.html
       (icon-labelled contact row, bold values, pipe separators). */
    .esa-combocard{ display:flex; gap:16px; align-items:flex-start; width:100%; padding:2px 2px 0; }
    .esa-combo-left{ flex:1; min-width:0; }
    .esa-combo-namerow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .esa-combo-namerow .stu-avatar{ width:36px; height:36px; font-size:.78rem; background:var(--accent-light); color:var(--accent); }
    .esa-name{ font-size:1rem; font-family:"Outfit", sans-serif; font-weight:600; color:var(--text-primary); }
    .esa-combo-metaline{ font-size:.8rem; color:var(--text-muted); margin-bottom:10px; }
    .esa-combo-metaline b{ color:var(--text-primary); font-weight:600; }
    .esa-msep{ color:var(--border-color); margin:0 8px; }
    .esa-combo-contact{ font-size:.84rem; color:var(--text-muted); display:flex; align-items:center; gap:7px; margin-bottom:0; }
    .esa-combo-contact i{ color:var(--accent); }
    .esa-combo-contact b{ color:var(--text-primary); font-weight:600; }
    .esa-combo-photocol{ flex:none; display:flex; align-items:flex-start; }
    .esa-combo-photo-img, .esa-combo-photo-fallback{ width:84px; height:96px; border-radius:10px; border:1px solid var(--border-color); }
    .esa-combo-photo-img{ object-fit:cover; }
    .esa-combo-photo-fallback{ background:var(--body-bg); color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:1.9rem; }

    /* Month-attendance summary card — bigger ring + icon-labelled stat
       chips (same visual family as student/attendance.html's .sa-stat
       row) instead of plain inline "Present: X / Working Days: Y" text. */
    .esa-summarycard{ display:flex; align-items:center; gap:16px; width:100%; padding:2px 2px 0; }
    .esa-summary-ring {
      width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 700; color: #059669;
      background: conic-gradient(#10b981 calc(var(--pct) * 1%), var(--body-bg) 0);
    }
    .esa-summary-ring-inner {
      width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg);
      display: flex; align-items: center; justify-content: center;
    }
    .esa-summary-title{ font-size:.95rem; font-family:"Outfit", sans-serif; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
    .esa-summary-stats{ display:flex; gap:10px; flex-wrap:wrap; }
    .esa-sstat{ display:flex; align-items:center; gap:8px; background:var(--body-bg); border-radius:var(--radius-md); padding:6px 12px; }
    .esa-sstat-icon{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.78rem; flex:none; }
    .esa-sstat-present .esa-sstat-icon{ background:#dcfce7; color:#16a34a; }
    .esa-sstat-absent .esa-sstat-icon{ background:#fee2e2; color:#dc2626; }
    .esa-sstat-days .esa-sstat-icon{ background:var(--accent-light); color:var(--accent); }
    .esa-sstat-value{ font-weight:700; font-size:.86rem; color:var(--text-primary); line-height:1.2; }
    .esa-sstat-label{ font-size:.66rem; color:var(--text-muted); }

    /* Ledger table — same Neo table-card look (sticky header, clean rows)
       as student/show-attendance.html's .sh-table-card. */
    .esa-table-card{ background:var(--card-bg); border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); overflow:hidden; }
    .esa-table-card .table-responsive{ margin:0; max-height:520px; overflow:auto; }
    .esa-table-card table{ width:100%; margin:0; font-size:.84rem; }
    .esa-table-card thead th{ position:sticky; top:0; background:var(--card-bg); color:var(--text-muted); font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:10px; border:none; border-bottom:1px solid var(--border-color); white-space:nowrap; z-index:1; }
    .esa-table-card td{ padding:9px 10px; border-top:1px solid var(--border-color); vertical-align:middle; }
    .esa-table-card tbody tr:hover{ background:var(--body-bg); }

    .status-badge { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 20px; }
    .toggle-present.active { background:#10b981; color:#fff; border-color:#10b981; }
    .toggle-absent.active { background:#ef4444; color:#fff; border-color:#ef4444; }
  </style>

  <div class="container-fluid px-3">
    <div class="row mt-2">
      <div class="col-md-12">
        <div th:replace="~{components/ui :: page-header('Edit Student Attendance')}"></div>


        <!-- Month + Student search -->
        <div class="row">
          <div class="col-md-3">
            <label for="month" class="form-label">Month</label>
            <select id="month" class="form-select">
              <option value="">Select Month</option>
              <option th:each="m : ${months}" th:value="${m.id}" th:text="${m.monthName}">Month</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="search-input" class="form-label">Search Student</label>
            <div class="da-search-wrap">
              <i class="bi bi-search"></i>
              <input oninput="searchStuName()" type="text" class="form-control" id="search-input" placeholder="Type student name (min 3 characters)" autocomplete="off">
              <div class="da-search-results search-result"></div>
            </div>
          </div>
        </div>
        <hr/>

        <!-- Student + month summary cards -->
        <div class="row g-3 mb-3" id="studentCardsRow" style="display:none;">
          <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body esa-combocard">
                <div class="esa-combo-left">
                  <div class="esa-combo-namerow">
                    <span class="stu-avatar" id="cardStuInitials">--</span>
                    <span class="esa-name" id="cardStuName">-</span>
                  </div>
                  <div class="esa-combo-metaline">
                    <span>SR: <b id="cardStuSr">-</b></span><span class="esa-msep">|</span><span>PSRN: <b id="cardStuPsrn">-</b></span><span class="esa-msep">|</span><span>Class: <b id="cardStuGradeSection">-</b></span>
                  </div>
                  <div class="esa-combo-metaline">
                    <span>Father: <b id="cardStuFather">-</b></span><span class="esa-msep">|</span><span>Mother: <b id="cardStuMother">-</b></span>
                  </div>
                  <div class="esa-combo-contact">
                    <i class="bi bi-telephone-fill"></i><span>Contact:</span> <b id="cardStuContact">-</b>
                  </div>
                </div>
                <div class="esa-combo-photocol">
                  <img id="cardStuPhoto" class="esa-combo-photo-img" style="display:none;" alt="Student photo">
                  <div id="cardStuPhotoFallback" class="esa-combo-photo-fallback"><i class="bi bi-person"></i></div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-body esa-summarycard">
                <div class="esa-summary-ring" id="cardSummaryRing" style="--pct:0;">
                  <div class="esa-summary-ring-inner"><span id="cardSummaryPercent">0%</span></div>
                </div>
                <div class="flex-grow-1">
                  <div class="esa-summary-title" id="cardSummaryMonth">Month Attendance</div>
                  <div class="esa-summary-stats">
                    <div class="esa-sstat esa-sstat-present"><span class="esa-sstat-icon"><i class="bi bi-check-lg"></i></span><div><div class="esa-sstat-value" id="cardSummaryPresent">0</div><div class="esa-sstat-label">Present</div></div></div>
                    <div class="esa-sstat esa-sstat-absent"><span class="esa-sstat-icon"><i class="bi bi-x-lg"></i></span><div><div class="esa-sstat-value" id="cardSummaryAbsent">0</div><div class="esa-sstat-label">Absent</div></div></div>
                    <div class="esa-sstat esa-sstat-days"><span class="esa-sstat-icon"><i class="bi bi-calendar-week"></i></span><div><div class="esa-sstat-value" id="cardSummaryWorkingDays">0</div><div class="esa-sstat-label">Working Days</div></div></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Ledger -->
        <div id="ledger-wrapper" style="display:none;">
          <div class="esa-table-card">
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0" id="ledger-table">
                <thead>
                  <tr>
                    <th style="width:80px;">Date</th>
                    <th style="width:80px;">Day</th>
                    <th>Status</th>
                    <th>Remark</th>
                    <th style="width:70px;">Action</th>
                  </tr>
                </thead>
                <tbody id="ledger-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="empty-hint" class="text-muted text-center py-5">
          <i class="bi bi-search fs-1 d-block mb-2 opacity-50"></i>
          Select a month and search for a student to view and edit their attendance.
        </div>

      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="modal fade" id="editAttendanceModal" tabindex="-1" aria-labelledby="editAttendanceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editAttendanceModalLabel"><i class="bi bi-pencil-square me-2"></i>Edit Attendance</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">Date: <strong id="modalDateLabel">-</strong></p>
          <div class="btn-group w-100 mb-3" role="group">
            <button type="button" class="btn btn-outline-success toggle-present" id="btnMarkPresent"><i class="bi bi-check-circle-fill"></i> Present</button>
            <button type="button" class="btn btn-outline-danger toggle-absent" id="btnMarkAbsent"><i class="bi bi-x-circle-fill"></i> Absent</button>
          </div>
          <label for="modalRemark" class="form-label">Remark <span class="text-danger">*</span></label>
          <textarea id="modalRemark" class="form-control" rows="3" maxlength="500" placeholder="Reason for this correction (required)"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i> Cancel</button>
          <button type="button" class="btn btn-primary" id="saveEditBtn"><i class="bi bi-save-fill"></i> Save</button>
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript" th:inline="javascript">
    const contextPath = /*[[@{/}]]*/ '/';

    // Shared escape/avatar helpers — same technique used across the app's
    // other search-result dropdowns and masked cells (e.g.
    // student/add-siblinggroup.html, employee/employee.html). esaEscape
    // covers & < > " ' so it is safe both inside a text node and inside a
    // double-quoted HTML attribute.
    const esaEscape = (value) => String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    const esaAvatarColors = ['#0ea5e9', '#7c3aed', '#d97706', '#16a34a', '#dc2626', '#0891b2'];
    const esaInitialsOf = (name) => (name || '').trim().split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const esaAvatarColorFor = (id) => esaAvatarColors[Math.abs(id || 0) % esaAvatarColors.length];

    /* ── Student search with infinite scroll (same pattern as Fee Submission) ── */
    let _searchQuery = '';
    let _searchPage  = 0;
    let _searchMore  = false;
    let _searchLoading = false;
    let _searchDebounceTimer = null;
    let _lastSearchResults = {}; // id -> full lean academic-student object, so selecting a
                                  // row doesn't need a second round-trip to the server

    // Result rows are built from student/father names and grade/section
    // labels that a user can freely type in elsewhere in the app (no
    // character-restriction validation on studentName/fatherName), so
    // every value is run through esaEscape() before it goes into this
    // .html()-inserted string — this page previously interpolated them
    // unescaped, which was a stored-XSS gap.
    const renderStudentRow = (student) => {
      _lastSearchResults[student.id] = student;
      let sr = student.classSrNo != null && student.classSrNo !== '' ? ' / SR ' + esaEscape(student.classSrNo) : '';
      let color = esaAvatarColorFor(student.id);
      return `<div class="da-result-row" onclick="loadStudentData(${student.id})">` +
        `<span class="stu-avatar" style="background:${color}22;color:${color}">${esaEscape(esaInitialsOf(student.student.studentName))}</span>` +
        `<div><div class="da-result-name">${esaEscape(student.student.studentName)}</div>` +
        `<div class="da-result-sub">${esaEscape(student.student.fatherName)} &middot; ${esaEscape(student.grade.gradeName)}-${esaEscape(student.section.sectionName)}${sr}</div></div>` +
        `</div>`;
    };

    const fetchStudents = (query, page, append) => {
      if (_searchLoading) return;
      _searchLoading = true;
      let url = `${contextPath}searchStudentForOtherPage/${encodeURIComponent(query)}?page=${page}`;
      fetch(url).then(r => r.json()).then(students => {
        _searchLoading = false;
        _searchMore = students.length === 10;
        if (!append) {
          if (students.length === 0) {
            $(".search-result").html(`<div class="da-result-empty">No students found.</div>`).show();
          } else {
            let html = `<div id='esa-list-group'>`;
            students.forEach(s => { html += renderStudentRow(s); });
            html += `</div>`;
            $(".search-result").html(html).show();
          }
        } else {
          students.forEach(s => {
            $('#esa-list-group').append(renderStudentRow(s));
          });
        }
      }).catch(() => { _searchLoading = false; });
    };

    const searchStuName = () => {
      clearTimeout(_searchDebounceTimer);
      let query = $("#search-input").val();
      if (query.trim().length > 2) {
        _searchDebounceTimer = setTimeout(() => {
          _searchQuery = query;
          _searchPage  = 0;
          fetchStudents(query, 0, false);
        }, 300);
      } else {
        _searchQuery = '';
        $(".search-result").hide();
      }
    };

    document.querySelector('.search-result').addEventListener('scroll', function() {
      if (!_searchMore || _searchLoading) return;
      if (this.scrollTop + this.clientHeight >= this.scrollHeight - 40) {
        _searchPage++;
        fetchStudents(_searchQuery, _searchPage, true);
      }
    });

    /* ── Selection + month detail ─────────────────────────────────────────── */
    let selectedStudent = null;

    const loadStudentData = (id) => {
      $(".search-result").hide();
      $("#search-input").val('');
      selectedStudent = _lastSearchResults[id];
      if (!selectedStudent) return;
      renderStudentCard(selectedStudent);
      $('#studentCardsRow').show();
      loadMonthDetail();
    };

    $('#month').on('change', function(){
      if (selectedStudent) loadMonthDetail();
    });

    // Student photo — same lookup as fees/feecancel.html's combocard: pic
    // is just a filename, served via GET /student/images/{filename}. Falls
    // back to the person icon if there's no pic or the file fails to load.
    const esaShowStudentPhoto = (pic) => {
      const img = document.getElementById('cardStuPhoto');
      const fallback = document.getElementById('cardStuPhotoFallback');
      if (pic) {
        img.onerror = () => { img.style.display = 'none'; fallback.style.display = 'flex'; };
        img.src = `${contextPath}student/images/${encodeURIComponent(pic)}`;
        img.style.display = '';
        fallback.style.display = 'none';
      } else {
        img.onerror = null;
        img.removeAttribute('src');
        img.style.display = 'none';
        fallback.style.display = 'flex';
      }
    };

    const renderStudentCard = (s) => {
      let name = s.student.studentName || '-';
      let initials = esaInitialsOf(name);
      let color = esaAvatarColorFor(s.id);
      $('#cardStuInitials').text(initials || '--').css({ background: color + '22', color: color });
      $('#cardStuName').text(name);
      $('#cardStuSr').text(s.classSrNo || '-');
      $('#cardStuPsrn').text(s.student.psrn || '-');
      $('#cardStuGradeSection').text((s.grade ? s.grade.gradeName : '') + '-' + (s.section ? s.section.sectionName : ''));
      $('#cardStuFather').text(s.student.fatherName || '-');
      $('#cardStuMother').text(s.student.motherName || '-');
      $('#cardStuContact').text(s.student.mobile1 || s.student.mobile2 || '-');
      esaShowStudentPhoto(s.student.pic);
    };

    const loadMonthDetail = () => {
      let month = $('#month').val();
      if (!month) {
        showMsg('warning', 'Please select a month', 'Warning');
        return;
      }
      fetch(`${contextPath}getStudentAttendanceMonthDetail`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ academicStudentId: selectedStudent.id, month: month })
      })
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          showMsg('error', data.error, 'Error');
          return;
        }
        renderSummary(data.summary || {});
        renderLedger(data.days || []);
        $('#ledger-wrapper').show();
        $('#empty-hint').hide();
      })
      .catch(() => showMsg('error', 'Unable to load attendance for this student.', 'Error'));
    };

    const renderSummary = (summary) => {
      let pct = summary.percent || 0;
      let present = summary.present || 0;
      let workingDays = summary.workingDays || 0;
      // Purely a display derivation (workingDays - present) for the new
      // Absent stat chip - no extra server round-trip, nothing persisted.
      let absent = Math.max(workingDays - present, 0);
      $('#cardSummaryRing').css('--pct', pct);
      $('#cardSummaryPercent').text(pct + '%');
      $('#cardSummaryPresent').text(present);
      $('#cardSummaryAbsent').text(absent);
      $('#cardSummaryWorkingDays').text(workingDays);
      $('#cardSummaryMonth').text('Month Attendance');
    };

    const statusBadge = (status) => {
      switch(status){
        case 'Present': return '<span class="status-badge text-bg-success text-white">Present</span>';
        case 'Absent': return '<span class="status-badge text-bg-danger text-white">Absent</span>';
        case 'Holiday': return '<span class="status-badge text-bg-secondary text-white">Holiday</span>';
        case 'Future': return '<span class="status-badge text-bg-light text-muted">-</span>';
        case 'NotMarked': return '<span class="status-badge text-bg-warning">Not Marked</span>';
        default: return status;
      }
    };

    let _currentDays = [];

    const renderLedger = (days) => {
      _currentDays = days;
      let rows = '';
      days.forEach((d, idx) => {
        let actionCell = '-';
        if (d.editable) {
          actionCell = `<button type="button" class="config-icon-btn" title="Edit" onclick="openEditModal(${idx})"><i class="bi bi-pencil-square"></i></button>`;
        }
        // Remark is free-text a staff member enters in the Edit modal below
        // (no character restriction), so it is escaped before going into
        // this .html()-inserted row — this page previously interpolated it
        // unescaped, which was a stored-XSS gap (every viewer of this
        // ledger would re-execute whatever was saved in a remark).
        rows += `<tr>
          <td>${d.dayOfMonth}</td>
          <td>${d.dayName}</td>
          <td>${statusBadge(d.status)}</td>
          <td class="text-muted small">${d.remark ? esaEscape(d.remark) : '-'}</td>
          <td class="text-center">${actionCell}</td>
        </tr>`;
      });
      $('#ledger-body').html(rows);
    };

    /* ── Edit modal ────────────────────────────────────────────────────────── */
    // bootstrap.Modal is instantiated lazily inside these functions (not at
    // top-level script scope) because base.html loads bootstrap.bundle.min.js
    // in its own SCRIPTS block, which renders AFTER this page's content in the
    // DOM — same pattern used by stu_exam.html / update-aadhar.html elsewhere
    // in this app. Referencing `bootstrap` at top-level parse time here would
    // throw "bootstrap is not defined".
    let _editingDay = null;
    let _editingPresent = null;

    // ISO "2026-08-03" -> "03/Aug/2026", matching the dd/MMM/yyyy format used
    // elsewhere in the app (e.g. fee dates, exam result dates).
    const formatDdMmmYyyy = (isoDate) => {
      let parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      let monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      let mon = monthNames[parseInt(parts[1], 10) - 1] || parts[1];
      return `${parts[2]}/${mon}/${parts[0]}`;
    };

    const openEditModal = (idx) => {
      let d = _currentDays[idx];
      if (!d || !d.editable) return;
      _editingDay = d;
      _editingPresent = d.status === 'Present' ? true : (d.status === 'Absent' ? false : null);
      $('#modalDateLabel').text(formatDdMmmYyyy(d.date) + ' (' + d.dayName + ')');
      $('#modalRemark').val(d.remark || '');
      updateToggleButtons();
      new bootstrap.Modal(document.getElementById('editAttendanceModal')).show();
    };

    const updateToggleButtons = () => {
      $('#btnMarkPresent').toggleClass('active', _editingPresent === true);
      $('#btnMarkAbsent').toggleClass('active', _editingPresent === false);
    };

    $('#btnMarkPresent').on('click', function(){ _editingPresent = true; updateToggleButtons(); });
    $('#btnMarkAbsent').on('click', function(){ _editingPresent = false; updateToggleButtons(); });

    $('#saveEditBtn').on('click', function(){
      if (!_editingDay) return;
      if (_editingPresent === null) {
        showMsg('warning', 'Please choose Present or Absent', 'Warning');
        return;
      }
      let remark = $('#modalRemark').val().trim();
      if (!remark) {
        showMsg('warning', 'A remark is required for this correction', 'Warning');
        return;
      }
      fetch(`${contextPath}editStudentAttendanceDay`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          academicStudentId: selectedStudent.id,
          date: _editingDay.date,
          present: _editingPresent,
          remark: remark
        })
      })
      .then(r => r.json())
      .then(data => {
        if (data.error) {
          showMsg('error', data.error, 'Error');
          return;
        }
        showMsg('success', 'Attendance updated successfully', 'Success');
        bootstrap.Modal.getInstance(document.getElementById('editAttendanceModal'))?.hide();
        loadMonthDetail();
      })
      .catch(() => showMsg('error', 'Update failed. Please try again.', 'Error'));
    });
  </script>

  <!-- jQuery / Bootstrap / toastr / select2 / jQuery-UI tags removed: base.html
       now loads them in <head>, so they are available before this page's
       inline scripts run. They used to be duplicated on every page. -->
</section>
</body>
