<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Bank</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-6  offset-md-1 ">
        <!-- Page header. Title + actions on one row, using the shared classes from
             components.css. The "Add Bank" button moved up here from the bottom of
             the page - it is the primary action, so it belongs next to the title
             rather than below the table where it was easy to miss. -->
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Bank List</h1>
          <div class="page-header-actions">
            <a sms:access="GLOBAL_BANK:CREATE" class="btn btn-success btn-sm"
               th:href="@{/universal/bank/add}">
              <i class="bi bi-plus-lg"></i> Add Bank
            </a>
          </div>
        </div>
        <table class="table table-bordered table-striped table-hover table-sm" th:if="${hasBanks}">
          <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>

          <tr th:each="bank, iter : ${banks}">
            <td th:text="${iter.index+1}"></td>
            <td th:text="${bank.bankName}"></td>
            <td>
              <a sms:access="GLOBAL_BANK:EDIT" class="btn btn-primary" th:href="@{/universal/bank/edit/{id}(id=${bank.id})}">
                <i class="bi bi-pencil-square"></i> </a>
              <!--<a class="btn btn-danger" th:href="@{/universal/bank/delete/{id}(id=${bank.id})}" onclick="return confirm('Are you sure? its not recoverable.')">
                <i class="bi bi-trash3-fill"></i> </a>-->
              <form sms:access="GLOBAL_BANK:DELETE" th:action="@{/universal/bank/delete/{id}(id=${bank.id})}" method="post" style="display:inline;">
                <!--<input type="hidden" name="_method" value="DELETE"> -->
                <input type="hidden" name="id" th:value="${bank.id}">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure? its not recoverable.')"> <i class="bi bi-trash3-fill"></i> </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
        <!-- NOTE: th:if and th:replace must NOT sit on the same element. Thymeleaf
             gives th:replace higher precedence (100) than th:if (300), so the
             fragment replaces the element BEFORE the condition is evaluated - and
             the empty state renders even when rows exist. The condition has to go
             on an enclosing th:block. -->
        <th:block th:if="${!hasBanks}">
          <div th:replace="~{components/ui :: empty-state('No banks have been added yet.', 'bi-bank')}"></div>
        </th:block>
      </div>
    </div>
  </div>
  <!-- Removed: page-local jQuery + CDN jQuery + toastr script tags, a duplicate
       copy of showMsg(), and the three flash-message checks. All of that is now
       handled once in base.html (which renders it after script.js has loaded).
       This page has no other JavaScript. -->
</section>
</body>
</html>
