<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf"
      th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>UAIC - Cast</title>
</head>
<body>
<section>

    <div class="container-fluid px-3">
        <div class="row mt-2 ">
            <div class="col-md-6  offset-md-1 ">
                <div class="page-header page-header-row">
                  <h1 class="page-header-title">Cast List</h1>
                  <div class="page-header-actions">
                    <a sms:access="GLOBAL_CAST:CREATE" class="btn btn-success btn-sm" th:href="@{/universal/cast/add}"><i class="bi bi-plus-lg"></i> Add Cast</a>
                  </div>
                </div>

                <table id="castTable" class="table table-bordered table-striped table-hover table-sm" th:if="${hasCasts}">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cast, iter : ${casts}">
                        <td th:text="${iter.index+1}"></td>
                        <td th:text="${cast.castName}"></td>
                        <td>
                            <a sms:access="GLOBAL_CAST:EDIT" class="btn btn-primary btn-sm" th:href="@{/universal/cast/edit/{id}(id=${cast.id})}">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <form sms:access="GLOBAL_CAST:DELETE" th:action="@{/universal/cast/delete/{id}(id=${cast.id})}" method="post" style="display:inline;">
                                <input type="hidden" name="id" th:value="${cast.id}">
                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure? its not recoverable.')">
                                    <i class="bi bi-trash3-fill"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div th:if="${!hasCasts}">
                    <div th:replace="~{components/ui :: empty-state('No Cast found.', 'bi-inbox')}"></div>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/jquery-3.7.1.js}"></script>
    <script th:src="@{/js/toastr.min.js}"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            var sortOrder = [1, 'asc'];
            $('#castTable').DataTable({
                pageLength: 25,
                order: [sortOrder],
                columnDefs: [
                    { orderable: false, targets: [2] }
                ],
                language: {
                    search: "Search cast:",
                    emptyTable: "No cast records found."
                }
            });
        });
    </script>
</section>
</body>
</html>
