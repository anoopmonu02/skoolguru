<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Finehead</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-8 offset-md-2">
        <!-- Same inline add/edit/search pattern as universal/bank.html - see
             that file for the fuller explanatory comments. Name + Description
             pair, same as universal/feehead.html. -->
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Finehead List
            <span class="header-count-badge" th:text="${#lists.size(fineheads)}">0</span>
          </h1>
          <div class="page-header-actions">
            <button sms:access="GLOBAL_FINEHEAD:CREATE" type="button" class="btn-cta"
                    onclick="toggleAddPanel()">
              <i class="bi bi-plus-lg"></i> Add Finehead
            </button>
          </div>
        </div>

        <div class="inline-panel" id="addPanel" sms:access="GLOBAL_FINEHEAD:CREATE">
          <div class="inline-panel-body">
            <div class="inline-panel-icon"><i class="bi bi-exclamation-triangle"></i></div>
            <form th:action="@{/universal/finehead}" th:object="${finehead}" method="post" class="inline-panel-form two-field">
              <input type="text" class="form-control form-control-sm" id="feehead_name" placeholder="Fine head name, e.g. Late Fee"
                     autocomplete="off" th:field="*{fineHeadName}" />
              <input type="text" class="form-control form-control-sm" id="feehead_des" placeholder="Description (optional)"
                     autocomplete="off" th:field="*{description}" />
              <button type="submit" class="btn-accent-solid"><i class="bi bi-check2"></i> Save</button>
              <button type="button" class="btn-accent-ghost" onclick="toggleAddPanel()">Cancel</button>
            </form>
          </div>
        </div>

        <div class="config-list-card" th:if="${hasFineheads}">
          <div class="config-list-toolbar">
            <div class="config-search-wrap">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control form-control-sm" id="fineheadSearch"
                     placeholder="Search fine heads..." oninput="filterList(this.value, 'fineheadListBody')">
            </div>
            <button type="button" class="config-sort-btn" title="Sort A-Z / Z-A"
                    onclick="toggleSort('fineheadListBody', this)">
              <i class="bi bi-sort-alpha-down"></i>
            </button>
          </div>

          <div id="fineheadListBody">
          <th:block th:each="finehead, iter : ${fineheads}">
            <div class="config-row row-view"
                 th:attr="data-name=${#strings.toLowerCase(finehead.fineHeadName + ' ' + #strings.defaultString(finehead.description, ''))}">
              <div class="config-row-icon"><i class="bi bi-exclamation-triangle"></i></div>
              <div class="config-row-text">
                <div class="config-row-name" th:text="${finehead.fineHeadName}"></div>
                <div class="config-row-meta" th:if="${!#strings.isEmpty(finehead.description)}" th:text="${finehead.description}"></div>
              </div>
              <div class="config-row-actions">
                <button sms:access="GLOBAL_FINEHEAD:EDIT" type="button" class="config-icon-btn" title="Edit"
                        th:attr="onclick=|toggleEditRow(${finehead.id})|">
                  <i class="bi bi-pencil"></i>
                </button>
                <form sms:access="GLOBAL_FINEHEAD:DELETE" th:action="@{/universal/finehead/delete/{id}(id=${finehead.id})}" method="post" style="display:contents;">
                  <input type="hidden" name="id" th:value="${finehead.id}">
                  <button type="submit" class="config-icon-btn danger" title="Delete"
                          onclick="return confirm('Are you sure? its not recoverable.')">
                    <i class="bi bi-trash3"></i>
                  </button>
                </form>
              </div>
            </div>
            <div sms:access="GLOBAL_FINEHEAD:EDIT" th:id="'edit-row-' + ${finehead.id}" class="config-row row-edit d-none">
              <div class="config-row-icon"><i class="bi bi-pencil"></i></div>
              <form th:action="@{/universal/finehead/{id}(id=${finehead.id})}" method="post" class="inline-panel-form two-field">
                <input type="text" class="form-control form-control-sm" name="fineHeadName" th:value="${finehead.fineHeadName}"
                       placeholder="Fine head name" autocomplete="off" required />
                <input type="text" class="form-control form-control-sm" name="description" th:value="${finehead.description}"
                       placeholder="Description (optional)" autocomplete="off" />
                <button type="submit" class="btn-accent-solid"><i class="bi bi-check2"></i> Save</button>
                <button type="button" class="btn-accent-ghost" th:attr="onclick=|toggleEditRow(${finehead.id})|">Cancel</button>
              </form>
            </div>
          </th:block>
          </div>

          <div class="config-list-footer"
               th:text="|${#lists.size(fineheads)} fine head${#lists.size(fineheads) != 1 ? 's' : ''} configured|">N fine heads configured</div>
        </div>
        <th:block th:if="${!hasFineheads}">
          <div th:replace="~{components/ui :: empty-state('No Finehead found.', 'bi-exclamation-triangle')}"></div>
        </th:block>
      </div>
    </div>
  </div>

  <script th:inline="none">
    function toggleAddPanel() {
      document.getElementById('addPanel').classList.toggle('open');
    }
    function toggleEditRow(id) {
      var editRow = document.getElementById('edit-row-' + id);
      var viewRow = editRow.previousElementSibling;
      var opening = editRow.classList.contains('d-none');
      editRow.classList.toggle('d-none');
      viewRow.classList.toggle('d-none');
      if (opening) {
        var input = editRow.querySelector('input[type="text"]');
        if (input) { input.focus(); }
      }
    }
    function filterList(query, listId) {
      query = query.trim().toLowerCase();
      document.querySelectorAll('#' + listId + ' > div.row-view').forEach(function (row) {
        var match = row.getAttribute('data-name').indexOf(query) !== -1;
        row.style.display = match ? '' : 'none';
        var editRow = row.nextElementSibling;
        if (!match && editRow && editRow.classList.contains('row-edit')) {
          editRow.classList.add('d-none');
          row.classList.remove('d-none');
        }
      });
    }
    function toggleSort(listId, btn) {
      var container = document.getElementById(listId);
      var pairs = [];
      Array.from(container.children).forEach(function (el) {
        if (!el.classList.contains('row-view')) { return; }
        var editRow = el.nextElementSibling && el.nextElementSibling.classList.contains('row-edit')
          ? el.nextElementSibling : null;
        pairs.push({ view: el, edit: editRow, key: el.getAttribute('data-name') || '' });
      });
      var desc = btn.getAttribute('data-dir') === 'asc';
      pairs.sort(function (a, b) {
        if (a.key < b.key) { return desc ? 1 : -1; }
        if (a.key > b.key) { return desc ? -1 : 1; }
        return 0;
      });
      pairs.forEach(function (p) {
        container.appendChild(p.view);
        if (p.edit) { container.appendChild(p.edit); }
      });
      btn.setAttribute('data-dir', desc ? 'desc' : 'asc');
      btn.classList.add('active');
      btn.querySelector('i').className = desc ? 'bi bi-sort-alpha-down' : 'bi bi-sort-alpha-up';
    }
  </script>

  <script type="text/javascript" th:inline="javascript">
    const fineheadSuccessMessage = [[${success}]];
    const fineheadErrorMessage   = [[${error}]];
    $(document).ready(function () {
      if (fineheadSuccessMessage) showMsg("success", fineheadSuccessMessage, "Success");
      if (fineheadErrorMessage)   showMsg("error",   fineheadErrorMessage,   "Error");
    });
  </script>
</section>
</body>
</html>
