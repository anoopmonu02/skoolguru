<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sms="http://www.smsweb.com/thymeleaf"
      th:replace="~{base::Layout(~{::section})}">
<head>
  <meta charset="UTF-8">
  <title>UAIC - Feehead</title>
</head>
<body>
<section>

  <div class="container-fluid px-3">
    <div class="row mt-2 ">
      <div class="col-md-10  offset-md-1 ">
        <div class="page-header page-header-row">
          <h1 class="page-header-title">Feehead List</h1>
          <div class="page-header-actions">
            <a sms:access="GLOBAL_FEEHEAD:CREATE" class="btn btn-success btn-sm" th:href="@{/universal/feehead/add}"><i class="bi bi-plus-lg"></i> Add Feehead</a>
          </div>
        </div>

        <table class="table table-bordered table-striped table-hover table-sm" th:if="${hasFeeheads}">
          <thead>
          <tr>
            <th>#</th>
            <th>Fee Name</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody>

          <tr th:each="feehead, iter : ${feeheads}">
            <td th:text="${iter.index+1}"></td>
            <td th:text="${feehead.feeHeadName}"></td>
            <td th:text="${feehead.description}"></td>
            <td>
              <a sms:access="GLOBAL_FEEHEAD:EDIT" class="btn btn-primary" th:href="@{/universal/feehead/edit/{id}(id=${feehead.id})}">
                <i class="bi bi-pencil-square"></i> </a>
              <!--<a class="btn btn-danger" th:href="@{/universal/feehead/delete/{id}(id=${feehead.id})}" onclick="return confirm('Are you sure? its not recoverable.')">
                <i class="bi bi-trash3-fill"></i> </a>-->
              <form sms:access="GLOBAL_FEEHEAD:DELETE" th:action="@{/universal/feehead/delete/{id}(id=${feehead.id})}" method="post" style="display:inline;">
                <!--<input type="hidden" name="_method" value="DELETE"> -->
                <input type="hidden" name="id" th:value="${feehead.id}">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure? its not recoverable.')"> <i class="bi bi-trash3-fill"></i> </button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
        <div th:if="${!hasFeeheads}">
          <p class="text-center">No Feehead found.</p>
        </div>
      </div>
    </div>
  </div>
  <!-- Library <script> tags removed: this page has no JavaScript of its own,
       and base.html already loads jQuery, Bootstrap, toastr and select2. -->
</section>
</body>
</html>
