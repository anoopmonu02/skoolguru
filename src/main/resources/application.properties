app.jwt.secret=${JWT_SECRET}
# Access token TTL — shortened from 24h now that refresh tokens (feature #10)
# exist to silently renew it. 2h = 7200000 ms. Override via env if needed.
app.jwt.expiration=${JWT_ACCESS_EXPIRATION:7200000}
# Refresh token TTL — 30 days = 2592000000 ms. Long-lived, single-use, rotated
# on every POST /api/v1/auth/refresh call (see MobileRefreshTokenService).
app.jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:2592000000}
# How many days a revoked/expired refresh-token row is kept before the cleanup
# job purges it — gives a window to investigate before the data is gone.
app.mobile.refreshToken.cleanupGraceDays=${MOBILE_REFRESH_CLEANUP_GRACE_DAYS:7}
# Cron for the automatic daily cleanup job (default 2:15 AM server time).
app.mobile.refreshToken.cleanupCron=${MOBILE_REFRESH_CLEANUP_CRON:0 15 2 * * *}

# Hashids salt for obfuscating fee-receipt ids in URLs (ReceiptIdCodec). This
# is NOT the access-control boundary (that's the school-ownership check in
# FeeSubmissionService#getFeeReceiptData) - it only stops casual guessing/
# incrementing of the id in the address bar. Override via HASHIDS_SALT in
# production. If the salt ever changes, previously-shared receipt links stop
# decoding - they'll show the normal "not found" state, same as an invalid id.
app.hashids.salt=${HASHIDS_SALT:sms-receipt-id-salt-change-me-in-prod}

# SERVER
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/sms}
server.servlet.session.timeout=${SERVER_SESSION_TIMEOUT:60m}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.include-message=always
server.error.include-binding-errors=always
# NO LONGER EFFECTIVE in Spring Boot 4 - replaced by the ForwardedHeaderFilter
# bean in MvcConfig. Left here commented so the change is discoverable.
# server.forward-headers-strategy=native

# APP
spring.application.name=sms
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# DATABASE (env override; default is localhost for dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/skooldb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:anoop}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=akccoding@gmail.com
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Hikari pool
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:1800000}

# JPA / Hibernate
# CHANGED (step 3): was `update`, which let Hibernate mutate the schema on every
# startup. `validate` means Hibernate only CHECKS that the schema matches the
# entities and fails fast if it doesn't — it never alters anything. Flyway owns
# the schema now. If startup fails on a mismatch, that mismatch was already there;
# it was just invisible because Hibernate silently "fixed" it each time.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
# CHANGED: default was `true`. Combined with logging.level.org.hibernate.SQL=DEBUG
# below, every query was printed TWICE - once as "Hibernate: ..." by show-sql and
# once as "DEBUG org.hibernate.SQL" by the logger. Keeping the logger version
# (it has timestamps); set SPRING_JPA_SHOW_SQL=true to bring the other one back.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
# REMOVED: Hibernate has been warning about this on every startup
# (HHH90000025 "MySQLDialect does not need to be specified explicitly"). It is
# auto-detected from the JDBC connection - the log confirms "Database dialect:
# MySQLDialect, Database version: 8.0.46". Hibernate 7 is stricter about
# redundant config, and hard-coding a dialect blocks a future MySQL upgrade
# from selecting a better-matched one.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=false

# Logging
logging.level.root=INFO
logging.level.com.smsweb.sms=DEBUG
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:DEBUG}
# CHANGED: default was TRACE, which logs every BIND PARAMETER VALUE to app.log -
# that means student Aadhaar numbers, dates of birth and parent phone numbers were
# being written to disk in plaintext on every query. Off by default now; set
# HIBERNATE_BINDER_LOG=TRACE temporarily when you actually need to debug a query.
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG:OFF}

# Thymeleaf & static
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false
spring.servlet.multipart.location=${java.io.tmpdir}

# Spring Boot 4.0.x/4.1.x shipped with Tomcat's multipart *part count* limit
# (as opposed to file/request *size*, configured above) effectively defaulting
# to 10 instead of Tomcat's own documented default of 50 - a known regression:
# https://github.com/spring-projects/spring-boot/issues/49311
# Any form with more than 10 fields (e.g. student registration, ~50 fields)
# gets rejected with 413 Payload Too Large regardless of actual byte size.
# Set explicitly, comfortably above our largest form, until upstream fixes it.
server.tomcat.max-part-count=100

# ---------------------------------------------------------------------------
# File storage — all paths live under /app/data inside the container.
# Mount ONE volume in docker-compose:  C:/SMSAPP/data:/app/data
# The container auto-creates sub-folders on first use.
#
# Direct IntelliJ run (no Docker): override each var in Run Configuration,
#   e.g. STUDENT_IMAGE_PATH=C:/SMSAPP/data/images/students
# ---------------------------------------------------------------------------
student.image.storage.path=${STUDENT_IMAGE_PATH:/app/data/images/students}
employee.image.storage.path=${EMPLOYEE_IMAGE_PATH:/app/data/images/employees}
school.image.storage.path=${SCHOOL_IMAGE_PATH:/app/data/images/schools}
customer.image.storage.path=${CUSTOMER_IMAGE_PATH:/app/data/images/customers}
app.download.docs.path=${DOWNLOAD_DOCS_PATH:/app/data/download_docs}
app.backup.mysqldumpPath=${MYSQLDUMP_PATH:/usr/bin/mysqldump}
app.backup.path=${BACKUP_PATH:/app/data/backups}
message.attachment.storage.path=${MESSAGE_ATTACHMENT_PATH:/app/data/message_attachments}

# JSON
# REMOVED for Jackson 3 (Boot 4): WRITE_DATES_AS_TIMESTAMPS is no longer part of
# SerializationFeature - it moved to the new DateTimeFeature enum, so binding it
# under spring.jackson.serialization.* fails at startup. It also changed default:
# DISABLED in Jackson 3, ENABLED in Jackson 2. This app set it to false, which is
# now the default - so deleting the line preserves the exact same behaviour and
# date formats on /api/v1/** are unchanged.
# spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# ── Flyway ───────────────────────────────────────────────────────────────────
# The database already exists and is full of real data, so Flyway must NOT try to
# run V1__baseline.sql against it. baseline-on-migrate stamps the existing schema
# as already being at version 1 and starts applying from V2 onward. V1 still
# matters: it is what builds the schema from nothing on a fresh machine or CI.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
